        my += (oy / od) * f;
      }
    }
    const ml = hypot(mx, my) || 1;
    mx /= ml; my /= ml;

    if (p.hp <= 0) sp *= 0.25;
    if (z.buffT > 0) sp *= 1.35;
    const beforeX = z.x, beforeY = z.y;
    tryMove(z, (mx * sp + z.kx) * dt, (my * sp + z.ky) * dt);

    // обход препятствий: если нет прогресса к цели — скользим вдоль стены
    const progress = (z.x - beforeX) * mx + (z.y - beforeY) * my;
    if (progress < sp * dt * 0.3 && d > z.r + p.r + 12 && sp > 1){
      z.slideT = (z.slideT || 0) - dt;
      if (z.slideT <= 0 || !z.slideSide){
        z.slideT = rand(0.5, 1.1);
        z.slideSide = Math.random() < 0.5 ? 1 : -1;
      }
      const px = -my * z.slideSide, py = mx * z.slideSide;
      const sx = z.x, sy = z.y;
      tryMove(z, px * sp * dt, py * sp * dt);
      if (hypot(z.x - sx, z.y - sy) < sp * dt * 0.25){
        z.slideSide = -z.slideSide;
        z.slideT = 0.55;
      }
    } else {
      z.slideT = 0;
    }

    z.x = clamp(z.x, z.r + 4, WORLD.w - z.r - 4);
    z.y = clamp(z.y, z.r + 4, WORLD.h - z.r - 4);

    // если долго упирается в стену — переставляем в свободную точку рядом с игроком
    if (progress < sp * dt * 0.22 && d > z.r + p.r + 30) z.blockT = (z.blockT || 0) + dt;
    else z.blockT = 0;
    if (z.blockT > (z.type === 'boss' ? 2.4 : 5.0)){
      const spot = findFreeSpot(p.x, p.y, z.r + 4, 620, 820);
      for (let k = 0; k < 8; k++){
        addParticle({
          x: z.x, y: z.y, vx: rand(-60, 60), vy: rand(-60, 60),
          life: rand(0.25, 0.6), max: 0.6, size: rand(5, 14),
          color: '#4a4a48', drag: 0.004, grav: 0, kind: 'smoke'
        });
      }
      z.x = spot.x; z.y = spot.y;
      z.blockT = 0; z.stuck = 0; z.slideT = 0;
      z.kx = 0; z.ky = 0;
      addShock(z.x, z.y, z.r * 2.4, '#8a7a5a', 2);
    }

    // страховка от застревания в углах (телепорт только за экраном)
    z.chk = (z.chk || 0) + dt;
    if (z.chk > 1.2){
      const moved = hypot(z.x - (z.lx === undefined ? z.x : z.lx), z.y - (z.ly === undefined ? z.y : z.ly));
      if (d > 760 && moved < 10) z.stuck = (z.stuck || 0) + 1.2;
      else z.stuck = 0;
      z.chk = 0; z.lx = z.x; z.ly = z.y;
    }
    if ((z.stuck || 0) > 6){
      const spot = findFreeSpot(p.x, p.y, z.r + 4, 380, 560);
      z.x = spot.x; z.y = spot.y; z.stuck = 0;
    }

    // горение от огненных патронов
    if (z.burnT > 0){
      z.burnT -= dt;
      z.burnTick = (z.burnTick || 0) - dt;
      if (Math.random() < 0.55){
        addParticle({
          x: z.x + rand(-z.r * 0.75, z.r * 0.75), y: z.y + rand(-z.r * 0.75, z.r * 0.75),
          vx: rand(-32, 32), vy: rand(-105, -35),
          life: rand(0.2, 0.5), max: 0.5, size: rand(2, 5.5),
          color: pick(['#ffcc44', '#ff8a2a', '#ff5a1a']),
          drag: 0.003, grav: 0, kind: 'fire'
        });
      }
      if (Math.random() < 0.16){
        addParticle({
          x: z.x, y: z.y - z.r * 0.5, vx: rand(-18, 18), vy: rand(-70, -26),
          life: rand(0.6, 1.2), max: 1.2, size: rand(6, 12),
          color: '#3c3c34', drag: 0.004, grav: 0, kind: 'smoke'
        });
      }
      if (z.burnTick <= 0){
        z.burnTick = 0.34;
        z.hp -= 8;
        floatText(z.x, z.y - z.r * 1.5, '8', '#ff9a3a', 12);
        if (z.hp <= 0){
          killZombie(z, 1.1, -dx, -dy);
          continue;
        }
      }
    }

    if (d < z.r + p.r + 4 && z.atkCd <= 0){
      z.atkCd = z.type === 'boss' ? 1.05 : 0.95;
      const hit = (z.chargeT > 0 ? z.dmg * 0.85 : z.dmg) * (z.buffT > 0 ? 1.25 : 1);
      hurtPlayer(Math.round(hit));
      const kb = z.dashT > 0 ? 230 : z.chargeT > 0 ? 240 : 90;
      z.kx -= (dx / d) * kb;
      z.ky -= (dy / d) * kb;
    }
  }
}

/* ------------------------- enemy bullets ------------------------ */
function updateEnemyBullets(dt){
  for (let i = enemyBullets.length - 1; i >= 0; i--){
    const b = enemyBullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    addParticle({
      x: b.x, y: b.y, vx: rand(-20, 20), vy: rand(-20, 20),
      life: 0.25, max: 0.25, size: rand(2, 4), color: '#8fe04a',
      drag: 0.001, grav: 0, kind: 'acid'
    });
    if (b.life <= 0 || pointInWall(b.x, b.y, 2)){
      stampBlood(b.x, b.y, 5, 'rgba(60,110,20,', 1.3);
      if (b.leavePool) addPool(b.x, b.y, 38, '74,140,22', 4);
      enemyBullets.splice(i, 1);
      continue;
    }
    if (dist2(b.x, b.y, player.x, player.y) < (b.r + player.r) * (b.r + player.r)){
      hurtPlayer(b.dmg || 12, 'acid');
      stampBlood(b.x, b.y, 6, 'rgba(60,110,20,', 1.4);
      if (b.leavePool) addPool(b.x, b.y, 30, '74,140,22', 4);
      enemyBullets.splice(i, 1);
    }
  }
}

/* --------------------------- bullets ---------------------------- */
function updateBullets(dt){
  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    if (b.fire && Math.random() < (b.flame ? 0.4 : 0.75)){
      addParticle({
        x: b.x, y: b.y, vx: rand(-18, 18), vy: rand(-18, 18),
        life: rand(0.12, 0.3), max: 0.3, size: rand(1.2, 3),
        color: pick(['#ffcc44', '#ff8a2a']),
        drag: 0.004, grav: 0, kind: 'fire'
      });
    }
    const vlen = hypot(b.vx, b.vy);
    const steps = Math.max(1, Math.ceil((vlen * dt) / 16));
    let dead = false;

    for (let s = 0; s < steps && !dead; s++){
      b.x += (b.vx * dt) / steps;
      b.y += (b.vy * dt) / steps;
      b.life -= dt / steps;

      if (b.life <= 0){ dead = true; break; }
      if (pointInWall(b.x, b.y, 0)){
        if (b.rocket) rocketBoom(b.x, b.y, b.dmg);
        else sparks(b.x, b.y, b.vx, b.vy);
        stampBlood(b.x, b.y, 1, 'rgba(20,20,20,', 0.7);
        dead = true; break;
      }
      for (const z of zombies){
        if (z.dead) continue;
        const rr = z.r + b.r;
        if (dist2(b.x, b.y, z.x, z.y) < rr * rr){
          if (b.hits.has(z.id)) continue;
          b.hits.add(z.id);
          if (b.rocket){
            rocketBoom(b.x, b.y, b.dmg);
            dead = true;
            break;
          }
          damageZombie(z, b.dmg, b.vx, b.vy, b.crit, b.power, b.fire);
          if (b.pierce-- <= 0) dead = true;
          break;
        }
      }
    }
    if (dead || b.x < 0 || b.y < 0 || b.x > WORLD.w || b.y > WORLD.h){
      bullets.splice(i, 1);
    }
  }
}

/* -------------------------- particles --------------------------- */
function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0){
      if (p.kind === 'blood' && Math.random() < 0.65){
        stampBlood(p.x, p.y, 1, 'rgba(130,10,10,', rand(0.5, 1.1));
      }
      particles.splice(i, 1);
      continue;
    }
    const k = Math.pow(p.drag || 0.001, dt);
    p.vx *= k; p.vy *= k;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.grav) p.vy += p.grav * dt;
  }
}

function updateFlashes(dt){
  for (let i = flashes.length - 1; i >= 0; i--){
    flashes[i].life -= dt;
    if (flashes[i].life <= 0) flashes.splice(i, 1);
  }
}

/* --------------------------- pickups ---------------------------- */
function updatePickups(dt){
  for (let i = pickups.length - 1; i >= 0; i--){
    const p = pickups[i];
    p.t += dt * 3;
    p.life += dt;
    const rr = player.r + 22;
    if (dist2(p.x, p.y, player.x, player.y) < rr * rr){
      applyPickup(p);
      pickups.splice(i, 1);
    }
  }
}

/* ---------------------------- waves ----------------------------- */
function updateWave(dt){
  if (state.waveState === 'break'){
    state.breakT -= dt;
    if (state.breakT <= 0) beginWave();
    return;
  }
  if (state.waveState === 'fight'){
    if (state.spawnLeft > 0){
      state.spawnTimer -= dt;
      while (state.spawnTimer <= 0 && state.spawnLeft > 0){
        state.spawnTimer += Math.max(0.13, 0.66 - state.wave * 0.024);
        spawnZombie(pickType());
        state.spawnLeft--;
      }
    } else if (state.bossPending && !state.bossSpawned){
      state.bossPending = false;
      state.bossSpawned = true;
      spawnZombie('boss');
      const bossName = bossForWave(state.wave).name;
      banner(bossName, 'ЦЕЛЬ ОБНАРУЖЕНА');
      state.shake = 12;
    }
    if (state.spawnLeft <= 0 && !state.bossPending && zombies.length === 0){
      clearWave();
    }
  }
}

/* --------------------------- camera ----------------------------- */
function updateCamera(dt){
  const look = 60;
  const vw = viewW(), vh = viewH();
  const tx = clamp(player.x + Math.cos(player.aim) * look - vw / 2, 0, Math.max(0, WORLD.w - vw));
  const ty = clamp(player.y + Math.sin(player.aim) * look - vh / 2, 0, Math.max(0, WORLD.h - vh));
  const k = 1 - Math.pow(0.0025, dt);
  cam.x = lerp(cam.x, tx, k);
  cam.y = lerp(cam.y, ty, k);
  if (WORLD.w <= vw) cam.x = (WORLD.w - vw) / 2;
  if (WORLD.h <= vh) cam.y = (WORLD.h - vh) / 2;
}

/* ---------------------------- update ---------------------------- */
function update(dt){
  if (state.mode === 'playing'){
    state.time += dt;
    updatePlayer(dt);
    updateBullets(dt);
    updateEnemyBullets(dt);
    updateZombies(dt);
    updatePickups(dt);
    updateGrenades(dt);
    updateMines(dt);
    updateGibs(dt);
    updatePools(dt);
    updateShockwaves(dt);
    updateTexts(dt);
    updateWave(dt);
  } else {
    // легкое дыхание камеры в меню/паузе
    player.now += dt * 0.4;
  }
  updateParticles(dt);
  updateBushes(dt);
  updateFlashes(dt);
  updateScreenBlood(dt);
  updateCamera(dt);

  state.shake *= Math.pow(0.0025, dt);
  if (state.shake < 0.06) state.shake = 0;
  state.sx = rand(-1, 1) * state.shake;
  state.sy = rand(-1, 1) * state.shake;
  state.flash = Math.max(0, state.flash - dt * 2.6);
  state.hitMarkT = Math.max(0, state.hitMarkT - dt);
  state.bannerT = Math.max(0, state.bannerT - dt);
  if (state.popupT > 0) state.popupT = Math.max(0, state.popupT - dt);
  if (state.pickupT > 0) state.pickupT = Math.max(0, state.pickupT - dt);
  if (state.unlockT > 0) state.unlockT = Math.max(0, state.unlockT - dt);
}

/* ============================ RENDER ============================ */
function drawFloor(vx, vy){
  const vw = viewW(), vh = viewH();
  ctx.fillStyle = floorPattern;
  ctx.fillRect(vx - 8, vy - 8, vw + 16, vh + 16);
}

function drawDecals(vx, vy){
  const sx0 = Math.max(0, Math.floor(vx));
  const sy0 = Math.max(0, Math.floor(vy));
  const sw = Math.min(WORLD.w - sx0, Math.ceil(viewW()) + 4);
  const sh = Math.min(WORLD.h - sy0, Math.ceil(viewH()) + 4);
  if (sw > 0 && sh > 0){
    ctx.drawImage(decals, sx0, sy0, sw, sh, sx0, sy0, sw, sh);
  }
}

/* кустарник: нижний слой (на земле) */
function drawBushes(vx, vy){
  for (const b of bushes){
    if (b.x + b.r * 1.6 < vx || b.y + b.r * 1.6 < vy || b.x - b.r * 1.6 > vx + viewW() || b.y - b.r * 1.6 > vy + viewH()) continue;
    const sway = Math.sin(state.time * 1.1 + b.ph) * 2 + b.sway * 5;

    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.beginPath();
    ctx.ellipse(b.x + 5, b.y + 7, b.r * 1.02, b.r * 0.66, 0, 0, TAU);
    ctx.fill();

    const deep = b.dry ? '#3a3a1c' : '#16281a';
    const mid = b.dry ? '#4e4a22' : '#20361f';
    const top = b.dry ? '#6a622e' : '#2f4a26';

    for (let i = 0; i < b.los.length; i++){
      const l = b.los[i];
      const a = l.a + sway * 0.006;
      const lx = b.x + Math.cos(a) * b.r * l.d;
      const ly = b.y + Math.sin(a) * b.r * l.d * 0.82;
      ctx.fillStyle = i % 3 === 0 ? mid : deep;
      ctx.beginPath();
      ctx.ellipse(lx, ly, b.r * l.s, b.r * l.s * 0.82, l.rot, 0, TAU);
      ctx.fill();
    }
    // верхние листики
    for (const l of b.los){
      const a = l.a + sway * 0.02;
      const lx = b.x + Math.cos(a) * b.r * l.d * 0.85;
      const ly = b.y + Math.sin(a) * b.r * l.d * 0.7 - b.r * 0.18;
      ctx.fillStyle = top;
      ctx.globalAlpha = 0.8;
      ctx.beginPath();
      ctx.ellipse(lx, ly, b.r * l.s * 0.62, b.r * l.s * 0.44, l.rot, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // сухие ветки
    if (b.dry){
      ctx.strokeStyle = 'rgba(120,105,60,0.55)';
      ctx.lineWidth = 1.6;
      for (let i = 0; i < 4; i++){
        const a = (i / 4) * TAU + b.ph + sway * 0.01;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x + Math.cos(a) * b.r * 0.9, b.y + Math.sin(a) * b.r * 0.7 - b.r * 0.2);
        ctx.stroke();
      }
    }
  }
}

/* верхушки кустов поверх персонажей — эффект «спрятался в кустах» */
function drawBushTops(vx, vy){
  for (const b of bushes){
    if (b.x + b.r * 1.6 < vx || b.y + b.r * 1.6 < vy || b.x - b.r * 1.6 > vx + viewW() || b.y - b.r * 1.6 > vy + viewH()) continue;
    const sway = Math.sin(state.time * 1.3 + b.ph * 1.7) * 2.4 + b.sway * 6;
    const top = b.dry ? '#7a7038' : '#3b5c2c';
    ctx.save();
    ctx.globalAlpha = 0.42 + b.sway * 0.2;
    for (let i = 0; i < b.los.length; i++){
      const l = b.los[i];
      const a = l.a + sway * 0.008;
      const lx = b.x + Math.cos(a) * b.r * l.d;
      const ly = b.y + Math.sin(a) * b.r * l.d * 0.8 - b.r * 0.3;
      ctx.fillStyle = top;
      ctx.beginPath();
      ctx.ellipse(lx, ly, b.r * l.s * 0.8, b.r * l.s * 0.5, l.rot + sway * 0.01, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }
}

/* шелест: колыхание и листья, когда игрок продирается сквозь куст */
function updateBushes(dt){
  for (const b of bushes){
    const near = dist2(player.x, player.y, b.x, b.y) < (b.r + 46) * (b.r + 46);
    b.sway += ((near ? 1 : 0) - b.sway) * Math.min(1, dt * 7);
    if (near && Math.random() < dt * 7){
      addParticle({
        x: b.x + rand(-b.r * 0.75, b.r * 0.75),
        y: b.y + rand(-b.r * 0.55, b.r * 0.55),
        vx: rand(-26, 26), vy: rand(-46, -8),
        life: rand(0.45, 1.0), max: 1.0, size: rand(2, 4),
        color: b.dry ? '#9a8a4a' : pick(['#5f8a3a', '#4a6f2c', '#7aa04a']),
        drag: 0.004, grav: 42, kind: 'leaf'
      });
    }
  }
}

function drawWalls(vx, vy){
  for (const w of walls){
    if (w.x + w.w < vx - 40 || w.y + w.h < vy - 40 || w.x > vx + viewW() + 40 || w.y > vy + viewH() + 40) continue;

    // тень
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(w.x + 8, w.y + 10, w.w, w.h);

    if (w.kind === 'crate'){
      const g = ctx.createLinearGradient(w.x, w.y, w.x + w.w, w.y + w.h);
      g.addColorStop(0, '#2b383b');
      g.addColorStop(0.55, '#1d2628');
      g.addColorStop(1, '#141b1d');
      ctx.fillStyle = g;
      ctx.fillRect(w.x, w.y, w.w, w.h);

      ctx.strokeStyle = 'rgba(255,181,69,0.20)';
      ctx.lineWidth = 2;
      ctx.strokeRect(w.x + 3, w.y + 3, w.w - 6, w.h - 6);

      // крест-накрест
      ctx.strokeStyle = 'rgba(0,0,0,0.45)';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(w.x + 8, w.y + 8); ctx.lineTo(w.x + w.w - 8, w.y + w.h - 8);
      ctx.moveTo(w.x + w.w - 8, w.y + 8); ctx.lineTo(w.x + 8, w.y + w.h - 8);
      ctx.stroke();

      // заклепки
      ctx.fillStyle = 'rgba(255,220,160,0.22)';
      const pad = 9;
      for (const [rx, ry] of [[pad, pad], [w.w - pad, pad], [pad, w.h - pad], [w.w - pad, w.h - pad]]){
        ctx.beginPath(); ctx.arc(w.x + rx, w.y + ry, 2.2, 0, TAU); ctx.fill();
      }
      // лампа-полоска
      ctx.fillStyle = 'rgba(255,181,69,0.14)';
      ctx.fillRect(w.x + w.w * 0.5 - 10, w.y + w.h - 7, 20, 2);
    } else {
      const g = ctx.createLinearGradient(w.x, w.y, w.x, w.y + w.h);
      g.addColorStop(0, '#33403f');
      g.addColorStop(0.35, '#22302f');
      g.addColorStop(1, '#151d1d');
      ctx.fillStyle = g;
      ctx.fillRect(w.x, w.y, w.w, w.h);

      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.lineWidth = 2;
      ctx.strokeRect(w.x + 1, w.y + 1, w.w - 2, w.h - 2);

      // полоса-предупреждение
      ctx.save();
      ctx.beginPath();
      ctx.rect(w.x + 2, w.y + 2, w.w - 4, w.h - 4);
      ctx.clip();
      ctx.strokeStyle = 'rgba(255,181,69,0.10)';
      ctx.lineWidth = 10;
      for (let i = -w.h; i < w.w + w.h; i += 34){
        ctx.beginPath();
        ctx.moveTo(w.x + i, w.y + w.h);
        ctx.lineTo(w.x + i + w.h, w.y);
        ctx.stroke();
      }
      ctx.restore();

      // верхняя кромка
      ctx.fillStyle = 'rgba(200,225,220,0.10)';
      ctx.fillRect(w.x, w.y, w.w, 3);
    }
  }
}

function drawPlayer(){
  const p = player;
  const hurt = p.hurtT > 0;
  ctx.save();
  ctx.translate(p.x, p.y);

  // тень
  ctx.fillStyle = 'rgba(0,0,0,0.42)';
  ctx.beginPath(); ctx.ellipse(0, p.r * 0.62, p.r * 1.15, p.r * 0.55, 0, 0, TAU); ctx.fill();

  // след рывка
  if (p.dashT > 0){
    for (let i = 1; i <= 4; i++){
      ctx.globalAlpha = 0.24 / i;
      ctx.fillStyle = '#79c8bb';
      ctx.beginPath();
      ctx.ellipse(-p.vx * 0.012 * i, -p.vy * 0.012 * i, p.r * 0.9, p.r * 0.8, 0, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(121,200,187,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-p.vx * 0.05, -p.vy * 0.05);
    ctx.lineTo(-p.vx * 0.11, -p.vy * 0.11);
    ctx.stroke();
  }

  ctx.rotate(p.aim);

  const stride = p.moving ? Math.sin(p.now * 15) * 5 : 0;
  const bob = p.moving ? Math.sin(p.now * 30) * 0.7 : Math.sin(p.now * 2) * 0.35;
  const step = p.moving ? Math.cos(p.now * 15) * 1.6 : 0;

  // ---- ранец / топливный бак ----
  if (p.cur === 'flame'){
    ctx.fillStyle = hurt ? '#7a3a2a' : '#3a3f36';
    ctx.beginPath(); ctx.roundRect(-13, -8, 8, 16, 3); ctx.fill();
    ctx.fillStyle = '#b0482a';
    ctx.beginPath(); ctx.roundRect(-12, -7, 6, 6, 2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(-12, 1, 6, 6, 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,180,100,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-9, -8); ctx.lineTo(-4, -4); ctx.stroke();
  } else {
    ctx.fillStyle = hurt ? '#6a3a2a' : '#26302f';
    ctx.beginPath(); ctx.roundRect(-11, -7, 7, 14, 2.5); ctx.fill();
    ctx.fillStyle = 'rgba(255,181,69,0.35)';
    ctx.fillRect(-10, -4, 5, 2);
    ctx.fillStyle = 'rgba(120,200,185,0.3)';
    ctx.fillRect(-10, 1, 5, 2);
  }

  // ---- ноги: бедро, колено, голень, ботинок ----
  ctx.lineCap = 'round';
  for (const s of [-1, 1]){
    const ph = s > 0 ? 0 : Math.PI;
    const sw2 = p.moving ? Math.sin(p.now * 15 + ph) * 4.5 : 0;
    const hipX = -3, hipY = s * 6;
    const kneeX = 2 + sw2 * 0.5 + step * s;
    const kneeY = s * 10;
    const footX = 8 + sw2;
    const footY = s * 11.5;
    // бедро
    ctx.strokeStyle = hurt ? '#8a4a36' : '#33403e';
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.lineTo(kneeX, kneeY); ctx.stroke();
    // голень
    ctx.strokeStyle = hurt ? '#a35a44' : '#2a3534';
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(kneeX, kneeY); ctx.lineTo(footX, footY); ctx.stroke();
    // наколенник
    ctx.fillStyle = 'rgba(255,181,69,0.55)';
    ctx.beginPath(); ctx.arc(kneeX, kneeY, 2.4, 0, TAU); ctx.fill();
    // ботинок
    ctx.fillStyle = hurt ? '#5a2a20' : '#141b1b';
    ctx.beginPath();
    ctx.ellipse(footX + 2, footY, 5, 3.2, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // ---- корпус: бронежилет ----
  ctx.fillStyle = hurt ? '#a35a44' : '#2e3c3c';
  ctx.beginPath();
  ctx.ellipse(0, bob * 0.3, p.r * 0.96, p.r * 0.86, 0, 0, TAU);
  ctx.fill();

  // наплечники
  for (const s of [-1, 1]){
    ctx.fillStyle = hurt ? '#8a4a36' : '#3d4d4b';
    ctx.beginPath();
    ctx.ellipse(-1, s * 8.5, 6.4, 4.6, s * 0.35, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,181,69,0.4)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }

  // ремни и подсумки
  ctx.strokeStyle = 'rgba(20,26,26,0.85)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-7, -6); ctx.lineTo(7, 6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-7, 6); ctx.lineTo(7, -6); ctx.stroke();
  ctx.fillStyle = hurt ? '#7a3a2a' : '#202a29';
  ctx.beginPath(); ctx.roundRect(-6, -4, 6, 4, 1.5); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-6, 1, 6, 4, 1.5); ctx.fill();
  ctx.strokeStyle = 'rgba(255,181,69,0.55)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-5, -2.2); ctx.lineTo(-1, -2.2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-5, 3); ctx.lineTo(-1, 3); ctx.stroke();

  // центральная бронепластина
  ctx.fillStyle = 'rgba(255,181,69,0.72)';
  ctx.beginPath(); ctx.roundRect(-4.5, -4.5, 7, 9, 1.5); ctx.fill();
  ctx.strokeStyle = 'rgba(60,40,10,0.6)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,240,200,0.8)';
  ctx.fillRect(-3.5, -3.4, 1.4, 1.4);

  // светоотражающие полосы
  ctx.strokeStyle = 'rgba(140,220,205,0.55)';
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, 0, p.r * 0.78, -0.7, 0.7); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, p.r * 0.78, Math.PI - 0.7, Math.PI + 0.7); ctx.stroke();

  // ---- оружие в руках ----
  const gun = {
    pistol:    { len: 20, w: 6.5, body: 13, mag: 0,  sight: false, wood: false },
    smg:       { len: 25, w: 7,   body: 15, mag: 9,  sight: false, wood: false },
    shotgun:   { len: 31, w: 8,   body: 17, mag: 0,  sight: false, wood: false, pump: true },
    ak:        { len: 34, w: 7.5, body: 18, mag: 12, sight: true,  wood: true },
    ar:        { len: 33, w: 7,   body: 17, mag: 12, sight: true,  wood: false },
    railgun:   { len: 42, w: 9,   body: 22, mag: 0,  sight: true,  wood: false, coils: true },
    rocket:    { len: 32, w: 12,  body: 20, mag: 0,  sight: true,  wood: false, tube: true },
    flame:     { len: 29, w: 9,   body: 17, mag: 0,  sight: false, wood: false, nozzle: true },
    minelayer: { len: 27, w: 11,  body: 16, mag: 0,  sight: false, wood: false, drum: true }
  }[p.cur] || { len: 22, w: 7, body: 14, mag: 0, sight: false, wood: false };
  const gx = 7;

  // приклад
  if (!gun.tube && !gun.nozzle){
    ctx.fillStyle = '#1a2223';
    ctx.beginPath(); ctx.roundRect(2, -2.6, 8, 5.2, 1.4); ctx.fill();
  }
  // ствольная коробка
  ctx.fillStyle = gun.wood ? '#5a3a22' : '#1b2426';
  ctx.beginPath(); ctx.roundRect(gx, -gun.w / 2, gun.body, gun.w, 1.6); ctx.fill();
  // ствол
  ctx.fillStyle = '#0f1517';
  ctx.fillRect(gx + gun.body, -gun.w * 0.28, gun.len - gun.body, gun.w * 0.56);
  ctx.fillStyle = 'rgba(180,200,200,0.35)';
  ctx.fillRect(gx + gun.body, -gun.w * 0.28, gun.len - gun.body, 1);
  // дуло
  ctx.fillStyle = '#2a3436';
  ctx.fillRect(gx + gun.len - 3, -gun.w * 0.42, 3, gun.w * 0.84);

  // магазин
  if (gun.mag){
    ctx.fillStyle = '#1a2223';
    ctx.beginPath();
    ctx.roundRect(gx + gun.body * 0.42, gun.w * 0.36, 5.5, gun.mag, 1.4);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,181,69,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  // помпа / цевьё
  if (gun.pump){
    ctx.fillStyle = '#3c4a49';
    ctx.beginPath(); ctx.roundRect(gx + gun.body * 0.7, -gun.w / 2 - 0.8, 8, gun.w + 1.6, 2); ctx.fill();
  }
  if (gun.wood){
    ctx.fillStyle = '#6a4628';
    ctx.beginPath(); ctx.roundRect(gx + gun.body * 0.55, -gun.w / 2 - 0.5, 7, gun.w + 1, 1.6); ctx.fill();
  }
  // прицел
  if (gun.sight){
    ctx.fillStyle = '#26302f';
    ctx.fillRect(gx + gun.body * 0.4, -gun.w / 2 - 3, 7, 3);
    ctx.fillStyle = 'rgba(140,230,220,0.75)';
    ctx.fillRect(gx + gun.body * 0.4 + 5, -gun.w / 2 - 2.4, 1.6, 1.6);
  }
  // катушки рейлгана
  if (gun.coils){
    ctx.strokeStyle = 'rgba(120,240,255,0.85)';
    ctx.lineWidth = 1.6;
    for (let k = 0; k < 3; k++){
      ctx.beginPath();
      ctx.arc(gx + gun.body + 3 + k * 4.5, 0, gun.w * 0.85, -1.2, 1.2);
      ctx.stroke();
    }
  }
  // труба ракетницы
  if (gun.tube){
    ctx.strokeStyle = 'rgba(255,181,69,0.55)';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(gx + 5, 0, gun.w * 0.75, -1.4, 1.4); ctx.stroke();
  }
  // сопло огнемёта
  if (gun.nozzle){
    ctx.fillStyle = '#4a5450';
    ctx.beginPath(); ctx.roundRect(gx + gun.len - 4, -gun.w * 0.7, 5, gun.w * 1.4, 1.5); ctx.fill();
    ctx.fillStyle = 'rgba(255,150,60,0.5)';
    ctx.fillRect(gx + gun.len + 1, -1.4, 2, 2.8);
  }
  // барабан миномёта
  if (gun.drum){
    ctx.fillStyle = '#2c3834';
    ctx.beginPath(); ctx.arc(gx + gun.body * 0.62, 0, 6.4, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(154,255,154,0.65)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    for (let k = 0; k < 4; k++){
      const a = (k / 4) * TAU;
      ctx.fillStyle = 'rgba(154,255,154,0.6)';
      ctx.beginPath(); ctx.arc(gx + gun.body * 0.62 + Math.cos(a) * 3.4, Math.sin(a) * 3.4, 1.2, 0, TAU); ctx.fill();
    }
  }

  // руки к оружию
  const holdX = gx + (gun.tube ? 7 : gun.body * 0.5);
  for (const s of [-1, 1]){
    ctx.strokeStyle = hurt ? '#a35a44' : '#26302f';
    ctx.lineWidth = 4.6;
    ctx.beginPath();
    ctx.moveTo(1, s * 7);
    ctx.lineTo(holdX - 2, s * (s > 0 ? 2.4 : 4.2));
    ctx.stroke();
    // плечевой сегмент
    ctx.strokeStyle = hurt ? '#8a4a36' : '#3a4a48';
    ctx.lineWidth = 5.4;
    ctx.beginPath();
    ctx.moveTo(-2, s * 6.8);
    ctx.lineTo(2, s * 5.2);
    ctx.stroke();
    // перчатка
    ctx.fillStyle = '#141b1c';
    ctx.beginPath(); ctx.arc(holdX, s * (s > 0 ? 1.6 : 3), 2.6, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,181,69,0.4)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // ---- голова и шлем ----
  ctx.fillStyle = hurt ? '#e0a080' : '#d9c39a';
  ctx.beginPath(); ctx.arc(2.5, 0, p.r * 0.47, 0, TAU); ctx.fill();
  // шлем
  ctx.fillStyle = hurt ? '#8a4a36' : '#39494b';
  ctx.beginPath(); ctx.arc(2, 0, p.r * 0.52, Math.PI * 0.52, Math.PI * 1.48); ctx.fill();
  // козырёк / визор
  ctx.fillStyle = 'rgba(140,230,220,0.75)';
  ctx.beginPath();
  ctx.roundRect(p.r * 0.3, -4.2, 4.6, 8.4, 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillRect(p.r * 0.3 + 1, -3.2, 1.2, 2.4);
  // фонарь на шлеме
  ctx.fillStyle = '#ffd98a';
  ctx.beginPath(); ctx.arc(p.r * 0.6, 0, 2.2, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(255,230,160,0.35)';
  ctx.beginPath(); ctx.arc(p.r * 0.6, 0, 5.5, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  // гарнитура и антенна
  ctx.fillStyle = '#202a2a';
  ctx.beginPath(); ctx.arc(-1, -p.r * 0.48, 2.3, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(140,220,205,0.8)';
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-2, -p.r * 0.48); ctx.lineTo(-6, -p.r * 0.75); ctx.stroke();
  // ремешок шлема
  ctx.strokeStyle = 'rgba(20,26,26,0.8)';
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(2, 0, p.r * 0.5, 1.25, 1.9); ctx.stroke();

  // индикатор перезарядки
  if (p.reloadT > 0){
    ctx.fillStyle = 'rgba(255,181,69,0.9)';
    ctx.beginPath(); ctx.arc(gx + gun.body * 0.3, 5, 2.2, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,181,69,0.5)';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, 0, p.r + 5, -0.6, -0.6 + (1 - p.reloadT / 2) * 1.6); ctx.stroke();
  }

  if (p.inv > 0){
    ctx.globalAlpha = 0.25 + Math.sin(p.now * 40) * 0.15;
    ctx.strokeStyle = '#8fe6d4';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, p.r + 7, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // броня: холодное кольцо вокруг бойца
  if (p.armor > 0){
    ctx.globalAlpha = 0.34 + Math.sin(p.now * 4.2) * 0.12;
    ctx.strokeStyle = '#8fd8ff';
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(0, 0, p.r + 5.5, 0, TAU); ctx.stroke();
    const hp = p.armor / p.maxArmor;
    ctx.globalAlpha = 0.85;
    ctx.strokeStyle = '#c8f0ff';
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(0, 0, p.r + 5.5, -Math.PI / 2, -Math.PI / 2 + TAU * hp); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // кислотостойкость: зелёная пунктирная аура
  if (p.acidResistT > 0){
    ctx.globalAlpha = 0.22 + Math.sin(p.now * 5) * 0.08;
    ctx.strokeStyle = '#9cff4a';
    ctx.lineWidth = 1.3;
    ctx.setLineDash([4, 5]);
    ctx.beginPath(); ctx.arc(0, 0, p.r + 10, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function drawZombies(){
  for (const z of zombies){
    if (z.dead) continue;
    if (z.x < view.x - 120 || z.y < view.y - 120 || z.x > view.x + viewW() + 120 || z.y > view.y + viewH() + 120) continue;

    const flash = z.hitFlash > 0;
    ctx.save();
    ctx.translate(z.x, z.y);

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(0, z.r * 0.62, z.r * 1.15, z.r * 0.5, 0, 0, TAU); ctx.fill();

    // цветная аура — враг читается в темноте
    const auraR = z.r * (z.type === 'boss' ? 2.3 : 2.0);
    const aura = glowSprite(z.glow || '#a8ff6a', z.type === 'boss' ? 0.30 : 0.22);
    ctx.drawImage(aura, -auraR, -auraR, auraR * 2, auraR * 2);

    // кольцо на земле
    ctx.strokeStyle = hexA(z.glow, z.type === 'boss' ? 0.42 : 0.26);
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(0, z.r * 0.6, z.r * 1.25, z.r * 0.62, 0, 0, TAU); ctx.stroke();

    // тень-дымка призрака
    if (z.type === 'wraith'){
      ctx.globalAlpha = 0.16;
      ctx.fillStyle = '#8898c0';
      ctx.beginPath(); ctx.ellipse(0, 0, z.r * 1.7, z.r * 1.25, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // след рывка сталкера/гончей
    if ((z.type === 'stalker' || z.type === 'hound') && z.dashT > 0){
      for (let i = 1; i <= 3; i++){
        ctx.globalAlpha = 0.22 / i;
        ctx.fillStyle = z.color;
        ctx.beginPath();
        ctx.ellipse(-Math.cos(z.dashA) * z.r * 1.9 * i, -Math.sin(z.dashA) * z.r * 1.9 * i,
          z.r, z.r * 0.8, 0, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    ctx.rotate(z.face);
    if (z.type === 'stalker') ctx.globalAlpha = z.dashT > 0 ? 0.62 : 0.9;
    if (z.type === 'wraith') ctx.globalAlpha = 0.62 + Math.sin(state.time * 4 + z.id) * 0.08;

    const sw = Math.sin(z.wob) * 0.5;
    const skin = flash ? '#fff2d8' : (z.skin || z.color);
    const dark = flash ? '#ffe0b8' : '#2a3522';
    const eyeCol = z.bossEyes
      || (z.type === 'runner' ? '#ffd34a'
      : z.type === 'crawler' ? '#e8ff7a'
      : z.type === 'spitter' ? '#b6ff5a'
      : z.type === 'bloater' ? '#e0ff8a'
      : z.type === 'hound' ? '#ff7a3a'
      : z.type === 'bomber' ? '#ffb03a'
      : z.type === 'shrieker' ? '#d8a8ff'
      : z.type === 'splitter' ? '#a8e07a'
      : z.type === 'wraith' ? '#a8c8ff'
      : '#d9e9a6');

    // ---- лапы: 6 у обычных, 8 у боссов ----
    const legPairs = z.type === 'boss' ? 4 : 3;
    ctx.lineCap = 'round';
    for (const s of [-1, 1]){
      for (let k = 0; k < legPairs; k++){
        const bx = z.r * (0.34 - k * (0.62 / Math.max(1, legPairs - 1)));
        const by = s * z.r * 0.30;
        const dir = 0.95 - k * (1.75 / Math.max(1, legPairs - 1));
        const phase = z.wob * 1.5 + k * 2.05 + (s > 0 ? Math.PI : 0);
        const swing = Math.sin(phase) * z.r * 0.17;
        const reach = z.r * (legPairs > 3 ? 1.34 : 1.24);
        const kx = bx + dir * z.r * 0.56 + swing;
        const ky = by + s * z.r * 0.46;
        const fx = kx + dir * z.r * 0.4 - swing * 0.65;
        const fy = s * reach + Math.cos(phase) * z.r * 0.07;
        // бедро
        ctx.strokeStyle = flash ? '#ffe6bc' : '#1f2a1a';
        ctx.lineWidth = Math.max(2.4, z.r * (legPairs > 3 ? 0.17 : 0.15));
        ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(kx, ky); ctx.stroke();
        // голень
        ctx.strokeStyle = flash ? '#fff0d0' : '#3a482c';
        ctx.lineWidth = Math.max(1.8, z.r * 0.115);
        ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
        // коготок
        ctx.strokeStyle = flash ? '#fff' : lighten(z.skin || z.color, 0.4);
        ctx.lineWidth = Math.max(1.1, z.r * 0.06);
        ctx.beginPath();
        ctx.moveTo(fx, fy);
        ctx.lineTo(fx + dir * z.r * 0.16, fy + s * z.r * 0.09);
        ctx.stroke();
      }
    }

    // ---- крылья у летающих ----
    const winged = z.type === 'wraith' || z.type === 'bomber' ||
      z.type === 'shrieker' || z.type === 'stalker' || z.type === 'boss';
    if (winged){
      const flap = 0.6 + Math.sin(state.time * (z.type === 'wraith' ? 26 : 17) + z.id) * 0.26;
      const wa = z.type === 'stalker' ? 0.24 : 0.34;
      ctx.save();
      ctx.globalAlpha = wa;
      for (const s of [-1, 1]){
        ctx.fillStyle = lighten(z.skin || z.color, 0.55);
        ctx.beginPath();
        ctx.ellipse(-z.r * 0.25, s * z.r * 0.6, z.r * 0.88 * flap, z.r * 0.3, s * 0.38, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = hexA(z.glow, 0.55);
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.globalAlpha = wa * 0.65;
        for (let a = 0; a < 3; a++){
          ctx.beginPath();
          ctx.moveTo(-z.r * 0.18, s * z.r * 0.42);
          ctx.lineTo(-z.r * 0.3 - Math.cos(a * 0.6) * z.r * 0.68, s * z.r * (0.68 + a * 0.07));
          ctx.stroke();
        }
        ctx.globalAlpha = wa;
      }
      ctx.restore();
    }

    // ---- тело: брюшко + грудь ----
    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.ellipse(-z.r * 0.1, 0, z.r * 1.03, z.r * 0.82, 0, 0, TAU);
    ctx.fill();

    // светлый контур — силуэт не теряется
    ctx.strokeStyle = z.rim;
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = z.type === 'boss' ? 2.6 : 1.9;
    ctx.beginPath();
    ctx.ellipse(-z.r * 0.1, 0, z.r * 1.03, z.r * 0.82, 0, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // сегменты брюшка
    ctx.strokeStyle = hexA(flash ? '#ffffff' : '#1b2516', 0.55);
    ctx.lineWidth = Math.max(1, z.r * 0.07);
    for (let k = 0; k < 3; k++){
      const cx = -z.r * (0.2 + k * 0.26);
      const hh = z.r * (0.7 - k * 0.13);
      ctx.beginPath();
      ctx.ellipse(cx, 0, z.r * 0.15, hh, 0, Math.PI * 0.5, Math.PI * 1.5);
      ctx.stroke();
    }

    // надкрылья с бликом и швом
    ctx.fillStyle = hexA(lighten(flash ? '#fff2d8' : (z.skin || z.color), 0.24), 0.55);
    ctx.beginPath(); ctx.ellipse(-z.r * 0.42, -z.r * 0.24, z.r * 0.66, z.r * 0.4, -0.16, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-z.r * 0.42, z.r * 0.24, z.r * 0.66, z.r * 0.4, 0.16, 0, TAU); ctx.fill();
    ctx.strokeStyle = hexA('#101a10', 0.7);
    ctx.lineWidth = Math.max(1, z.r * 0.05);
    ctx.beginPath(); ctx.moveTo(-z.r * 1.05, 0); ctx.lineTo(z.r * 0.12, 0); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.28)';
    ctx.lineWidth = Math.max(1, z.r * 0.05);
    ctx.beginPath();
    ctx.ellipse(-z.r * 0.5, -z.r * 0.3, z.r * 0.42, z.r * 0.2, -0.2, Math.PI * 0.9, Math.PI * 1.65);
    ctx.stroke();

    // грудной щит
    ctx.fillStyle = hexA(lighten(flash ? '#fff2d8' : (z.skin || z.color), 0.34), 0.8);
    ctx.beginPath(); ctx.ellipse(z.r * 0.22, 0, z.r * 0.44, z.r * 0.52, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = hexA('#101a10', 0.45);
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // шипы на спине у тяжёлых
    if (z.type === 'brute' || z.type === 'armored' || z.type === 'boss'){
      ctx.strokeStyle = flash ? '#ffffff' : 'rgba(232,242,204,0.75)';
      ctx.lineWidth = Math.max(1.4, z.r * 0.055);
      for (let k = 0; k < (z.type === 'boss' ? 5 : 3); k++){
        const sx2 = -z.r * (0.55 - k * 0.24);
        ctx.beginPath();
        ctx.moveTo(sx2, 0);
        ctx.lineTo(sx2 - z.r * 0.12, -z.r * (0.5 + k * 0.05));
        ctx.stroke();
      }
    }

    // характерные детали тела
    if (z.type === 'bloater' || z.type === 'spitter'){
      ctx.fillStyle = z.type === 'bloater' ? 'rgba(150,200,50,0.55)' : 'rgba(110,170,70,0.35)';
      ctx.beginPath(); ctx.ellipse(-z.r * 0.15, 0, z.r * 0.8, z.r * 0.72, 0, 0, TAU); ctx.fill();
    }
    if (z.type === 'bloater'){
      ctx.fillStyle = 'rgba(215,245,120,0.8)';
      for (let k = 0; k < 6; k++){
        const a = (k / 6) * TAU + z.wob * 0.15;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * z.r * 0.55, Math.sin(a) * z.r * 0.45, z.r * 0.12, 0, TAU);
        ctx.fill();
      }
    } else if (z.type === 'spitter'){
      ctx.fillStyle = 'rgba(150,240,80,0.55)';
      ctx.beginPath(); ctx.arc(-z.r * 0.5, 0, z.r * 0.45, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(210,255,140,0.7)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(-z.r * 0.5, 0, z.r * 0.45, 0, TAU); ctx.stroke();
    } else if (z.type === 'armored'){
      // утолщённые панцирные щитки
      for (const s2 of [-1, 1]){
        for (let k = 0; k < 3; k++){
          const cx3 = z.r * (0.18 - k * 0.34);
          ctx.fillStyle = k % 2 ? 'rgba(150,165,150,0.9)' : 'rgba(120,138,122,0.95)';
          ctx.beginPath();
          ctx.ellipse(cx3, s2 * z.r * 0.62, z.r * 0.26, z.r * 0.3, s2 * 0.2, 0, TAU);
          ctx.fill();
          ctx.strokeStyle = 'rgba(24,34,28,0.8)';
          ctx.lineWidth = 1.6;
          ctx.stroke();
        }
      }
    } else if (z.type === 'crawler'){
      // низкое тело и лишние лапы
      ctx.fillStyle = 'rgba(30,40,20,0.55)';
      ctx.beginPath(); ctx.ellipse(-z.r * 0.2, 0, z.r * 1.1, z.r * 0.55, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#2a3422';
      ctx.lineWidth = Math.max(2, z.r * 0.18);
      for (const s2 of [-1, 1]){
        for (let k = 0; k < 3; k++){
          const bx = -z.r * 0.45 + k * z.r * 0.45;
          ctx.beginPath();
          ctx.moveTo(bx, s2 * z.r * 0.35);
          ctx.lineTo(bx + sw * 4 + z.r * 0.15, s2 * z.r * (0.95 + Math.sin(z.wob + k) * 0.12));
          ctx.stroke();
        }
      }
    } else if (z.type === 'hound'){
      // хребет и шипы
      ctx.fillStyle = 'rgba(50,34,22,0.85)';
      ctx.beginPath(); ctx.ellipse(-z.r * 0.2, 0, z.r * 0.95, z.r * 0.5, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#d8c8a0';
      ctx.lineWidth = 2;
      for (let k = 0; k < 4; k++){
        const bx = -z.r * 0.55 + k * z.r * 0.34;
        ctx.beginPath();
        ctx.moveTo(bx, 0);
        ctx.lineTo(bx - z.r * 0.08, -z.r * (0.7 - k * 0.06));
        ctx.stroke();
      }
    } else if (z.type === 'bomber'){
      // вздутые мешки и тлеющий фитиль
      ctx.fillStyle = 'rgba(255,120,40,' + (0.35 + Math.abs(Math.sin(state.time * 6)) * 0.35).toFixed(2) + ')';
      for (let k = 0; k < 5; k++){
        const a = (k / 5) * TAU + 0.5;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * z.r * 0.6, Math.sin(a) * z.r * 0.55, z.r * 0.22, 0, TAU);
        ctx.fill();
      }
      ctx.fillStyle = '#ffcf5a';
      ctx.beginPath(); ctx.arc(z.r * 0.1, 0, z.r * 0.16, 0, TAU); ctx.fill();
      if (z.fuse > 0){
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = 'rgba(255,170,60,0.55)';
        ctx.beginPath(); ctx.arc(0, 0, z.r * (1.3 + z.fuse), 0, TAU); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      }
    } else if (z.type === 'shrieker'){
      // огромный вопящий рот
      ctx.fillStyle = 'rgba(40,20,50,0.85)';
      ctx.beginPath();
      ctx.ellipse(z.r * 0.25, 0, z.r * 0.42, z.r * 0.34 + Math.abs(Math.sin(z.wob * 0.6)) * z.r * 0.1, 0, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(200,160,255,0.8)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(z.r * 0.25, 0, z.r * 0.42, z.r * 0.34, 0, 0, TAU);
      ctx.stroke();
      // горловые кольца
      if (z.screamCd < 0.5){
        ctx.strokeStyle = 'rgba(220,180,255,0.55)';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, z.r * 1.5, 0, TAU); ctx.stroke();
      }
    } else if (z.type === 'splitter'){
      // коконы с будущими ползунами
      for (let k = 0; k < 4; k++){
        const a = (k / 4) * TAU + z.wob * 0.1;
        const cx = Math.cos(a) * z.r * 0.55, cy = Math.sin(a) * z.r * 0.5;
        ctx.fillStyle = 'rgba(160,220,120,0.35)';
        ctx.beginPath(); ctx.arc(cx, cy, z.r * 0.3, 0, TAU); ctx.fill();
        ctx.strokeStyle = 'rgba(210,255,170,0.55)';
        ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(cx, cy, z.r * 0.3, 0, TAU); ctx.stroke();
      }
    } else if (z.type === 'wraith'){
      // бледная маска и рваные края
      ctx.strokeStyle = 'rgba(160,190,255,0.35)';
      ctx.lineWidth = 2;
      for (let k = 0; k < 5; k++){
        const a = (k / 5) * TAU + z.wob * 0.2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * z.r * 0.8, Math.sin(a) * z.r * 0.7);
        ctx.lineTo(Math.cos(a + 0.25) * z.r * 1.4, Math.sin(a + 0.25) * z.r * 1.2);
        ctx.stroke();
      }
    }

    // дыхальца по бокам брюшка
    ctx.fillStyle = 'rgba(8,14,8,0.6)';
    for (let k = 0; k < 3; k++){
      const cx2 = -z.r * (0.18 + k * 0.26);
      ctx.beginPath(); ctx.ellipse(cx2, -z.r * 0.62, z.r * 0.06, z.r * 0.11, -0.3, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx2, z.r * 0.62, z.r * 0.06, z.r * 0.11, 0.3, 0, TAU); ctx.fill();
    }
    // царапины на панцире
    if (z.hp < z.maxHp * 0.6){
      ctx.strokeStyle = 'rgba(20,14,10,0.55)';
      ctx.lineWidth = Math.max(1, z.r * 0.05);
      for (let k = 0; k < 2; k++){
        const sx3 = -z.r * (0.35 + k * 0.3);
        ctx.beginPath();
        ctx.moveTo(sx3, -z.r * 0.2);
        ctx.lineTo(sx3 + z.r * 0.22, z.r * 0.12);
        ctx.stroke();
      }
    }

    // ---- голова насекомого ----
    const headCol = flash ? '#fff6e2'
      : z.type === 'boss' ? z.color
      : z.type === 'runner' ? '#8d9a52'
      : z.type === 'bloater' ? '#a4b84e'
      : z.type === 'spitter' ? '#6f8f4e'
      : z.type === 'armored' ? '#7f8f78'
      : z.type === 'stalker' ? '#4a6034'
      : z.type === 'brute' ? '#5f7738'
      : z.type === 'crawler' ? '#8aa05a'
      : z.type === 'hound' ? '#6a4a30'
      : z.type === 'bomber' ? '#b06026'
      : z.type === 'shrieker' ? '#7a6a90'
      : z.type === 'splitter' ? '#6f8a5a'
      : z.type === 'wraith' ? '#9aa8c8'
      : '#6f8153';
    ctx.fillStyle = headCol;
    ctx.beginPath();
    ctx.ellipse(z.r * 0.56, 0, z.r * 0.52, z.r * 0.46, 0, 0, TAU);
    ctx.fill();
    // затылочный щит
    ctx.fillStyle = hexA(lighten(headCol, 0.38), 0.85);
    ctx.beginPath(); ctx.ellipse(z.r * 0.36, 0, z.r * 0.22, z.r * 0.34, 0, 0, TAU); ctx.fill();

    // усики
    ctx.strokeStyle = flash ? '#ffffff' : hexA(lighten(headCol, 0.55), 0.95);
    ctx.lineWidth = Math.max(1.2, z.r * 0.075);
    ctx.lineCap = 'round';
    for (const s of [-1, 1]){
      const wag = Math.sin(z.wob * 0.9 + s) * z.r * 0.07;
      ctx.beginPath();
      ctx.moveTo(z.r * 0.82, s * z.r * 0.22);
      ctx.quadraticCurveTo(z.r * 1.24, s * z.r * (0.38 + wag * 0.6),
        z.r * 1.56, s * z.r * (0.74 + wag));
      ctx.stroke();
      for (let k = 1; k <= 3; k++){
        const t = k / 3.4;
        ctx.beginPath();
        ctx.arc(z.r * (0.84 + 0.7 * t), s * z.r * (0.24 + 0.48 * t + wag * t),
          Math.max(0.8, z.r * 0.045), 0, TAU);
        ctx.stroke();
      }
    }

    // жвалы
    ctx.strokeStyle = flash ? '#ffffff' : '#e8e4c0';
    ctx.lineWidth = Math.max(1.6, z.r * 0.10);
    for (const s of [-1, 1]){
      ctx.beginPath();
      ctx.moveTo(z.r * 0.94, s * z.r * 0.26);
      ctx.quadraticCurveTo(z.r * 1.27, s * z.r * 0.48, z.r * 1.15, s * z.r * 0.05);
      ctx.stroke();
    }

    // глаза: крупные и светящиеся
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = hexA(eyeCol, 0.28);
    ctx.beginPath(); ctx.arc(z.r * 0.72, -z.r * 0.2, z.r * 0.24, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(z.r * 0.72, z.r * 0.2, z.r * 0.24, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.fillStyle = eyeCol;
    ctx.beginPath(); ctx.arc(z.r * 0.72, -z.r * 0.2, z.r * 0.13, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(z.r * 0.72, z.r * 0.2, z.r * 0.13, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fffef0';
    ctx.beginPath(); ctx.arc(z.r * 0.76, -z.r * 0.22, z.r * 0.05, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(z.r * 0.76, z.r * 0.18, z.r * 0.05, 0, TAU); ctx.fill();
    if (z.type === 'stalker'){
      ctx.beginPath(); ctx.arc(z.r * 0.6, -z.r * 0.36, z.r * 0.06, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(z.r * 0.6, z.r * 0.36, z.r * 0.06, 0, TAU); ctx.fill();
    }
    // зубастая пасть
    if (z.type === 'bloater' || z.type === 'spitter' || z.type === 'boss' ||
        z.type === 'hound' || z.type === 'shrieker' || z.type === 'splitter' || z.type === 'wraith'){
      ctx.strokeStyle = '#efe6c8';
      ctx.lineWidth = Math.max(1, z.r * 0.06);
      for (let k = -1; k <= 1; k++){
        ctx.beginPath();
        ctx.moveTo(z.r * 0.88, k * z.r * 0.13);
        ctx.lineTo(z.r * 1.02, k * z.r * 0.13);
        ctx.stroke();
      }
    }

    // уникальный облик боссов
    if (z.type === 'boss'){
      const style = z.bossStyle;
      if (style === 'alpha'){
        // корона из хитиновых рогов и огромные жвала короля
        ctx.strokeStyle = '#e0c48a';
        ctx.lineWidth = Math.max(4, z.r * 0.11);
        ctx.lineCap = 'round';
        for (const s2 of [-1, 1]){
          ctx.beginPath();
          ctx.moveTo(z.r * 0.7, s2 * z.r * 0.3);
          ctx.quadraticCurveTo(z.r * 1.5, s2 * z.r * 0.55, z.r * 1.2, s2 * z.r * 0.95);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(z.r * 0.7, s2 * z.r * 0.32);
          ctx.quadraticCurveTo(z.r * 1.35, s2 * z.r * 0.15, z.r * 1.62, s2 * z.r * 0.1);
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(255,181,69,0.28)';
        ctx.beginPath(); ctx.arc(z.r * 0.25, 0, z.r * 0.55, 0, TAU); ctx.fill();
        // сегментированная корона
        ctx.fillStyle = '#ffb545';
        for (let i = 0; i < 5; i++){
          const a = (i / 5) * TAU;
          ctx.beginPath();
          ctx.arc(z.r * 0.3 + Math.cos(a) * z.r * 0.4, Math.sin(a) * z.r * 0.36, z.r * 0.06, 0, TAU);
          ctx.fill();
        }
      } else if (style === 'mother'){
        // яйцевые мешки
        for (let i = 0; i < 8; i++){
          const a = (i / 8) * TAU + z.wob * 0.06;
          const rr = z.r * 0.85;
          ctx.fillStyle = i % 2 ? 'rgba(200,70,220,0.75)' : 'rgba(130,50,150,0.8)';
          ctx.beginPath();
          ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, z.r * 0.2, 0, TAU);
          ctx.fill();
        }
        // щупальца
        ctx.strokeStyle = '#e05aff';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        for (let i = 0; i < 6; i++){
          const a = (i / 6) * TAU;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * z.r * 0.5, Math.sin(a) * z.r * 0.5);
          ctx.quadraticCurveTo(
            Math.cos(a + 0.4) * z.r * 1.1, Math.sin(a + 0.4) * z.r * 1.1,
            Math.cos(a - 0.2) * z.r * (1.3 + Math.sin(z.wob + i) * 0.12),
            Math.sin(a - 0.2) * z.r * (1.3 + Math.sin(z.wob + i) * 0.12)
          );
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(230,120,255,0.4)';
        ctx.beginPath(); ctx.arc(0, 0, z.r * 0.42, 0, TAU); ctx.fill();
      } else if (style === 'acid'){
        ctx.globalCompositeOperation = 'lighter';
        const ag = ctx.createRadialGradient(0, 0, 0, 0, 0, z.r * 1.35);
        ag.addColorStop(0, 'rgba(180,255,90,0.45)');
        ag.addColorStop(0.6, 'rgba(110,220,40,0.22)');
        ag.addColorStop(1, 'rgba(60,150,20,0)');
        ctx.fillStyle = ag;
        ctx.beginPath(); ctx.arc(0, 0, z.r * 1.35, 0, TAU); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
        for (let i = 0; i < 5; i++){
          const a = (i / 5) * TAU + 0.4;
          ctx.fillStyle = 'rgba(190,255,110,0.8)';
          ctx.beginPath();
          ctx.arc(Math.cos(a) * z.r * 0.62, Math.sin(a) * z.r * 0.62, z.r * 0.17, 0, TAU);
          ctx.fill();
        }
        ctx.fillStyle = 'rgba(120,220,50,0.5)';
        ctx.beginPath(); ctx.arc(0, 0, z.r * 0.5, 0, TAU); ctx.fill();
      } else if (style === 'butcher'){
        // кровавые пластины
        ctx.fillStyle = 'rgba(150,40,30,0.7)';
        ctx.fillRect(-z.r * 0.7, -z.r * 0.8, z.r * 1.2, z.r * 0.35);
        ctx.fillRect(-z.r * 0.7, z.r * 0.45, z.r * 1.2, z.r * 0.35);
        // гигантская зазубренная мандибула
        ctx.save();
        ctx.translate(z.r * 0.7, -z.r * 0.34);
        ctx.rotate(-0.2 + Math.sin(z.wob * 1.4) * 0.09);
        ctx.fillStyle = '#e6dcc0';
        ctx.beginPath();
        ctx.moveTo(0, -z.r * 0.1);
        ctx.quadraticCurveTo(z.r * 0.7, -z.r * 0.5, z.r * 1.15, z.r * 0.05);
        ctx.quadraticCurveTo(z.r * 0.65, z.r * 0.02, 0, z.r * 0.16);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#8a7a5a';
        ctx.lineWidth = 2;
        ctx.stroke();
        // зубья
        ctx.strokeStyle = '#b03a2a';
        ctx.lineWidth = 3;
        for (let k = 0; k < 4; k++){
          const tx = z.r * (0.18 + k * 0.22);
          const ty = -z.r * (0.2 - k * 0.05);
          ctx.beginPath();
          ctx.moveTo(tx, ty);
          ctx.lineTo(tx + z.r * 0.07, ty + z.r * 0.16);
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(160,20,20,0.75)';
        ctx.beginPath(); ctx.arc(z.r * 0.55, -z.r * 0.05, z.r * 0.1, 0, TAU); ctx.fill();
        ctx.restore();
      } else if (style === 'colossus'){
        // каменные пластины и рога
        ctx.fillStyle = 'rgba(110,105,70,0.9)';
        for (let i = 0; i < 4; i++){
          const a = (i / 4) * TAU + 0.6;
          ctx.beginPath();
          ctx.arc(Math.cos(a) * z.r * 0.72, Math.sin(a) * z.r * 0.72, z.r * 0.26, 0, TAU);
          ctx.fill();
        }
        ctx.strokeStyle = '#d8c69a';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        for (const s of [-1, 1]){
          ctx.beginPath();
          ctx.moveTo(z.r * 0.35, s * z.r * 0.5);
          ctx.lineTo(z.r * 0.95, s * z.r * 0.85);
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(255,181,69,0.3)';
        ctx.beginPath(); ctx.arc(0, 0, z.r * 0.46, 0, TAU); ctx.fill();
      }

      // телеграф атаки
      if (z.warn > 0){
        const pulse = 0.55 + Math.sin(z.wob * 6) * 0.35;
        ctx.globalAlpha = pulse;
        ctx.strokeStyle = style === 'butcher' ? '#ff3a2a' : '#ffb545';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 0, z.r * (1.4 + (1 - z.warn) * 0.35), 0, TAU);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    } else if (z.type === 'armored'){
      // стальной шлем
      ctx.strokeStyle = '#b8c4b4';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(z.r * 0.48, 0, z.r * 0.6, -1.15, 1.15); ctx.stroke();
    }

    // горящий зомби
    if (z.burnT > 0){
      const flick = 0.8 + Math.sin(z.wob * 2.3) * 0.2;
      ctx.globalCompositeOperation = 'lighter';
      const fg = ctx.createRadialGradient(0, 0, 0, 0, 0, z.r * 1.7);
      fg.addColorStop(0, 'rgba(255,190,70,0.55)');
      fg.addColorStop(0.55, 'rgba(255,110,20,0.28)');
      fg.addColorStop(1, 'rgba(255,70,10,0)');
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(0, 0, z.r * 1.7 * flick, 0, TAU); ctx.fill();
      for (let i = 0; i < 6; i++){
        const a = (i / 6) * TAU + z.wob * 0.55;
        const fx = Math.cos(a) * z.r * 0.68;
        const fy = Math.sin(a) * z.r * 0.68;
        const fh = z.r * (0.55 + 0.4 * Math.sin(z.wob * 3.1 + i * 1.7));
        ctx.fillStyle = i % 2 ? 'rgba(255,140,30,0.8)' : 'rgba(255,215,90,0.8)';
        ctx.beginPath();
        ctx.moveTo(fx - z.r * 0.20, fy);
        ctx.quadraticCurveTo(fx, fy - fh * 1.5, fx + z.r * 0.20, fy);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    ctx.restore();

    // аура крика: враг усилен
    if (z.buffT > 0){
      const pulse = 0.35 + Math.sin(state.time * 8 + z.id) * 0.15;
      ctx.globalAlpha = pulse;
      ctx.strokeStyle = '#c8a0ff';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, z.r * 1.35, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // хп-бар
    if (z.type === 'brute' || z.type === 'boss' || z.type === 'armored' || z.type === 'bloater' ||
        z.type === 'shrieker' || z.type === 'splitter' || z.type === 'bomber' || z.hp < z.maxHp){
      const bw = Math.max(26, z.r * 2.1);
      const bh = 4;
      const bx = z.x - bw / 2;
      const by = z.y - z.r - 14;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
      ctx.fillStyle = z.type === 'boss' ? (z.bossAccent || '#ff6a3a')
        : z.type === 'armored' ? '#a8b8a0'
        : z.type === 'bloater' ? '#a8d24a'
        : z.type === 'bomber' ? '#ff9a3a'
        : z.type === 'shrieker' ? '#c8a0ff'
        : z.type === 'splitter' ? '#9ac86a'
        : '#c94b3a';
      ctx.fillRect(bx, by, bw * clamp(z.hp / z.maxHp, 0, 1), bh);
    }
  }
}

function drawMines(){
  for (const m of mines){
    if (m.x < view.x - 60 || m.y < view.y - 60 || m.x > view.x + viewW() + 60 || m.y > view.y + viewH() + 60) continue;
    ctx.save();
    ctx.translate(m.x, m.y);
    // тень
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(0, 5, 13, 7, 0, 0, TAU); ctx.fill();

    const armed = m.armT <= 0;
    ctx.rotate(m.t * (armed ? 0 : 6));
    // корпус
    ctx.fillStyle = armed ? '#3f4a3a' : '#2a322c';
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, TAU); ctx.fill();
    ctx.strokeStyle = armed ? '#9aff9a' : '#7a8a7a';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    // лапы-упоры
    ctx.strokeStyle = '#56635a';
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++){
      const a = (i / 4) * TAU + Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 8, Math.sin(a) * 8);
      ctx.lineTo(Math.cos(a) * 14, Math.sin(a) * 14);
      ctx.stroke();
    }
    // лампа
    const on = armed ? (Math.sin(m.blink * 9) > 0 ? 1 : 0.25) : 0.3;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(154,255,154,' + (on * 0.9).toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(0, 0, 4.2 * on + 1.6, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = armed ? '#d8ffb0' : '#8a9a8a';
    ctx.beginPath(); ctx.arc(0, 0, 2.2, 0, TAU); ctx.fill();
    // кольцо готовности
    if (armed){
      ctx.strokeStyle = 'rgba(154,255,154,' + (0.18 + Math.sin(m.blink * 9) * 0.1).toFixed(2) + ')';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(0, 0, 16 + Math.sin(m.blink * 4) * 2, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  }
}

function drawBullets(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const b of bullets){
    const a = Math.atan2(b.vy, b.vx);
    // визуал обычной пули уменьшен в 1.5 раза (хитбокс b.r и баланс не меняются)
    const core = (b.crit ? 1.15 : 0.9) / 1.5;
    const col = b.color || '#fff6d8';

    // ---- рейлган: длинный светящийся луч ----
    if (b.rail){
      const len = 148;
      const tx = b.x - Math.cos(a) * len;
      const ty = b.y - Math.sin(a) * len;
      const g = ctx.createLinearGradient(tx, ty, b.x, b.y);
      g.addColorStop(0, 'rgba(90,200,255,0)');
      g.addColorStop(0.55, 'rgba(150,240,255,0.38)');
      g.addColorStop(1, 'rgba(230,255,255,0.95)');
      ctx.strokeStyle = g;
      ctx.lineWidth = 9;
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.strokeStyle = 'rgba(210,250,255,0.95)';
      ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(tx + Math.cos(a) * 20, ty + Math.sin(a) * 20); ctx.lineTo(b.x, b.y); ctx.stroke();
      // электрические зигзаги
      ctx.strokeStyle = 'rgba(140,230,255,0.6)';
      ctx.lineWidth = 1.1;
      for (let k = 0; k < 2; k++){
        ctx.beginPath();
        for (let j = 0; j <= 4; j++){
          const t = j / 4;
          const px2 = tx + (b.x - tx) * t;
          const py2 = ty + (b.y - ty) * t + Math.sin(t * 18 + state.time * 40 + k * 2) * (3 - j * 0.5);
          if (j === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
        }
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(235,255,255,0.95)';
      ctx.beginPath(); ctx.arc(b.x, b.y, 4.2, 0, TAU); ctx.fill();
      continue;
    }

    // ---- струя огнемёта ----
    if (b.flame){
      const fl = 0.8 + Math.sin(state.time * 42 + b.x * 0.05) * 0.2;
      const fg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 15 * fl);
      fg.addColorStop(0, 'rgba(255,250,210,0.95)');
      fg.addColorStop(0.3, 'rgba(255,190,60,0.8)');
      fg.addColorStop(0.65, 'rgba(255,105,20,0.42)');
      fg.addColorStop(1, 'rgba(255,60,0,0)');
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(b.x, b.y, 15 * fl, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,220,0.7)';
      ctx.beginPath(); ctx.arc(b.x, b.y, 2.2, 0, TAU); ctx.fill();
      continue;
    }

    // ---- ракета ----
    if (b.rocket){
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(a);
      // выхлоп
      const rg = ctx.createRadialGradient(-10, 0, 0, -10, 0, 17);
      rg.addColorStop(0, 'rgba(255,250,210,0.95)');
      rg.addColorStop(0.35, 'rgba(255,170,60,0.75)');
      rg.addColorStop(1, 'rgba(255,80,20,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.ellipse(-11, 0, 18, 8, 0, 0, TAU); ctx.fill();
      // корпус
      ctx.fillStyle = '#3a4148';
      ctx.beginPath(); ctx.roundRect(-7, -3.2, 14, 6.4, 2.4); ctx.fill();
      ctx.fillStyle = '#ff8a3a';
      ctx.beginPath(); ctx.moveTo(7, -3.2); ctx.lineTo(11, 0); ctx.lineTo(7, 3.2); ctx.closePath(); ctx.fill();
      // стабилизаторы
      ctx.fillStyle = '#22282d';
      ctx.beginPath(); ctx.moveTo(-7, -3.2); ctx.lineTo(-11, -6); ctx.lineTo(-5, -3.2); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-7, 3.2); ctx.lineTo(-11, 6); ctx.lineTo(-5, 3.2); ctx.closePath(); ctx.fill();
      // блик
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(-4, -1.8, 8, 1.2);
      ctx.restore();
      continue;
    }

    // три затухающих круглых следа вместо трассера
    for (let i = 3; i >= 1; i--){
      const d = i * (b.crit ? 7.5 : 6.5) / 1.5;
      const fade = 0.34 / i;
      ctx.fillStyle = b.fire
        ? 'rgba(255,140,40,' + fade.toFixed(2) + ')'
        : 'rgba(255,220,150,' + (fade * 0.78).toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(b.x - Math.cos(a) * d, b.y - Math.sin(a) * d, core * (1 - i * 0.17), 0, TAU);
      ctx.fill();
    }

    // мягкий ореол вокруг пули
    ctx.fillStyle = hexA(col, 0.09);
    ctx.beginPath(); ctx.arc(b.x, b.y, 7.5 / 1.5, 0, TAU); ctx.fill();
    ctx.fillStyle = hexA(col, 0.26);
    ctx.beginPath(); ctx.arc(b.x, b.y, 4.2 / 1.5, 0, TAU); ctx.fill();

    // тонкое цветное кольцо — пуля читается на тёмном полу
    ctx.strokeStyle = hexA(col, 0.55);
    ctx.lineWidth = 0.8 / 1.5;
    ctx.beginPath(); ctx.arc(b.x, b.y, core * 2.2, 0, TAU); ctx.stroke();

    // ядро
    ctx.fillStyle = col;
    ctx.globalAlpha = 0.8;
    ctx.beginPath(); ctx.arc(b.x, b.y, core * 1.45, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fffdf2';
    ctx.beginPath(); ctx.arc(b.x, b.y, core, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawEnemyBullets(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const b of enemyBullets){
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 2.4);
    g.addColorStop(0, 'rgba(200,255,140,0.95)');
    g.addColorStop(0.4, 'rgba(120,220,60,0.55)');
    g.addColorStop(1, 'rgba(60,140,20,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2.4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#d6ff9a';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.5, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawParticles(){
  ctx.save();
  for (const p of particles){
    const t = clamp(p.life / (p.max || 1), 0, 1);
    ctx.globalAlpha = Math.min(1, t * 1.4);
    if (p.kind === 'ring'){
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 2;
      const s = p.size * (1.6 - t * 0.6);
      ctx.beginPath(); ctx.arc(p.x, p.y, s * 0.5, 0, TAU); ctx.stroke();
      continue;
    }
    if (p.kind === 'spark'){
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = p.color;
      ctx.lineWidth = p.size;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * 0.02, p.y - p.vy * 0.02);
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      continue;
    }
    if (p.kind === 'acid'){
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      continue;
    }
    if (p.kind === 'fire'){
      ctx.globalCompositeOperation = 'lighter';
      const fg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 1.8);
      fg.addColorStop(0, p.color);
      fg.addColorStop(1, 'rgba(255,90,20,0)');
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 1.8, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      continue;
    }
    ctx.fillStyle = p.color;
    if (p.kind === 'blood' || p.kind === 'chunk'){
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.6 + t * 0.4), 0, TAU); ctx.fill();
    } else if (p.kind === 'smoke'){
      ctx.globalAlpha *= 0.4;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (2 - t), 0, TAU); ctx.fill();
    } else {
      ctx.fillRect(p.x, p.y, p.size * 1.6, p.size);
    }
  }
  ctx.restore();
}

function drawFlashes(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const f of flashes){
    const t = f.life / f.max;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.a);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, f.size);
    g.addColorStop(0, 'rgba(255,240,200,' + (0.85 * t).toFixed(3) + ')');
    g.addColorStop(0.35, 'rgba(255,180,80,' + (0.5 * t).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,120,30,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, f.size, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,200,' + (0.8 * t).toFixed(3) + ')';
    ctx.beginPath();
    ctx.moveTo(0, -3.4);
    ctx.lineTo(f.size * 0.7, 0);
    ctx.lineTo(0, 3.4);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawPickups(){
  for (const p of pickups){
    const bob = Math.sin(p.t) * 3;
    const col = p.type === 'health' ? '#5fe07a' : p.type === 'ammo' ? '#ffc85a' : p.type === 'grenade' ? '#ff7a3a' : p.type === 'fire' ? '#ffdf3a' : p.type === 'armor' ? '#8fd8ff' : p.type === 'acidres' ? '#9cff4a' : '#6fd2ff';
    ctx.save();
    ctx.translate(p.x, p.y + bob);

    // свечение
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 34);
    g.addColorStop(0, col + '66');
    g.addColorStop(1, col + '00');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 34, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = 'rgba(12,18,18,0.92)';
    ctx.fillRect(-11, -11, 22, 22);
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.strokeRect(-11, -11, 22, 22);
    ctx.rotate(-Math.PI / 4);

    // иконка
    if (p.type === 'health'){
      ctx.fillStyle = col;
      ctx.fillRect(-2.5, -7, 5, 14);
      ctx.fillRect(-7, -2.5, 14, 5);
    } else if (p.type === 'ammo'){
      ctx.fillStyle = col;
      for (let i = -1; i <= 1; i++){
        ctx.fillRect(i * 5 - 1.5, -6, 3, 12);
      }
    } else if (p.type === 'grenade'){
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(0, 1, 6, 0, TAU); ctx.fill();
      ctx.fillStyle = '#1a1208';
      ctx.fillRect(-2, -8, 4, 4);
      ctx.strokeStyle = '#ffe0a0';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(0, 1, 3, 0, TAU); ctx.stroke();
    } else if (p.type === 'fire'){
      // огненный патрон
      ctx.fillStyle = '#ffcf3a';
      ctx.fillRect(-3.5, -7, 7, 11);
      ctx.fillStyle = '#ff6a1a';
      ctx.beginPath();
      ctx.moveTo(-3.5, 4); ctx.lineTo(0, 9); ctx.lineTo(3.5, 4);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff2a0';
      ctx.fillRect(-1.3, -5.5, 2.6, 6);
    } else if (p.type === 'armor'){
      // бронепластина-щит
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(0, -8.5);
      ctx.lineTo(7.5, -4.5);
      ctx.lineTo(6.5, 2);
      ctx.lineTo(0, 8.5);
      ctx.lineTo(-6.5, 2);
      ctx.lineTo(-7.5, -4.5);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(10,22,26,0.82)';
      ctx.beginPath();
      ctx.moveTo(0, -4.5);
      ctx.lineTo(3.4, -2.4);
      ctx.lineTo(3, 1);
      ctx.lineTo(0, 3.8);
      ctx.lineTo(-3, 1);
      ctx.lineTo(-3.4, -2.4);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-4.5, -4.2); ctx.lineTo(-1.6, -5.8); ctx.stroke();
    } else if (p.type === 'acidres'){
      // капля-антидот
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(0, -8.5);
      ctx.bezierCurveTo(4.5, -2.5, 7, 1.5, 4.5, 5);
      ctx.bezierCurveTo(2.5, 8.2, -2.5, 8.2, -4.5, 5);
      ctx.bezierCurveTo(-7, 1.5, -4.5, -2.5, 0, -8.5);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(12,28,8,0.6)';
      ctx.beginPath(); ctx.arc(0, 2.4, 3.4, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.78)';
      ctx.beginPath(); ctx.arc(-1.6, 1.4, 1.1, 0, TAU); ctx.fill();
    } else {
      ctx.fillStyle = col;
      ctx.fillRect(-8, -2, 14, 4);
      ctx.fillRect(2, -5, 5, 5);
      ctx.fillRect(-6, 2, 4, 6);
      // бирка ствола
      if (p.weapon && WEAPONS[p.weapon]){
        ctx.textAlign = 'center';
        ctx.font = '800 10px ' + FONT;
        ctx.fillStyle = 'rgba(191,233,255,0.95)';
        ctx.fillText(WEAPONS[p.weapon].tag, 0, -19);
      }
    }
    ctx.restore();
  }
}

/* --------------------------- lighting --------------------------- */
function eraseLight(x, y, r, strength){
  const g = lctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(0,0,0,' + strength + ')');
  g.addColorStop(0.55, 'rgba(0,0,0,' + (strength * 0.55).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  lctx.fillStyle = g;
  lctx.beginPath();
  lctx.arc(x, y, r, 0, TAU);
  lctx.fill();
}

function drawLighting(vx, vy){
  lctx.setTransform(LIGHT_SCALE, 0, 0, LIGHT_SCALE, 0, 0);
  lctx.globalCompositeOperation = 'source-over';
  lctx.clearRect(0, 0, cw, ch);
  lctx.fillStyle = 'rgba(3,6,8,0.78)';
  lctx.fillRect(0, 0, cw, ch);

  lctx.globalCompositeOperation = 'destination-out';
  // Слой света живёт в экранных пикселях, а мир рисуется с масштабом zoom.
  // Поэтому все мировые координаты и радиусы обязаны умножаться на zoom,
  // иначе на телефоне (zoom < 1) фонарь и лампы «уезжают» от объектов.
  const z = zoom;
  const px = (player.x - vx) * z;
  const py = (player.y - vy) * z;

  // общий сумрак вокруг игрока (силуэты в темноте)
  eraseLight(px, py, 200 * z, 0.92);
  eraseLight(px, py, 430 * z, 0.50);

  // конус фонаря
  const coneR = 760 * z;
  lctx.save();
  lctx.beginPath();
  lctx.moveTo(px, py);
  lctx.arc(px, py, coneR, player.aim - 0.66, player.aim + 0.66);
  lctx.closePath();
  lctx.clip();
  const cone = lctx.createRadialGradient(px, py, 24 * z, px, py, coneR);
  cone.addColorStop(0, 'rgba(0,0,0,1)');
  cone.addColorStop(0.45, 'rgba(0,0,0,0.88)');
  cone.addColorStop(0.8, 'rgba(0,0,0,0.34)');
  cone.addColorStop(1, 'rgba(0,0,0,0)');
  lctx.fillStyle = cone;
  lctx.fillRect(px - 800 * z, py - 800 * z, 1600 * z, 1600 * z);
  lctx.restore();

  for (const L of lamps){
    const lx = (L.x - vx) * z, ly = (L.y - vy) * z, lr = L.r * z;
    eraseLight(lx, ly, lr, 0.92);
    eraseLight(lx, ly, lr * 0.45, 1);
  }
  for (const f of flashes){
    eraseLight((f.x - vx) * z, (f.y - vy) * z, f.size * 3.2 * z, 0.95);
  }
  // подсветка от выстрелов-трассеров (на телефоне пропускаем — дорого)
  if (!IS_MOBILE){
    const nb = Math.min(bullets.length, 14);
    for (let i = 0; i < nb; i += 2){
      const b = bullets[i];
      eraseLight((b.x - vx) * z, (b.y - vy) * z, 58 * z, 0.30);
    }
  }
  for (const g of grenades){
    eraseLight((g.x - vx) * z, (g.y - g.z - vy) * z,
      (g.fuse < 0.45 ? 70 : 46) * z, g.fuse < 0.45 ? 0.5 : 0.3);
  }

  lctx.globalCompositeOperation = 'source-over';
  // виньетка вшивается в слой света — минус один полноэкранный проход
  const vg = lctx.createRadialGradient(cw / 2, ch / 2, Math.min(cw, ch) * 0.30, cw / 2, ch / 2, Math.max(cw, ch) * 0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(0.7, 'rgba(0,0,0,0.34)');
  vg.addColorStop(1, 'rgba(0,0,0,0.78)');
  lctx.fillStyle = vg;
  lctx.fillRect(0, 0, cw, ch);

  ctx.drawImage(lightCanvas, vx, vy, viewW(), viewH());

  // тёплые пятна света аддитивно — рисуем в мировых координатах,
  // потому что контекст всё ещё сдвинут камерой (-vx, -vy)
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const L of lamps){
    if (L.x < vx - L.r || L.y < vy - L.r ||
        L.x > vx + viewW() + L.r || L.y > vy + viewH() + L.r) continue;
    // спрайт вместо градиента: кэш + один blit
    ctx.drawImage(glowSprite(L.warm ? '#ffaa50' : '#6ed2c8', 0.16),
      L.x - L.r, L.y - L.r, L.r * 2, L.r * 2);
  }
  // подсветка от фонаря игрока (мягкий холодный ореол)
  const hs = glowSprite('#aacdc6', 0.16);
  ctx.drawImage(hs, player.x - 560, player.y - 560, 1120, 1120);

  for (const f of flashes){
    const t = f.life / f.max;
    ctx.globalAlpha = 0.30 * t;
    ctx.drawImage(glowSprite('#ffc878', 1),
      f.x - f.size * 3, f.y - f.size * 3, f.size * 6, f.size * 6);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ---------------------------- crosshair ------------------------- */
function drawCrosshair(){
  const w = WEAPONS[player.cur];
  const spread = (8 + w.spread * 260 + state.shake * 0.7) * (IS_MOBILE ? 0.85 : 1);
  let x, y;
  if (IS_MOBILE){
    // прицел всегда в направлении ствола: и со стиком, и после его отпускания
    const psx = (player.x - view.x) * zoom;
    const psy = (player.y - view.y) * zoom;
    const d = 96 + 54 * (touch.aim.active ? touch.aim.mag : 0.4);
    x = psx + Math.cos(player.aim) * d;
    y = psy + Math.sin(player.aim) * d;
  } else {
    x = mouse.x; y = mouse.y;
  }
  let color = 'rgba(255,215,160,0.95)';
  if (mouse.over) color = 'rgba(255,110,80,0.98)';

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x - spread - 7, y); ctx.lineTo(x - spread, y);
  ctx.moveTo(x + spread, y); ctx.lineTo(x + spread + 7, y);
  ctx.moveTo(x, y - spread - 7); ctx.lineTo(x, y - spread);
  ctx.moveTo(x, y + spread); ctx.lineTo(x, y + spread + 7);
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, 1.4, 0, TAU); ctx.fill();

  // хит-маркер: диагональные засечки на попадании
  if (state.hitMarkT > 0){
    const maxT = state.hitMarkCrit ? 0.2 : 0.14;
    const k = clamp(state.hitMarkT / maxT, 0, 1);
    const d = 5 + (1 - k) * 4;
    const sz = state.hitMarkCrit ? 7 : 5;
    ctx.strokeStyle = state.hitMarkCrit
      ? 'rgba(255,120,60,' + k.toFixed(3) + ')'
      : 'rgba(255,248,230,' + k.toFixed(3) + ')';
    ctx.lineWidth = state.hitMarkCrit ? 2.6 : 1.8;
    ctx.beginPath();
    ctx.moveTo(x - d - sz, y - d - sz); ctx.lineTo(x - d, y - d);
    ctx.moveTo(x + d, y - d); ctx.lineTo(x + d + sz, y - d - sz);
    ctx.moveTo(x - d, y + d); ctx.lineTo(x - d - sz, y + d + sz);
    ctx.moveTo(x + d + sz, y + d + sz); ctx.lineTo(x + d, y + d);
    ctx.stroke();
  }
  ctx.restore();
}

/* ------------------------------ HUD ----------------------------- */
function panel(x, y, w, h, fill, stroke){
  const c = 10 * ui;
  ctx.beginPath();
  ctx.moveTo(x + c, y);
  ctx.lineTo(x + w - c, y);
  ctx.lineTo(x + w, y + c);
  ctx.lineTo(x + w, y + h - c);
  ctx.lineTo(x + w - c, y + h);
  ctx.lineTo(x + c, y + h);
  ctx.lineTo(x, y + h - c);
  ctx.lineTo(x, y + c);
  ctx.closePath();
  ctx.fillStyle = fill || 'rgba(7,12,14,0.74)';
  ctx.fill();
  ctx.strokeStyle = stroke || 'rgba(255,181,69,0.32)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function txt(s, x, y, size, color, align, weight, alpha){
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = color || '#e8e2d4';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.font = (weight || 700) + ' ' + Math.round(size * 1.14) + 'px ' + FONT;
  ctx.fillText(s, x, y);
  ctx.restore();
}

function bar(x, y, w, h, pct, color, bg){
  ctx.fillStyle = bg || 'rgba(255,255,255,0.10)';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w * clamp(pct, 0, 1), h);
  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}

function drawPortrait(x, y, s, id, tint, accent){
  const asset = portraitAsset(id || state.heroId);
  ctx.save();
  ctx.translate(x, y);

  // фон / рамка
  ctx.fillStyle = '#101719';
  ctx.fillRect(0, 0, s, s);
  const g = ctx.createLinearGradient(0, 0, 0, s);
  g.addColorStop(0, '#1d2a2b');
  g.addColorStop(1, '#0b1112');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);

  if (asset.ready && asset.img.naturalWidth){
    // фото вписано по принципу cover, без искажений
    const iw = asset.img.naturalWidth, ih = asset.img.naturalHeight;
    const sc = Math.max(s / iw, s / ih);
    const dw = iw * sc, dh = ih * sc;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, s, s); ctx.clip();
    ctx.drawImage(asset.img, (s - dw) / 2, (s - dh) / 2, dw, dh);

    // цветокоррекция под HUD
    ctx.globalCompositeOperation = 'soft-light';
    ctx.fillStyle = tint || 'rgba(255,150,70,0.17)';
    ctx.fillRect(0, 0, s, s);
    ctx.globalCompositeOperation = 'source-over';

    // лёгкие сканлайны
    ctx.globalAlpha = 0.08;
    ctx.fillStyle = '#000';
    for (let yy = 0; yy < s; yy += 3) ctx.fillRect(0, yy, s, 1);
    ctx.globalAlpha = 1;

    // виньетка, чтобы портрет не выбивался из панели
    const vg = ctx.createRadialGradient(s / 2, s / 2, s * 0.22, s / 2, s / 2, s * 0.74);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.32)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, s, s);
    ctx.restore();
  } else {
    // запасной векторный портрет, пока фото не загрузилось
    ctx.fillStyle = '#2b3a3b';
    ctx.beginPath();
    ctx.ellipse(s * 0.5, s * 1.02, s * 0.42, s * 0.3, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#a98d68';
    ctx.fillRect(s * 0.42, s * 0.66, s * 0.16, s * 0.16);
    ctx.fillStyle = '#c9a97a';
    ctx.beginPath(); ctx.arc(s * 0.5, s * 0.52, s * 0.22, 0, TAU); ctx.fill();
    ctx.fillStyle = '#39494b';
    ctx.beginPath(); ctx.arc(s * 0.5, s * 0.47, s * 0.28, Math.PI, TAU); ctx.fill();
    ctx.fillRect(s * 0.22, s * 0.43, s * 0.56, s * 0.08);
    ctx.fillStyle = accent || 'rgba(255,181,69,0.8)';
    ctx.fillRect(s * 0.3, s * 0.46, s * 0.4, s * 0.08);
  }

  // уголки рамки
  const c = Math.max(5, s * 0.11);
  ctx.strokeStyle = accent || 'rgba(255,181,69,0.72)';
  ctx.lineWidth = Math.max(1, s * 0.018);
  ctx.beginPath();
  ctx.moveTo(0, c); ctx.lineTo(0, 0); ctx.lineTo(c, 0);
  ctx.moveTo(s - c, 0); ctx.lineTo(s, 0); ctx.lineTo(s, c);
  ctx.moveTo(s, s - c); ctx.lineTo(s, s); ctx.lineTo(s - c, s);
  ctx.moveTo(c, s); ctx.lineTo(0, s); ctx.lineTo(0, s - c);
  ctx.stroke();

  ctx.strokeStyle = accent ? accent.replace(/0\.72\)$/, '0.36)') : 'rgba(255,181,69,0.36)';
  ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, s - 1, s - 1);
  ctx.restore();
}

function drawMiniMap(){
  const mw = 250 * ui, mh = 176 * ui;
  const pad = 22 * ui;
  const x = cw - mw - pad, y = pad;
  const s = Math.min(mw / WORLD.w, mh / WORLD.h);
  panel(x, y, mw, mh, 'rgba(5,10,12,0.72)');

  ctx.save();
  ctx.beginPath();
  ctx.rect(x + 6, y + 6, mw - 12, mh - 12);
  ctx.clip();

  const ox = x + (mw - WORLD.w * s) / 2;
  const oy = y + (mh - WORLD.h * s) / 2;

  ctx.fillStyle = 'rgba(255,255,255,0.035)';
  ctx.fillRect(ox, oy, WORLD.w * s, WORLD.h * s);

  for (const b of bushes){
    ctx.fillStyle = 'rgba(90,140,80,0.18)';
    ctx.beginPath();
    ctx.arc(ox + b.x * s, oy + b.y * s, Math.max(1.4, b.r * s * 0.8), 0, TAU);
    ctx.fill();
  }
  for (const w of walls){
    ctx.fillStyle = 'rgba(140,170,160,0.28)';
    ctx.fillRect(ox + w.x * s, oy + w.y * s, Math.max(1, w.w * s), Math.max(1, w.h * s));
  }
  for (const p of pickups){
    ctx.fillStyle = p.type === 'health' ? '#5fe07a' : p.type === 'ammo' ? '#ffc85a' : p.type === 'grenade' ? '#ff7a3a' : p.type === 'fire' ? '#ffdf3a' : p.type === 'armor' ? '#8fd8ff' : p.type === 'acidres' ? '#9cff4a' : '#6fd2ff';
    ctx.fillRect(ox + p.x * s - 1, oy + p.y * s - 1, 2.5, 2.5);
  }
  for (const z of zombies){
    if (z.dead) continue;
    ctx.fillStyle = z.type === 'boss' ? (z.bossAccent || '#ff6a3a')
      : z.type === 'bloater' ? '#a8d24a'
      : z.type === 'spitter' ? '#8fe04a'
      : z.type === 'armored' ? '#c8d8c0'
      : z.type === 'stalker' ? '#8a6a4a'
      : z.type === 'crawler' ? '#c8e07a'
      : z.type === 'hound' ? '#c08050'
      : z.type === 'bomber' ? '#ff9a3a'
      : z.type === 'shrieker' ? '#c8a0ff'
      : z.type === 'splitter' ? '#9ac86a'
      : z.type === 'wraith' ? '#8fa8e0'
      : '#ff4a4a';
    const r = z.type === 'boss' ? 3.6 : z.type === 'brute' ? 2.5 : z.type === 'crawler' ? 1.5 : 1.9;
    ctx.beginPath();
    ctx.arc(ox + z.x * s, oy + z.y * s, r, 0, TAU);
    ctx.fill();
  }
  // игрок
  ctx.fillStyle = '#8fe6d4';
  ctx.beginPath();
  ctx.arc(ox + player.x * s, oy + player.y * s, 2.6, 0, TAU);
  ctx.fill();
  // направление
  ctx.strokeStyle = 'rgba(143,230,212,0.8)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(ox + player.x * s, oy + player.y * s);
  ctx.lineTo(ox + (player.x + Math.cos(player.aim) * 90) * s, oy + (player.y + Math.sin(player.aim) * 90) * s);
  ctx.stroke();

  // сканлайны
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = '#000';
  for (let yy = y; yy < y + mh; yy += 3) ctx.fillRect(x, yy, mw, 1);
  ctx.restore();

  // подпись
  ctx.globalAlpha = 0.7;
  txt('РАДАР', x + 10 * ui, y + 18 * ui, 10 * ui, '#7fd8c8', 'left', 700);
  txt('СЕКТОР 07', x + mw - 10 * ui, y + 18 * ui, 10 * ui, '#ffb545', 'right', 700);
  ctx.globalAlpha = 1;
}

function drawBossBar(){
  const boss = zombies.find(z => z.type === 'boss' && !z.dead);
  if (!boss) return;
  const w = 560 * ui, h = 12 * ui;
  const x = (cw - w) / 2, y = 34 * ui;
  const accent = boss.bossAccent || '#ff8a5a';
  txt(boss.bossName || 'БОСС', x, y - 8 * ui, 13 * ui, accent, 'left', 700);
  txt('УНИКАЛЬНЫЙ БОСС', x + 240 * ui, y - 8 * ui, Math.max(9, 9 * ui), 'rgba(200,200,200,0.65)', 'left', 700);
  txt(Math.max(0, Math.ceil(boss.hp)) + ' HP', x + w, y - 8 * ui, 11 * ui, '#c9b79a', 'right', 700);
  bar(x, y, w, h, boss.hp / boss.maxHp, accent, 'rgba(40,10,6,0.7)');
}

function drawHUD(){
  const pad = 22 * ui;

  // ---------- верх слева: волна/счёт ----------
  const pw = 300 * ui, ph = 104 * ui;
  panel(pad, pad, pw, ph);
  txt('СЕКТОР 07 // КАРАНТИН', pad + 14 * ui, pad + 24 * ui, 10 * ui, '#7fd8c8', 'left', 700);
  txt('ВОЛНА', pad + 14 * ui, pad + 54 * ui, 11 * ui, '#98a3a3', 'left', 700);
  txt(String(state.wave).padStart(2, '0'), pad + 66 * ui, pad + 56 * ui, 26 * ui, '#ffb545', 'left', 800);
  txt('УБИЙСТВА', pad + 150 * ui, pad + 54 * ui, 11 * ui, '#98a3a3', 'left', 700);
  txt(String(state.kills), pad + 150 * ui, pad + 78 * ui, 18 * ui, '#e8e2d4', 'left', 700);
  txt('ОЧКИ', pad + 224 * ui, pad + 54 * ui, 11 * ui, '#98a3a3', 'left', 700);
  txt(String(state.score), pad + 224 * ui, pad + 78 * ui, 18 * ui, '#ffd06a', 'left', 700);

  // таймер волны / статус
  const st = state.waveState === 'break' ? 'ПЕРЕДЫШКА ' + Math.ceil(Math.max(0, state.breakT)) : 'ЗАЧИСТКА';
  txt(st, pad + 14 * ui, pad + 96 * ui, 10 * ui, state.waveState === 'break' ? '#7fd8c8' : '#ff8a5a', 'left', 700);

  // уведомление о новом типе врага
  if (state.unlockT > 0 && state.unlockText){
    const a = clamp(state.unlockT, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    const uy = pad + ph + 10 * ui;
    const uw = 300 * ui, uh = 30 * ui;
    ctx.fillStyle = 'rgba(60,18,10,0.72)';
    ctx.fillRect(pad, uy, uw, uh);
    ctx.fillStyle = '#ff8a5a';
    ctx.fillRect(pad, uy, 3 * ui, uh);
    txt(state.unlockText, pad + 12 * ui, uy + 20 * ui, 11 * ui, '#ffd06a', 'left', 700);
    ctx.restore();
  }

  // ---------- низ слева: здоровье ----------
  const hw = 360 * ui, hh = 92 * ui;
  const hx = pad, hy = ch - pad - hh;
  panel(hx, hy, hw, hh);
  const hero = HEROES[player.heroId] || HEROES.volk;
  drawPortrait(hx + 12 * ui, hy + 12 * ui, 68 * ui, hero.id, hero.tint, hero.accent);
  txt('ЗДОРОВЬЕ', hx + 96 * ui, hy + 30 * ui, 10 * ui, '#98a3a3', 'left', 700);
  txt(hero.name, hx + hw - 14 * ui, hy + 30 * ui, 11 * ui, hero.color, 'right', 800);
