  const hpPct = player.hp / player.maxHp;
  const hpCol = hpPct > 0.55 ? '#5fd27a' : hpPct > 0.28 ? '#ffb545' : '#ff4d3d';
  bar(hx + 96 * ui, hy + 40 * ui, hw - 116 * ui, 14 * ui, hpPct, hpCol, 'rgba(0,0,0,0.5)');
  txt(Math.ceil(player.hp) + ' / ' + player.maxHp, hx + 96 * ui, hy + 74 * ui, 16 * ui, '#e8e2d4', 'left', 800);
  // рывок
  const dashPct = 1 - player.dashCd / (player.dashCdMax || 1);
  txt('РЫВОК', hx + 232 * ui, hy + 73 * ui, Math.max(9, 9 * ui), '#98a3a3', 'left', 700);
  bar(hx + 232 * ui, hy + 78 * ui, 84 * ui, 5 * ui, clamp(dashPct, 0, 1), '#7fd8c8');

  // ---------- баффы: броня и кислотостойкость ----------
  let buffY = hy - 8 * ui;
  if (player.acidResistT > 0){
    const bh = 28 * ui;
    buffY -= bh;
    panel(hx, buffY, hw, bh, 'rgba(9,20,8,0.82)', 'rgba(156,255,74,0.42)');
    txt('ЗАЩИТА ОТ КИСЛОТЫ', hx + 12 * ui, buffY + 18 * ui, Math.max(9, 9.5 * ui), '#9cff4a', 'left', 800);
    txt('−65% · ' + Math.ceil(player.acidResistT) + ' с', hx + hw - 12 * ui, buffY + 18 * ui, Math.max(9, 9.5 * ui), '#d6ffb0', 'right', 700);
    bar(hx + 12 * ui, buffY + bh - 5 * ui, hw - 24 * ui, 3 * ui,
      clamp(player.acidResistT / (ACID_RESIST_TIME * 2), 0, 1), '#9cff4a', 'rgba(0,0,0,0.45)');
    buffY -= 6 * ui;
  }
  if (player.armor > 0){
    const bh = 28 * ui;
    buffY -= bh;
    panel(hx, buffY, hw, bh, 'rgba(8,16,20,0.82)', 'rgba(143,216,255,0.42)');
    txt('БРОНЯ', hx + 12 * ui, buffY + 18 * ui, Math.max(9, 9.5 * ui), '#8fd8ff', 'left', 800);
    txt(Math.ceil(player.armor) + ' / ' + player.maxArmor, hx + hw - 12 * ui, buffY + 18 * ui, Math.max(9, 9.5 * ui), '#d8f2ff', 'right', 700);
    bar(hx + 12 * ui, buffY + bh - 5 * ui, hw - 24 * ui, 3 * ui,
      clamp(player.armor / player.maxArmor, 0, 1), '#8fd8ff', 'rgba(0,0,0,0.45)');
  }

  // ---------- низ справа: оружие ----------
  const ww = 330 * ui, wh = 92 * ui;
  const wx = cw - pad - ww, wy = ch - pad - wh;
  panel(wx, wy, ww, wh);
  const w = WEAPONS[player.cur];
  const g = player.guns[player.cur];
  txt(w.name, wx + 14 * ui, wy + 28 * ui, 12 * ui, '#ffb545', 'left', 700);
  txt(String(g.mag).padStart(2, '0'), wx + 14 * ui, wy + 68 * ui, 30 * ui, g.mag > 0 ? '#e8e2d4' : '#ff4d3d', 'left', 800);
  txt('/ ' + (Number.isFinite(g.reserve) ? g.reserve : '∞'), wx + 74 * ui, wy + 68 * ui, 16 * ui, '#98a3a3', 'left', 700);

  // индикатор перезарядки
  if (player.reloadT > 0){
    const pct = 1 - player.reloadT / w.reload;
    bar(wx + 172 * ui, wy + 52 * ui, 142 * ui, 8 * ui, pct, '#ffb545');
    txt('ПЕРЕЗАРЯДКА', wx + 172 * ui, wy + 44 * ui, Math.max(9, 9 * ui), '#e8e2d4', 'left', 700);
  } else if (g.mag === 0 && g.reserve <= 0){
    txt('НЕТ ПАТРОНОВ', wx + 172 * ui, wy + 52 * ui, 11 * ui, '#ff4d3d', 'left', 700);
  } else {
    txt('R — ПЕРЕЗАРЯДКА', wx + 172 * ui, wy + 52 * ui, Math.max(9, 9 * ui), '#6f7d82', 'left', 700);
    txt('1–9 — СМЕНА', wx + 172 * ui, wy + 68 * ui, Math.max(9, 9 * ui), '#6f7d82', 'left', 700);
  }

  // ---------- гранаты ----------
  const gh = 34 * ui;
  const gy = wy - gh - 8 * ui;
  if (player.fireT > 0){
    const fh = 26 * ui;
    const fy = gy - fh - 6 * ui;
    panel(wx, fy, ww, fh, 'rgba(22,11,4,0.84)', 'rgba(255,176,58,0.5)');
    txt('ОГНЕННЫЕ ПАТРОНЫ', wx + 14 * ui, fy + 17 * ui, Math.max(9, 9 * ui), '#ffb03a', 'left', 700);
    bar(wx + 170 * ui, fy + 10 * ui, 142 * ui, 6 * ui, player.fireT / 30, '#ff8a3a');
  }
  panel(wx, gy, ww, gh, 'rgba(7,12,14,0.74)', player.grenades > 0 ? 'rgba(255,122,58,0.42)' : 'rgba(120,120,120,0.25)');
  txt('ПКМ — ГРАНАТА', wx + 14 * ui, gy + 22 * ui, 10 * ui, player.grenades > 0 ? '#ff9a3a' : '#6f7d82', 'left', 700);
  let gx = wx + ww - 14 * ui;
  for (let i = 0; i < player.maxGrenades; i++){
    const on = i < player.grenades;
    ctx.beginPath();
    ctx.arc(gx, gy + gh / 2, 6 * ui, 0, TAU);
    ctx.fillStyle = on ? '#ff7a3a' : 'rgba(255,255,255,0.10)';
    ctx.fill();
    ctx.strokeStyle = on ? '#ffd0a0' : 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1;
    ctx.stroke();
    gx -= 17 * ui;
  }

  // слоты оружия
  let sx = wx + 14 * ui;
  for (let i = 0; i < GUN_ORDER.length; i++){
    const k = GUN_ORDER[i];
    const owned = player.guns[k].owned;
    const active = player.cur === k;
    const bw = 26 * ui;
    ctx.globalAlpha = owned ? 1 : 0.28;
    ctx.fillStyle = active ? '#ffb545' : 'rgba(255,255,255,0.10)';
    ctx.fillRect(sx, wy + 76 * ui, bw, 4 * ui);
    if (active){ ctx.fillStyle = 'rgba(255,181,69,0.25)'; ctx.fillRect(sx, wy + 74 * ui, bw, 8 * ui); }
    ctx.globalAlpha = 1;
    sx += bw + 6 * ui;
  }

  drawMiniMap();
  drawBossBar();
}

/* --------------------------- mobile HUD -------------------------- */
function drawMobileHUD(){
  const m = mobileScale();
  const land = isLandscapeMobile();
  const padL = 9 * m + SAFE.l;
  const padR = 9 * m + SAFE.r;
  const padT = 9 * m + SAFE.t;
  const pad = padT;
  const pw = Math.min(172 * m, (cw - SAFE.l - SAFE.r) * 0.46);
  const th = 48 * m;
  const g = player.guns[player.cur];
  const hero = HEROES[player.heroId] || HEROES.volk;

  // слева: волна / убийства / очки
  panel(padL, padT, pw, th, 'rgba(5,10,12,0.66)', 'rgba(255,181,69,0.26)');
  txt('ВОЛНА ' + String(state.wave).padStart(2, '0'), padL + 9 * m, padT + 16 * m, Math.max(10, 10 * m), '#ffb545', 'left', 800);
  txt(state.waveState === 'break' ? 'ПЕРЕДЫШКА ' + Math.ceil(Math.max(0, state.breakT)) : 'ЗАЧИСТКА',
    padL + pw - 9 * m, padT + 16 * m, Math.max(8, 7 * m), state.waveState === 'break' ? '#7fd8c8' : '#ff8a5a', 'right', 700);
  txt('УБ ' + state.kills, padL + 9 * m, padT + 31 * m, Math.max(9, 8.5 * m), '#cfd8d4', 'left', 700);
  txt('ОЧКИ ' + state.score, padL + 9 * m, padT + 43 * m, Math.max(9, 8.5 * m), '#ffd06a', 'left', 700);

  // справа: оружие и патроны
  const rx = cw - padR - pw;
  panel(rx, padT, pw, th, 'rgba(5,10,12,0.66)', 'rgba(255,181,69,0.26)');
  txt(WEAPONS[player.cur].tag, rx + 9 * m, padT + 16 * m, 8.5 * m, '#ffb545', 'left', 800);
  txt(String(g.mag).padStart(2, '0'), rx + 9 * m, padT + 38 * m, 19 * m, g.mag > 0 ? '#e8e2d4' : '#ff4d3d', 'left', 800);
  txt('/ ' + (Number.isFinite(g.reserve) ? g.reserve : '∞'), rx + 9 * m + 24 * m, padT + 38 * m, 10 * m, '#98a3a3', 'left', 700);
  if (player.reloadT > 0){
    bar(rx + pw * 0.52, padT + 34 * m, pw * 0.42, 5 * m, 1 - player.reloadT / WEAPONS[player.cur].reload, '#ffb545');
  }

  // здоровье — под левой панелью
  const hbY = padT + th + 7 * m;
  const hpPct = player.hp / player.maxHp;
  const hpCol = hpPct > 0.55 ? '#5fd27a' : hpPct > 0.28 ? '#ffb545' : '#ff4d3d';
  bar(padL, hbY, pw, 8 * m, hpPct, hpCol, 'rgba(0,0,0,0.55)');
  txt('HP ' + Math.ceil(player.hp), padL + 2 * m, hbY + 19 * m, 8 * m, '#cfd8d4', 'left', 700);
  txt(hero.name, padL + pw - 2 * m, hbY + 19 * m, 8 * m, hero.color, 'right', 800);

  // броня / кислотостойкость — строка статусов под HP
  const stY = hbY + 32 * m;
  const chipW = pw * 0.46;
  const hasArmor = player.armor > 0;
  const hasAcid = player.acidResistT > 0;
  if (hasArmor){
    txt('БРОНЯ ' + Math.ceil(player.armor), padL + 2 * m, stY, Math.max(8, 7.6 * m), '#8fd8ff', 'left', 800);
    bar(padL, stY + 3 * m, chipW, 3 * m, clamp(player.armor / player.maxArmor, 0, 1), '#8fd8ff', 'rgba(0,0,0,0.55)');
  }
  if (hasAcid){
    txt('КИСЛОТА ' + Math.ceil(player.acidResistT) + 'с', padL + pw - 2 * m, stY,
      Math.max(8, 7.6 * m), '#9cff4a', 'right', 800);
    bar(padL + pw - chipW, stY + 3 * m, chipW, 3 * m,
      clamp(player.acidResistT / (ACID_RESIST_TIME * 2), 0, 1), '#9cff4a', 'rgba(0,0,0,0.55)');
  }
  const statusExtra = (hasArmor || hasAcid) ? 18 * m : 0;

  // гранаты — иконки справа под панелью оружия
  let gx = cw - padR - 6 * m;
  for (let i = 0; i < player.maxGrenades; i++){
    const on = i < player.grenades;
    ctx.beginPath();
    ctx.arc(gx, hbY + 6 * m, 4.2 * m, 0, TAU);
    ctx.fillStyle = on ? '#ff7a3a' : 'rgba(255,255,255,0.12)';
    ctx.fill();
    ctx.strokeStyle = on ? '#ffd0a0' : 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1;
    ctx.stroke();
    gx -= 11 * m;
  }

  // босс
  const boss = zombies.find(z => z.type === 'boss' && !z.dead);
  if (boss){
    const bw = cw - padL - padR;
    const by = padT + th + (44 + statusExtra / m) * m;
    const accent = boss.bossAccent || '#ff8a5a';
    txt(boss.bossName || 'БОСС', padL, by - 4 * m, 8.5 * m, accent, 'left', 800);
    txt(Math.max(0, Math.ceil(boss.hp)) + ' HP', cw - padR, by - 4 * m, 8 * m, '#c9b79a', 'right', 700);
    bar(padL, by, bw, 7 * m, boss.hp / boss.maxHp, accent, 'rgba(40,10,6,0.7)');
  }

  // объявление нового врага — коротко
  if (state.unlockT > 0 && state.unlockText){
    const a = clamp(state.unlockT, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    const uy = padT + th + (boss ? 62 : 40) * m + statusExtra;
    txt(state.unlockText, safeCx(), uy, 8 * m, '#ffd06a', 'center', 700);
    ctx.restore();
  }
}

/* ------------------------- touch controls ------------------------ */
function drawStick(s, home, R, col){
  const ox = s.active ? s.ox : home.x;
  const oy = s.active ? s.oy : home.y;
  ctx.save();
  ctx.globalAlpha = s.active ? 0.95 : 0.34;
  ctx.beginPath();
  ctx.arc(ox, oy, R, 0, TAU);
  ctx.fillStyle = 'rgba(5,10,12,0.30)';
  ctx.fill();
  ctx.setLineDash([5, 7]);
  ctx.strokeStyle = hexA(col, 0.65);
  ctx.lineWidth = 1.4;
  ctx.stroke();
  ctx.setLineDash([]);

  const kx = s.active ? s.x : ox;
  const ky = s.active ? s.y : oy;
  ctx.globalAlpha = s.active ? 1 : 0.45;
  ctx.beginPath();
  ctx.arc(kx, ky, R * 0.38, 0, TAU);
  ctx.fillStyle = hexA(col, 0.22);
  ctx.fill();
  ctx.strokeStyle = hexA(col, 0.9);
  ctx.lineWidth = 1.8;
  ctx.stroke();
  if (s.active){
    ctx.beginPath();
    ctx.moveTo(kx, ky);
    ctx.lineTo(kx + s.dx * R * 0.32, ky + s.dy * R * 0.32);
    ctx.strokeStyle = hexA(col, 0.7);
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();
}

function drawTouchControls(){
  const L = mobileLayout();
  const m = L.m;
  drawStick(touch.move, L.moveHome, L.stickR, '#7fd8c8');
  drawStick(touch.aim, L.aimHome, L.stickR, '#ffb545');

  const arcPct = {
    dash: 1 - player.dashCd / (player.dashCdMax || 1),
    reload: player.reloadT > 0 ? 1 - player.reloadT / (WEAPONS[player.cur].reload || 1) : 1,
    grenade: 1 - player.grenadeCd / 0.45,
    weapon: 1,
    pause: 1
  };

  for (const b of L.buttons){
    const pressed = touch.pressed && touch.pressed.act === b.act;
    const disabled = b.act === 'grenade' && player.grenades <= 0;
    ctx.save();
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fillStyle = pressed ? 'rgba(255,181,69,0.30)' : 'rgba(7,12,14,0.58)';
    ctx.fill();
    ctx.strokeStyle = disabled ? 'rgba(120,130,130,0.35)'
      : pressed ? 'rgba(255,205,120,0.95)' : 'rgba(255,181,69,0.45)';
    ctx.lineWidth = 1.3 * m;
    ctx.stroke();

    // дуга перезарядки
    const p = clamp(arcPct[b.act] === undefined ? 1 : arcPct[b.act], 0, 1);
    if (p < 0.999){
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r - 2.2 * m, -Math.PI / 2, -Math.PI / 2 + TAU * p);
      ctx.strokeStyle = 'rgba(255,181,69,0.75)';
      ctx.lineWidth = 2.2 * m;
      ctx.stroke();
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 ' + Math.round(Math.max(9, 7.8 * m)) + 'px ' + FONT;
    ctx.fillStyle = disabled ? '#6f7d82' : '#e8e2d4';
    const label = b.act === 'grenade' ? 'ГРАН ' + player.grenades : b.label;
    ctx.fillText(label, b.x, b.y + 0.5 * m);
    ctx.restore();
  }
}

/* ---------------------------- screens --------------------------- */
/* пылинки и угольки в воздухе — оживляют пустую темноту */
function drawAmbient(){
  const t = state.time;
  const n = IS_MOBILE ? 22 : 46;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++){
    const seed = i * 12.9898;
    const baseX = (Math.sin(seed) * 0.5 + 0.5) * cw;
    const baseY = (Math.cos(seed * 1.7) * 0.5 + 0.5) * ch;
    const x = (baseX + Math.sin(t * 0.33 + i * 2.1) * 22 + cw) % cw;
    const y = (baseY + t * (7 + (i % 5) * 4) + Math.sin(t * 0.6 + i) * 14 + ch) % ch;
    const a = 0.05 + 0.13 * (0.5 + 0.5 * Math.sin(t * 1.4 + i));
    const ember = i % 7 === 0;
    ctx.fillStyle = ember
      ? 'rgba(255,150,60,' + a.toFixed(3) + ')'
      : 'rgba(170,210,200,' + (a * 0.65).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(x, y, ember ? 1.9 : 1.15, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawVignette(){
  if (player.hurtT > 0){
    const a = (player.hurtT / 0.7) * 0.55;
    const rg = ctx.createRadialGradient(cw / 2, ch / 2, Math.min(cw, ch) * 0.16, cw / 2, ch / 2, Math.max(cw, ch) * 0.72);
    rg.addColorStop(0, 'rgba(120,0,0,0)');
    rg.addColorStop(1, 'rgba(150,0,0,' + a.toFixed(3) + ')');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, cw, ch);
  }
  if (state.flash > 0){
    ctx.fillStyle = 'rgba(255,120,80,' + (state.flash * 0.22).toFixed(3) + ')';
    ctx.fillRect(0, 0, cw, ch);
  }
}

function drawBanner(){
  if (state.bannerT <= 0) return;
  const t = state.bannerT;
  const a = t > 2.1 ? (2.6 - t) / 0.5 : Math.min(1, t / 0.7);
  const y = ch * 0.24;
  ctx.save();
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.textAlign = 'center';
  const bw = Math.min(640 * ui, safeW() - 16);
  const bh = Math.min(96 * ui, ch * 0.24);
  const bcx = safeCx();
  ctx.fillStyle = 'rgba(4,8,10,0.55)';
  ctx.fillRect(bcx - bw / 2, y - bh * 0.56, bw, bh);
  ctx.strokeStyle = 'rgba(255,181,69,0.35)';
  ctx.strokeRect(bcx - bw / 2, y - bh * 0.56, bw, bh);
  ctx.font = '800 ' + Math.round(Math.min(52 * ui, bw / 7)) + 'px ' + FONT;
  ctx.fillStyle = '#ffb545';
  ctx.shadowColor = 'rgba(255,140,40,0.8)';
  ctx.shadowBlur = IS_MOBILE ? 12 : 24;
  ctx.fillText(state.banner, bcx, y + 6 * ui);
  ctx.shadowBlur = 0;
  if (state.bannerSub){
    ctx.font = '600 ' + Math.round(Math.min(15 * ui, bw / 24)) + 'px ' + FONT;
    ctx.fillStyle = 'rgba(201,183,154,0.9)';
    ctx.fillText(state.bannerSub, bcx, y + bh * 0.34);
  }
  ctx.restore();
}

function drawPickupMsg(){
  if (!(state.pickupT > 0)) return;
  const t = state.pickupT;
  const k = t > 2.1 ? (2.4 - t) / 0.3 : Math.min(1, t / 0.5);
  const pop = 1 + (1 - Math.min(1, (2.4 - t) / 0.22)) * 0.12;
  ctx.save();
  ctx.globalAlpha = clamp(k, 0, 1);
  ctx.textAlign = 'center';
  const y = ch * 0.5;
  const bw = Math.min(600 * ui, safeW() - 16);
  const bh = Math.min(92 * ui, bw * 0.153);
  ctx.translate(safeCx(), y);
  ctx.scale(pop, pop);
  ctx.fillStyle = 'rgba(4,8,10,0.62)';
  ctx.fillRect(-bw / 2, -bh / 2, bw, bh);
  ctx.strokeStyle = 'rgba(255,181,69,0.55)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(-bw / 2, -bh / 2, bw, bh);
  ctx.font = '800 ' + Math.round(Math.min(20 * ui, bw / 26)) + 'px ' + FONT;
  ctx.fillStyle = 'rgba(201,183,154,0.95)';
  ctx.fillText(state.pickupMsg, 0, -bh * 0.14);
  ctx.font = '900 ' + Math.round(Math.min(34 * ui, bw / 14)) + 'px ' + FONT;
  ctx.fillStyle = state.pickupColor || '#ffd06a';
  ctx.shadowColor = 'rgba(255,140,40,0.85)';
  ctx.shadowBlur = 22;
  ctx.fillText(state.pickupSub, 0, bh * 0.28);
  ctx.restore();
}

function drawSubBanner(){
  if (!(state.popupT > 0)) return;
  ctx.save();
  ctx.globalAlpha = clamp(state.popupT / 1.2, 0, 1);
  ctx.textAlign = 'center';
  ctx.font = '800 ' + Math.round(24 * ui) + 'px ' + FONT;
  ctx.fillStyle = state.popupColor || '#ffd06a';
  ctx.shadowColor = 'rgba(255,140,40,0.6)';
  ctx.shadowBlur = 14;
  ctx.fillText(state.popup, cw / 2, ch * 0.36);
  ctx.restore();
}

function drawMenu(){
  ctx.fillStyle = 'rgba(3,6,8,0.72)';
  ctx.fillRect(0, 0, cw, ch);

  // декоративная сетка
  ctx.save();
  ctx.globalAlpha = 0.15;
  ctx.strokeStyle = '#2f5a55';
  ctx.lineWidth = 1;
  for (let x = 0; x < cw; x += 64 * ui){
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ch); ctx.stroke();
  }
  for (let y = 0; y < ch; y += 64 * ui){
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cw, y); ctx.stroke();
  }
  ctx.restore();

  const cx = cw / 2;
  const cy = ch / 2;

  if (IS_MOBILE){ drawMenuMobile(); return; }

  ctx.save();
  ctx.textAlign = 'center';

  // заголовок

/* ---------------- мобильный экран выбора бойца ---------------- */

/* подбираем кегль так, чтобы строка точно влезла в ширину */
function fitFs(text, fs, maxW, weight){
  ctx.save();
  ctx.font = (weight || 800) + ' ' + Math.round(fs * 1.14) + 'px ' + FONT;
  const w = ctx.measureText(String(text)).width;
  ctx.restore();
  return (w > maxW && w > 0) ? fs * maxW / w : fs;
}

/* перенос длинного описания по словам */
function wrapLines(text, maxW, fs, weight){
  const words = String(text).split(/\s+/);
  const lines = [];
  let cur = '';
  ctx.save();
  ctx.font = (weight || 600) + ' ' + Math.round(fs * 1.14) + 'px ' + FONT;
  for (const w of words){
    const next = cur ? cur + ' ' + w : w;
    if (cur && ctx.measureText(next).width > maxW){
      lines.push(cur);
      cur = w;
    } else {
      cur = next;
    }
  }
  if (cur) lines.push(cur);
  ctx.restore();
  return lines;
}

/* пара «подпись — значение»: при нехватке места аккуратно уменьшаем обе */
function pairFs(label, value, fs, maxW){
  ctx.save();
  ctx.font = '700 ' + Math.round(fs * 1.14) + 'px ' + FONT;
  const a = ctx.measureText(label).width;
  ctx.font = '800 ' + Math.round(fs * 1.05 * 1.14) + 'px ' + FONT;
  const b = ctx.measureText(value).width;
  ctx.restore();
  const need = a + b + 6;
  return need > maxW ? Math.max(7.6, fs * (maxW - 6) / (a + b)) : fs;
}

/* узкая вертикальная карточка (телефон в портрете) */
function drawMobileCardTall(r, hero, id, pad, numH, sel){
  const cx = r.x + r.w / 2;
  const innerW = r.w - pad * 2;
  const top = r.y + pad + numH;

  // фото
  const ps = Math.min(innerW, Math.max(86, (r.h - pad * 2 - numH) * 0.32));
  ctx.save();
  ctx.globalAlpha = sel ? 1 : 0.7;
  drawPortrait(cx - ps / 2, top, ps, id, hero.tint, hero.accent);
  ctx.restore();

  // имя и роль (роль и тег — отдельными строками, чтобы влезли в узкую карточку)
  let nameFs = Math.max(17, Math.min(28, r.w * 0.125));
  nameFs = fitFs(hero.name, nameFs, innerW, 800);
  let y = top + ps + nameFs * 1.0;
  txt(hero.name, cx, y, nameFs, sel ? hero.color : '#c9d2ce', 'center', 800);

  const roleFs = Math.max(8.5, Math.min(12, nameFs * 0.5));
  y += roleFs * 1.7;
  txt(hero.role, cx, y, fitFs(hero.role, roleFs, innerW, 700),
    sel ? '#7fd8c8' : '#86999a', 'center', 700);
  y += roleFs * 1.55;
  txt(hero.tag, cx, y, fitFs(hero.tag, roleFs * 0.92, innerW, 700), '#8b9997', 'center', 700);

  // разделитель
  y += roleFs * 1.1;
  ctx.strokeStyle = sel ? hexA(hero.accent, 0.55) : 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(r.x + pad, y); ctx.lineTo(r.x + r.w - pad, y); ctx.stroke();

  // кнопка
  const bh = Math.max(34, Math.min(48, r.h * 0.078));
  y += bh * 0.55;
  if (sel){
    panel(r.x + pad, y, innerW, bh, hero.color, hero.color);
    txt('▶ В БОЙ', cx, y + bh * 0.69, Math.max(13, Math.min(17, bh * 0.4)), '#12160f', 'center', 800);
  } else {
    panel(r.x + pad, y, innerW, bh, 'rgba(255,255,255,0.05)', 'rgba(255,255,255,0.16)');
    txt('▶ В БОЙ', cx, y + bh * 0.69, Math.max(13, Math.min(17, bh * 0.4)), '#b9c4c2', 'center', 800);
  }
  y += bh;

  // характеристики: делим оставшееся место, чтобы карточка не пустовала
  const rows = mobileStatRows(hero);
  const bottom = r.y + r.h - pad;
  const remain = Math.max(60, bottom - y - pad);
  const rowH = Math.max(21, Math.min(56, remain / 3.55));
  const lblFs = Math.max(8.2, Math.min(12, innerW / 15.5));
  let sy = y + rowH * 0.55;
  for (const row of rows){
    if (sy + rowH > bottom + 1) break;
    const fs = pairFs(row.label, row.value, lblFs, innerW);
    txt(row.label, r.x + pad, sy, fs, '#98a3a3', 'left', 700);
    txt(row.value, r.x + r.w - pad, sy, fs * 1.05, row.color, 'right', 800);
    bar(r.x + pad, sy + fs * 0.72, innerW, Math.max(5, Math.min(8, rowH * 0.16)),
      clamp(row.frac, 0, 1), row.color, 'rgba(0,0,0,0.55)');
    sy += rowH;
  }

  // описание — только если реально осталось место
  const descFs = Math.max(9, Math.min(11.5, innerW / 18));
  const descLines = wrapLines(hero.desc.join(' '), innerW, descFs, 600);
  const descH = descLines.length * descFs * 1.55;
  if (sy + descFs * 0.8 + descH <= bottom){
    let dy = sy + descFs * 1.1;
    for (const line of descLines){
      txt(line, cx, dy, descFs, '#b9c4c2', 'center', 600);
      dy += descFs * 1.55;
    }
  }
}

/* широкая «лежачая» карточка (телефон в горизонтали): фото слева, статы справа */
function drawMobileCardWide(r, hero, id, pad, numH, sel){
  const innerH = r.h - pad * 2;
  const top = r.y + pad + numH;
  const leftW = Math.max(92, Math.min(160, r.w * 0.4));
  const cxL = r.x + leftW / 2;

  const bh = Math.max(30, Math.min(42, r.h * 0.12));
  let nameFs = Math.max(16, Math.min(24, leftW * 0.18));
  nameFs = fitFs(hero.name, nameFs, leftW - pad, 800);
  const roleFs = Math.max(8.5, Math.min(11, nameFs * 0.46));
  const textBlock = nameFs * 1.05 + roleFs * 1.55 * 2 + 6 + bh;
  const ps = Math.max(48, Math.min(leftW - pad * 2, innerH - numH - textBlock - 4));
  const px = r.x + (leftW - ps) / 2;
  ctx.save();
  ctx.globalAlpha = sel ? 1 : 0.7;
  drawPortrait(px, top, ps, id, hero.tint, hero.accent);
  ctx.restore();

  let ly = top + ps + nameFs * 1.0;
  txt(hero.name, cxL, ly, nameFs, sel ? hero.color : '#c9d2ce', 'center', 800);
  const roleTexts = [hero.role, hero.tag];
  for (let k = 0; k < roleTexts.length; k++){
    ly += roleFs * 1.55;
    txt(roleTexts[k], cxL, ly, fitFs(roleTexts[k], roleFs, leftW - pad, 700),
      k === 0 ? (sel ? '#7fd8c8' : '#86999a') : '#8b9997', 'center', 700);
  }

  // кнопка внизу левой колонки
  const bx = r.x + pad;
  const bw = leftW - pad * 2;
  const by = r.y + r.h - pad - bh;
  if (sel){
    panel(bx, by, bw, bh, hero.color, hero.color);
    txt('▶ В БОЙ', cxL, by + bh * 0.69, Math.max(12, Math.min(16, bh * 0.4)), '#12160f', 'center', 800);
  } else {
    panel(bx, by, bw, bh, 'rgba(255,255,255,0.05)', 'rgba(255,255,255,0.16)');
    txt('▶ В БОЙ', cxL, by + bh * 0.69, Math.max(12, Math.min(16, bh * 0.4)), '#b9c4c2', 'center', 800);
  }

  // разделитель
  ctx.strokeStyle = sel ? hexA(hero.accent, 0.4) : 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(r.x + leftW, r.y + pad);
  ctx.lineTo(r.x + leftW, r.y + r.h - pad);
  ctx.stroke();

  // правая колонка: характеристики
  const rows = mobileStatRows(hero);
  const sx = r.x + leftW + pad * 0.8;
  const sw = r.x + r.w - pad - sx;
  const rowH = Math.max(24, Math.min(46, innerH * 0.21));
  const lblFs = Math.max(8.2, Math.min(11.5, sw / 17));
  const statsTop = r.y + pad + numH;
  const statsAreaH = r.h - pad - statsTop;
  let sy = statsTop + Math.max(0, (statsAreaH - rows.length * rowH) / 2);
  for (const row of rows){
    const fs = pairFs(row.label, row.value, lblFs, sw);
    txt(row.label, sx, sy, fs, '#98a3a3', 'left', 700);
    txt(row.value, sx + sw, sy, fs * 1.05, row.color, 'right', 800);
    bar(sx, sy + fs * 0.72, sw, Math.max(5, Math.min(8, rowH * 0.16)),
      clamp(row.frac, 0, 1), row.color, 'rgba(0,0,0,0.55)');
    sy += rowH;
  }
}

function mobileStatRows(hero){
  return [
    { label: 'ЗДОРОВЬЕ', frac: hero.hp / 100, value: hero.hp + ' HP', color: hero.hp >= 100 ? '#5fd27a' : '#ffb545' },
    { label: 'СКОРОСТЬ ОГНЯ', frac: 0.9 / hero.rofMul, value: hero.fireLabel, color: '#ffd06a' },
    { label: 'РЫВОК', frac: hero.dashPower / 1.18, value: hero.dashLabel, color: '#7fd8c8' }
  ];
}

function drawPause(){
  ctx.fillStyle = 'rgba(3,6,8,0.62)';
  ctx.fillRect(0, 0, cw, ch);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '900 ' + Math.round(Math.min(64 * ui, safeW() / 6)) + 'px ' + FONT;
  ctx.fillStyle = '#ffb545';
  ctx.fillText('ПАУЗА', safeCx(), ch / 2 - 10 * ui);
  ctx.font = '600 ' + Math.round(Math.min(16 * ui, safeW() / 20)) + 'px ' + FONT;
  ctx.fillStyle = '#b9c4c2';
  ctx.fillText(IS_MOBILE ? 'ТАП — ПРОДОЛЖИТЬ' : 'ESC / ЛКМ — продолжить', safeCx(), ch / 2 + 26 * ui);
  ctx.restore();
}

function drawDead(){
  const k = Math.min(ui, safeW() / 520);
  ctx.fillStyle = 'rgba(24,2,2,0.62)';
  ctx.fillRect(0, 0, cw, ch);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '900 ' + Math.round(Math.min(86 * k, safeW() / 6.4)) + 'px ' + FONT;
  ctx.fillStyle = '#ff4d3d';
  ctx.shadowColor = 'rgba(255,40,20,0.8)';
  ctx.shadowBlur = 30 * k;
  ctx.fillText('ВЫ МЕРТВЫ', safeCx(), ch / 2 - 60 * k);
  ctx.shadowBlur = 0;

  const stats = [
    ['ВОЛНА', String(state.wave)],
    ['УБИЙСТВА', String(state.kills)],
    ['ОЧКИ', String(state.score)],
    ['РЕКОРД', String(state.best)]
  ];
  const pw = Math.min(420 * k, safeW() - 20);
  const pcx = safeCx();
  panel(pcx - pw / 2, ch / 2 - 36 * k, pw, 112 * k, 'rgba(8,6,6,0.8)', 'rgba(255,77,61,0.35)');
  stats.forEach((s, i) => {
    const x = pcx - pw / 2 + 28 * k + (i % 2) * (pw / 2);
    const y = ch / 2 + 2 * k + Math.floor(i / 2) * 42 * k;
    ctx.textAlign = 'left';
    ctx.font = '600 ' + Math.round(13 * k) + 'px ' + FONT;
    ctx.fillStyle = '#98a3a3';
    ctx.fillText(s[0], x, y);
    ctx.font = '800 ' + Math.round(24 * k) + 'px ' + FONT;
    ctx.fillStyle = '#ffb545';
    ctx.fillText(s[1], x, y + 24 * k);
  });

  ctx.textAlign = 'center';
  ctx.font = '800 ' + Math.round(19 * k) + 'px ' + FONT;
  ctx.fillStyle = '#ffd06a';
  ctx.fillText(IS_MOBILE ? 'ТАП — ВЫБРАТЬ БОЙЦА' : 'R / ЛКМ — ВЫБРАТЬ БОЙЦА', safeCx(), ch / 2 + 112 * k);
  ctx.restore();
}

/* ---------------------------- render ---------------------------- */
function drawPools(){
  ctx.save();
  for (const p of pools){
    const a = clamp(p.life / 5, 0, 1) * clamp(p.t / 0.35, 0, 1);
    if (a <= 0.01) continue;
    ctx.globalAlpha = a;
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
    g.addColorStop(0, 'rgba(' + p.color + ',0.86)');
    g.addColorStop(0.62, 'rgba(' + p.color + ',0.66)');
    g.addColorStop(1, 'rgba(' + p.color + ',0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, TAU);
    ctx.fill();
    for (const l of p.lobes){
      const lx = p.x + Math.cos(l.a) * p.r * l.d;
      const ly = p.y + Math.sin(l.a) * p.r * l.d;
      ctx.beginPath();
      ctx.ellipse(lx, ly, p.r * l.s, p.r * l.s * 0.66, l.a, 0, TAU);
      ctx.fill();
    }
    // мокрый блик
    ctx.globalAlpha = a * 0.35;
    ctx.fillStyle = 'rgba(255,180,170,0.5)';
    ctx.beginPath();
    ctx.ellipse(p.x - p.r * 0.2, p.y - p.r * 0.22, p.r * 0.24, p.r * 0.1, -0.5, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawGibs(){
  for (const g of gibs){
    if (g.x < view.x - 60 || g.y < view.y - 60 || g.x > view.x + viewW() + 60 || g.y > view.y + viewH() + 60) continue;
    const t = clamp(g.life / g.max, 0, 1);
    ctx.save();
    ctx.globalAlpha = t < 0.25 ? t / 0.25 : 1;
    // тень
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(g.x + 2, g.y + 3, g.r * 1.1, g.r * 0.6, 0, 0, TAU);
    ctx.fill();
    ctx.translate(g.x, g.y);
    ctx.rotate(g.rot);
    ctx.fillStyle = g.color;
    if (g.kind === 'head'){
      ctx.beginPath(); ctx.arc(0, 0, g.r, 0, TAU); ctx.fill();
      ctx.fillStyle = '#c21818';
      ctx.beginPath(); ctx.arc(0, 0, g.r * 0.55, 0, TAU); ctx.fill();
      ctx.fillStyle = '#1a1a12';
      ctx.beginPath(); ctx.arc(g.r * 0.35, -g.r * 0.3, g.r * 0.16, 0, TAU); ctx.fill();
    } else if (g.kind === 'chunk'){
      ctx.beginPath(); ctx.ellipse(0, 0, g.r, g.r * 0.7, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(200,20,20,0.8)';
      ctx.beginPath(); ctx.arc(g.r * 0.4, 0, g.r * 0.28, 0, TAU); ctx.fill();
    } else {
      // конечность / обрубок
      ctx.beginPath();
      ctx.ellipse(0, 0, g.r * 1.5, g.r * 0.62, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#b01818';
      ctx.beginPath();
      ctx.ellipse(g.r * 1.1, 0, g.r * 0.5, g.r * 0.55, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(240,225,190,0.75)';
      ctx.beginPath();
      ctx.arc(g.r * 1.25, 0, g.r * 0.18, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawGrenades(){
  for (const g of grenades){
    ctx.save();
    // тень на полу
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(g.x, g.y + 2, 7, 4, 0, 0, TAU);
    ctx.fill();

    const gy = g.y - g.z;
    ctx.translate(g.x, gy);
    // свечение
    ctx.globalCompositeOperation = 'lighter';
    const urgent = g.fuse < 0.45;
    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, urgent ? 30 : 18);
    glow.addColorStop(0, urgent ? 'rgba(255,90,40,0.8)' : 'rgba(255,190,80,0.5)');
    glow.addColorStop(1, 'rgba(255,120,20,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, 0, urgent ? 30 : 18, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    ctx.rotate(g.rot);
    ctx.fillStyle = '#2f3b2a';
    ctx.beginPath(); ctx.arc(0, 0, g.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#8fa06a';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#11170f';
    ctx.fillRect(-2.5, -g.r - 3, 5, 4);
    ctx.strokeStyle = '#ffb545';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(0, 0, g.r * 0.55, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }
}

function drawTexts(){
  for (const t of texts){
    const a = clamp(t.life / 0.4, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.font = '900 ' + Math.round(t.size * 1.12) + 'px ' + FONT;
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillText(t.text, t.x + 1.5, t.y + 1.5);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
    ctx.restore();
  }
}

function drawShockwaves(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const s of shockwaves){
    const t = clamp(s.life / s.maxLife, 0, 1);
    ctx.globalAlpha = t;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.w * t;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = t * 0.5;
    ctx.lineWidth = Math.max(1, s.w * 0.4);
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * 0.72, 0, TAU);
    ctx.stroke();
  }
  ctx.restore();
}

function drawScreenBlood(dt){
  if (!screenBlood.length) return;
  ctx.save();
  for (const b of screenBlood){
    const t = clamp(b.life / b.max, 0, 1);
    const a = Math.min(1, t * 1.6) * b.alpha;
    ctx.globalAlpha = a;
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    g.addColorStop(0, 'rgba(150,6,6,0.95)');
    g.addColorStop(0.55, 'rgba(120,6,6,0.75)');
    g.addColorStop(1, 'rgba(90,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(b.x, b.y, b.r, b.r * 0.78, b.rot, 0, TAU);
    ctx.fill();
    // потёк
    const len = b.r * (1.2 + t * 0.8);
    ctx.strokeStyle = 'rgba(120,4,4,' + (a * 0.7).toFixed(3) + ')';
    ctx.lineWidth = b.r * 0.16;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x + Math.cos(b.rot + 1.4) * len * 0.25, b.y + len);
    ctx.stroke();
  }
  ctx.restore();
}

function render(){
  const vw = viewW(), vh = viewH();
  ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, 0, 0);
  ctx.clearRect(0, 0, vw + 2, vh + 2);

  const vx = cam.x + state.sx;
  const vy = cam.y + state.sy;
  view.x = vx;
  view.y = vy;

  ctx.save();
  ctx.translate(-vx, -vy);
  drawFloor(vx, vy);
  drawDecals(vx, vy);
  drawPools();
  drawPickups();
  drawBushes(vx, vy);
  drawWalls(vx, vy);
  drawEnemyBullets();
  drawGibs();
  drawZombies();
  drawPlayer();
  drawBushTops(vx, vy);
  drawBullets();
  drawMines();
  drawGrenades();
  drawParticles();
  drawShockwaves();
  drawFlashes();
  drawTexts();
  drawLighting(vx, vy);
  ctx.restore();

  // дальше всё в экранных координатах (1:1 с CSS-пикселями)
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawAmbient();
  drawVignette();
  drawScreenBlood();

  if (state.mode !== 'menu' && state.mode !== 'select'){
    if (IS_MOBILE) drawMobileHUD();
    else drawHUD();
  }
  drawBanner();
  drawPickupMsg();
  drawSubBanner();
  drawCrosshair();
  if (IS_MOBILE && (state.mode === 'playing' || state.mode === 'paused')) drawTouchControls();

  if (state.mode === 'menu') drawMenu();
  if (state.mode === 'select') drawSelect();
  if (state.mode === 'paused') drawPause();
  if (state.mode === 'dead') drawDead();
}

/* ----------------------------- loop ----------------------------- */
let last = performance.now();
let overCheck = 0;
let perfAcc = 0, perfFrames = 0, perfWarmup = 60;

/* Авторазрешение: если кадры стабильно длиннее 1/50 с — снижаем внутреннее
   разрешение (объекты те же, картинка чуть мягче), чтобы вернуть 60 FPS.
   Поднимаем обратно только при устойчивом запасе, с гистерезисом. */
function tuneRenderScale(real){
  if (perfWarmup > 0){ perfWarmup--; return; }
  perfAcc += real;
  perfFrames++;
  // ждём либо накопленное время, либо достаточно кадров (на быстрых экранах)
  if (perfAcc < 0.34 || perfFrames < 12) return;
  const avg = perfAcc / perfFrames;
  perfAcc = 0; perfFrames = 0;
  if (avg > 0.0200 && renderScale > 0.601){
    setRenderScale(renderScale - (avg > 0.033 ? 0.2 : 0.12));
    perfWarmup = 12;
  } else if (avg < 0.0135 && renderScale < 0.999){
    setRenderScale(renderScale + 0.06);
    perfWarmup = 40;
  }
}

function frame(now){
  const raw = Math.max(0, (now - last) / 1000);
  const real = Math.min(0.05, raw);
  last = now;
  tuneRenderScale(real);

  // хитстоп и слоу-мо
  let scale = 1;
  if (state.hitstop > 0){
    state.hitstop = Math.max(0, state.hitstop - real);
    scale = 0.05;
  } else if (state.slowmo > 0){
    state.slowmo = Math.max(0, state.slowmo - real);
    scale = 0.34;
  }

  // длинный кадр дробим на подшаги: физика не «прыгает»,
  // а на 120 Гц шаг остаётся коротким и движение плавным
  let left = real * scale;
  let guard = 0;
  while (left > 0.00001 && guard < 4){
    const step = Math.min(1 / 60, left);
    update(step);
    left -= step;
    guard++;
  }
  if (guard === 4) left = 0;

  // определение прицела над зомби (для цвета перекрестия)
  overCheck -= real;
  if (overCheck <= 0 && state.mode === 'playing'){
    overCheck = 0.06;
    if (IS_MOBILE && touch.aim.active){
      mouse.over = zombies.some(z => !z.dead &&
        dist2(player.x, player.y, z.x, z.y) < 700 * 700 &&
        Math.abs(wrapAngle(Math.atan2(z.y - player.y, z.x - player.x) - player.aim)) < 0.26);
    } else {
      const wx = mouse.x / zoom + view.x, wy = mouse.y / zoom + view.y;
      mouse.over = zombies.some(z => !z.dead && dist2(wx, wy, z.x, z.y) < (z.r + 10) * (z.r + 10));
    }
  }

  render();
  requestAnimationFrame(frame);
}

/* ---------------------------- boot ------------------------------ */
player.guns = {};
for (const k of GUN_ORDER){
  player.guns[k] = {
    mag: WEAPONS[k].mag,
    reserve: k === 'pistol' ? Infinity : 0,
    owned: k === 'pistol'
  };
}
cam.x = clamp(WORLD.w / 2 - viewW() / 2, 0, Math.max(0, WORLD.w - viewW()));
cam.y = clamp(WORLD.h / 2 - viewH() / 2, 0, Math.max(0, WORLD.h - viewH()));
requestAnimationFrame(frame);

// отладочный автозапуск: index.html?auto
window.__ds = { player, state, zombies, bullets, enemyBullets, pickups, gibs, pools, texts, particles, shockwaves, grenades, mines, cam, view, lamps, screenBlood, SAFE, safeW, safeCx, startGame, openSelect, selectHero, cycleSelect, heroCardRect, heroCardAt, selectTabRect, mobileSelectLayout, mobileLayout, touch, viewW, viewH, zoom: () => zoom, renderScale: () => renderScale, setRenderScale, dpr: () => dpr, IS_MOBILE, shoot, dash, update, beginWave, spawnZombie, spawnPickup, applyPickup, dropLoot, hurtPlayer, throwGrenade, explode, damageZombie, killZombie, pickType, bossForWave, BOSS_LIST, ENEMY_SPECS, ENEMY_NAMES, ENEMY_UNLOCKS, WEAPONS, GUN_ORDER, HEROES, HERO_ORDER, FONT, sfx, switchWeapon, rocketBoom, mineBoom, bushes, walls, toxicBurst, bomberBoom, shootAcid, findFreeSpot, pointInWall, clearWave };
if (new URLSearchParams(location.search).has('auto')) startGame();
</script>
