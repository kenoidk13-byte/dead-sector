<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<title>DEAD SECTOR // охота на насекомых</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&display=swap');
  :root{
    --amber:#ffb545;
    /* безопасные зоны (вырез, «домашняя» полоса) — нужны в горизонтали */
    --sat:env(safe-area-inset-top, 0px);
    --sar:env(safe-area-inset-right, 0px);
    --sab:env(safe-area-inset-bottom, 0px);
    --sal:env(safe-area-inset-left, 0px);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:#05070a; overflow:hidden; overscroll-behavior:none; touch-action:none; }
  body{ font-family:"Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",sans-serif; color:#e8e2d4; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  canvas{ display:block; width:100%; height:100%; cursor:none; touch-action:none; -webkit-user-select:none; }
  #hint{
    position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
    color:#6f7d82; font-size:13px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
    pointer-events:none; opacity:.75; white-space:nowrap;
  }
  @media (max-width:900px){ #hint{ display:none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';

/* ============================================================
   DEAD SECTOR — top-down insect shooter (Alien Shooter vibes)
   ============================================================ */

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d', { alpha: false });

/* ------------------------ платформа ----------------------------- */
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1);
const IS_ANDROID = /Android/i.test(navigator.userAgent);
const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
const IS_MOBILE = IS_TOUCH && Math.min(window.innerWidth, window.innerHeight) < 900;
const IS_PORTRAIT = () => ch > cw;
const QUALITY = IS_MOBILE ? 0.72 : 1;

const lightCanvas = document.createElement('canvas');
const lctx = lightCanvas.getContext('2d');
// свет рисуем в половинном разрешении — мягкие пятна не требуют пиксельной точности,
// зато заливка градиентов вчетверо дешевле
const LIGHT_SCALE = IS_MOBILE ? 0.5 : 0.55;

const WORLD = { w: 2800, h: 2000 };
const decals = document.createElement('canvas');
decals.width = WORLD.w;
decals.height = WORLD.h;
const dctx = decals.getContext('2d');

let cw = 1920, ch = 1080, dpr = 1, ui = 1, zoom = 1;
let dprMax = 1;          // штатный DPR для этого устройства
let renderScale = 1;     // автопонижение разрешения при просадках (1 … 0.6)
let vignetteCache = null;
/* безопасные зоны экрана: на iPhone в горизонтали слева вырез, снизу полоса */
const SAFE = { t: 0, r: 0, b: 0, l: 0 };

function readSafeArea(){
  const cs = getComputedStyle(document.documentElement);
  const val = (name) => {
    const v = parseFloat(cs.getPropertyValue(name));
    return Number.isFinite(v) ? v : 0;
  };
  // в портрете вырез сверху, в горизонтали — сбоку: env() сам даёт верные края
  SAFE.t = val('--sat');
  SAFE.r = val('--sar');
  SAFE.b = val('--sab');
  SAFE.l = val('--sal');
  if (IS_PORTRAIT()){ SAFE.l = 0; SAFE.r = 0; }
}
function isLandscapeMobile(){ return IS_MOBILE && ch <= cw; }
function safeW(){ return Math.max(240, cw - SAFE.l - SAFE.r); }
function safeCx(){ return SAFE.l + safeW() / 2; }

function applyCanvasSize(){
  cvs.width = Math.max(1, Math.round(cw * dpr));
  cvs.height = Math.max(1, Math.round(ch * dpr));
  cvs.style.width = cw + 'px';
  cvs.style.height = ch + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function resize(){
  cw = Math.max(320, window.innerWidth);
  ch = Math.max(240, window.innerHeight);
  readSafeArea();
  // на телефонах ограничиваем DPR — это главный резерв FPS
  dprMax = Math.min(IS_MOBILE ? 1.5 : 2, window.devicePixelRatio || 1);
  dpr = dprMax * renderScale;
  applyCanvasSize();
  lightCanvas.width = Math.max(1, Math.round(cw * LIGHT_SCALE));
  lightCanvas.height = Math.max(1, Math.round(ch * LIGHT_SCALE));
  // масштаб мира: на маленьких экранах отдаляем камеру,
  // поэтому все объекты выглядят мельче, а обзор шире
  zoom = Math.min(1, Math.max(0.5, Math.min(cw / 1280, ch / 720)));
  ui = IS_MOBILE
    ? Math.min(1.2, Math.max(0.8, Math.min(cw, ch) / 420))
    : Math.max(0.7, Math.min(1.45, cw / 1920));
  vignetteCache = null;
}

function setRenderScale(s){
  s = clamp(s, 0.6, 1);
  if (Math.abs(s - renderScale) < 0.001) return;
  renderScale = s;
  dpr = dprMax * renderScale;
  applyCanvasSize();
}
window.addEventListener('resize', resize);
function relayout(){
  // при повороте старые касания уже не соответствуют новой раскладке
  resetInputs();
  resize(); setTimeout(resize, 120); setTimeout(resize, 420);
}
window.addEventListener('orientationchange', relayout);
if (window.screen && screen.orientation && screen.orientation.addEventListener){
  screen.orientation.addEventListener('change', relayout);
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();

// размеры видимой области мира (с учётом отдаления камеры)
function viewW(){ return cw / zoom; }
function viewH(){ return ch / zoom; }

/* цветовые помощники для подсветки врагов */
function hexA(hex, a){
  if (!hex || hex[0] !== '#') return 'rgba(255,255,255,' + a + ')';
  let h = hex.slice(1);
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const n = parseInt(h, 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
const glowCache = new Map();
function glowSprite(color, alpha){
  const key = color + '|' + alpha;
  let c = glowCache.get(key);
  if (!c){
    c = document.createElement('canvas');
    c.width = c.height = 64;
    const g2 = c.getContext('2d');
    const g = g2.createRadialGradient(32, 32, 8, 32, 32, 32);
    g.addColorStop(0, hexA(color, alpha));
    g.addColorStop(0.55, hexA(color, alpha * 0.36));
    g.addColorStop(1, hexA(color, 0));
    g2.fillStyle = g;
    g2.beginPath(); g2.arc(32, 32, 32, 0, TAU); g2.fill();
    glowCache.set(key, c);
  }
  return c;
}
function lighten(hex, amt){
  if (!hex || hex[0] !== '#') return hex;
  let h = hex.slice(1);
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const n = parseInt(h, 16);
  const r = Math.min(255, Math.round(((n >> 16) & 255) * (1 + amt) + 20 * amt));
  const g = Math.min(255, Math.round(((n >> 8) & 255) * (1 + amt) + 20 * amt));
  const b = Math.min(255, Math.round((n & 255) * (1 + amt) + 20 * amt));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function lerpAngle(a, b, t){
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return a + d * t;
}

  addWall(0, 0, WORLD.w, T);
  addWall(0, WORLD.h - T, WORLD.w, T);
  addWall(0, 0, T, WORLD.h);
  addWall(WORLD.w - T, 0, T, WORLD.h);

  // кустарник: не блокирует, просто цепляет взгляд и шелестит
  bushes.length = 0;
  const px = WORLD.w / 2, py = WORLD.h / 2;
  let tries = 0;
  while (bushes.length < 96 && tries++ < 3000){
    const r = srange(46, 132);
    const x = srange(120, WORLD.w - 120);
    const y = srange(120, WORLD.h - 120);
    if (dist2(x, y, px, py) < 260 * 260) continue;
    let bad = false;
    for (const b of bushes){
      if (dist2(x, y, b.x, b.y) < (b.r + r) * 0.72 * (b.r + r) * 0.72){ bad = true; break; }
    }
    if (bad) continue;
    const lobes = [];
    const n = 5 + Math.floor(srange(0, 4));
    for (let i = 0; i < n; i++){
      const a = srange(0, TAU), d = srange(0.1, 0.78);
      lobes.push({ a, d, s: srange(0.3, 0.62), rot: srange(0, TAU) });
    }
    bushes.push({
      x, y, r,
      los: lobes,
      ph: srange(0, TAU),
      dry: srange(0, 1) < 0.3,
      sway: 0
    });
  }

  lamps.length = 0;
  lamps.push(
    { x: 520, y: 360, r: 360, warm: true },
    { x: 1280, y: 980, r: 400, warm: true },
    { x: 1980, y: 520, r: 350, warm: false },
    { x: 760, y: 1520, r: 360, warm: true },
    { x: 2120, y: 1420, r: 380, warm: false },
    { x: 1460, y: 260, r: 340, warm: true },
    { x: 2560, y: 1760, r: 320, warm: false },
    { x: 380, y: 1080, r: 340, warm: true },
    { x: 1800, y: 1900, r: 300, warm: false }
  );
}

/* -------------------------- floor tile ------------------------- */
function makeFloorPattern(){
  const t = document.createElement('canvas');
  t.width = t.height = 200;
  const g = t.getContext('2d');
  g.fillStyle = '#1a2326';
  g.fillRect(0, 0, 200, 200);

  for (let i = 0; i < 3200; i++){
    const v = irand(60, 130);
    g.fillStyle = `rgba(${v},${v + 10},${v + 8},${rand(0.02, 0.08).toFixed(3)})`;
    g.fillRect(rand(0, 200), rand(0, 200), rand(1, 2.4), rand(1, 2.4));
  }
  g.strokeStyle = 'rgba(0,0,0,.55)';
  g.lineWidth = 2;
  for (let i = 0; i <= 200; i += 100){
    g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 200); g.stroke();
    g.beginPath(); g.moveTo(0, i); g.lineTo(200, i); g.stroke();
  }
  g.strokeStyle = 'rgba(255,255,255,.028)';
  g.lineWidth = 1;
  for (let i = 1; i <= 200; i += 100){
    g.beginPath(); g.moveTo(i + 1, 0); g.lineTo(i + 1, 200); g.stroke();
    g.beginPath(); g.moveTo(0, i + 1); g.lineTo(200, i + 1); g.stroke();
  }
  for (let i = 0; i < 16; i++){
    const x = rand(0, 200), y = rand(0, 200), r = rand(8, 34);
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, 'rgba(28,52,32,.22)');
    rg.addColorStop(1, 'rgba(28,52,32,0)');
    g.fillStyle = rg;
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  for (let i = 0; i < 8; i++){
    g.strokeStyle = `rgba(0,0,0,${rand(0.1, 0.3).toFixed(2)})`;
    g.lineWidth = rand(0.6, 1.6);
    g.beginPath();
    let x = rand(0, 200), y = rand(0, 200);
    g.moveTo(x, y);
    for (let k = 0; k < 4; k++){ x += rand(-22, 22); y += rand(-22, 22); g.lineTo(x, y); }
    g.stroke();
  }
  // холодный оттенок «вшит» в тайл, чтобы не заливать весь экран каждый кадр
  g.fillStyle = 'rgba(10,26,28,0.10)';
  g.fillRect(0, 0, 200, 200);
  return ctx.createPattern(t, 'repeat');
}
const floorPattern = makeFloorPattern();

/* ---------------------------- audio ---------------------------- */
let AC = null, master = null, noiseBuf = null, revIn = null;

function makeRoomIR(seconds, decay){
  const rate = AC.sampleRate;
  const len = Math.max(1, Math.floor(rate * seconds));
  const buf = AC.createBuffer(2, len, rate);
  // ранние отражения + диффузный хвост: звук «на открытом полигоне», а не в бочке
  const reflL = [0.009, 0.017, 0.029, 0.043, 0.061, 0.083];
  const reflR = [0.012, 0.021, 0.033, 0.049, 0.067, 0.091];
  for (let ch = 0; ch < 2; ch++){
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++){
      const t = i / len;
      const fadeIn = Math.min(1, i / (rate * 0.003));
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay) * fadeIn;
    }
    const refl = ch ? reflR : reflL;
    for (let k = 0; k < refl.length; k++){
      const idx = Math.min(len - 1, Math.floor(rate * refl[k]));
      const amp = 0.55 * Math.pow(0.68, k) * (ch ? -1 : 1);
      d[idx] += amp;
      if (idx + 1 < len) d[idx + 1] += amp * 0.4;
    }
  }
  return buf;
}

function initAudio(){
  if (!AC){
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain();
      master.gain.value = 0.5;
      // мягкий лимитер, чтобы залпы и взрывы не клиппили
      const comp = AC.createDynamicsCompressor();
      comp.threshold.value = -18;
      comp.knee.value = 18;
      comp.ratio.value = 7;
      comp.attack.value = 0.002;
      comp.release.value = 0.22;
      // убираем инфраниз и цифровой «шип» сверху
      const hp = AC.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 28; hp.Q.value = 0.6;
      const lp = AC.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 15500; lp.Q.value = 0.5;
      master.connect(hp); hp.connect(lp); lp.connect(comp);
      comp.connect(AC.destination);
      // короткое «помещение» для хвоста выстрелов
      try {
        revIn = AC.createGain();
        revIn.gain.value = 1;
        const conv = AC.createConvolver();
        conv.buffer = makeRoomIR(0.55, 2.8);
        const wet = AC.createGain();
        wet.gain.value = 0.34;
        revIn.connect(conv);
        conv.connect(wet);
        wet.connect(comp);
      } catch (e){ revIn = null; }
      // iOS умеет уходить в 'interrupted' (звонок, Siri, переключение устройства):
      // как только контекст вернулся в running — тихо «пингуем», чтобы граф ожил.
      try {
        AC.addEventListener('statechange', () => {
          if (AC && AC.state === 'running') silencePing();
        });
      } catch (e){}
    } catch (e){ AC = null; }
  }
  if (AC && (AC.state === 'suspended' || AC.state === 'interrupted')){
    try {
      const p = AC.resume();
      if (p && p.catch) p.catch(() => {});
    } catch (e){}
  }
}

/* Тихий однокадровый буфер. На iOS именно он «протаскивает» AudioContext
   в running внутри пользовательского жеста (pointerdown/touchend/click). */
function silencePing(){
  if (!AC) return;
  try {
    const buf = AC.createBuffer(1, 1, 22050);
    const src = AC.createBufferSource();
    src.buffer = buf;
    src.connect(AC.destination);
    src.start(0);
  } catch (e){}
}

function unlockAudio(){
  if (!AC) initAudio();
  if (!AC) return;
  // Safari 17+: категория playback — звук играет даже при выключенном
  // переключателе «Без звука» на iPhone. Без этого WebAudio глушится.
  try {
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
  } catch (e){}
  // пинг синхронно, пока жест ещё «живой»
  silencePing();
  if (AC.state !== 'running'){
    try {
      const p = AC.resume();
      if (p && p.then) p.then(silencePing).catch(() => {});
    } catch (e){}
  }
}

// Разблокировка обязана случиться в жесте. capture — раньше игровых обработчиков,
// и до того, как меню/старт боя успеют что-то перерисовать.
for (const ev of ['pointerdown', 'touchstart', 'touchend', 'click', 'keydown']){
  window.addEventListener(ev, unlockAudio, { capture: true, passive: true });
}

function getNoise(){
  if (!noiseBuf){
    noiseBuf = AC.createBuffer(1, Math.floor(AC.sampleRate * 0.6), AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}

function noiseBurst(dur, freq, gain, type){
  if (!AC) return;
  const t = AC.currentTime;
  const src = AC.createBufferSource();
  src.buffer = getNoise();
  src.loop = true;
  const f = AC.createBiquadFilter();
  f.type = type || 'lowpass';
  f.frequency.value = freq;
  f.Q.value = 0.7;
  const g = AC.createGain();
  g.gain.setValueAtTime(Math.max(0.0002, gain), t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t);
  src.stop(t + dur + 0.03);
}

function tone(dur, f0, f1, gain, type){
  if (!AC) return;
  const t = AC.currentTime;
  const o = AC.createOscillator();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(Math.max(0.0002, gain), t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.03);
}

/* Слоистый «акустический» выстрел: щелчок, вспышка, низ, хвост.
   Каждый слой можно отправить в общее помещение (wet). */
function shotNoise(dur, gain, type, f0, f1, delay, q, wet){
  if (!AC) return;
  const t0 = AC.currentTime + Math.max(0, (delay || 0) + rand(-0.0015, 0.0015));
  const src = AC.createBufferSource();
  src.buffer = getNoise();
  src.loop = true;
  const f = AC.createBiquadFilter();
  f.type = type || 'lowpass';
  f.Q.value = q || 0.85;
  f.frequency.setValueAtTime(Math.max(24, f0), t0);
  if (f1) f.frequency.exponentialRampToValueAtTime(Math.max(24, f1), t0 + dur);
  const g = AC.createGain();
  const peak = Math.max(0.0002, gain * rand(0.93, 1.07));
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + Math.min(0.005, dur * 0.3));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(master);
  if (wet && revIn){
    const send = AC.createGain();
    send.gain.value = wet;
    g.connect(send); send.connect(revIn);
  }
  src.start(t0);
  src.stop(t0 + dur + 0.03);
}

function shotTone(dur, f0, f1, gain, type, delay){
  if (!AC) return;
  const t0 = AC.currentTime + Math.max(0, (delay || 0) + rand(-0.0012, 0.0012));
  const o = AC.createOscillator();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(Math.max(20, f0), t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  const g = AC.createGain();
  const peak = Math.max(0.0002, gain * rand(0.94, 1.06));
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.03);
}

/* металлический лязг затвора / помпы */
function metalClick(delay, gain){
  shotNoise(0.028, gain, 'highpass', 4600, 2600, delay, 1.2, 0);
  shotTone(0.045, 1700 + Math.random() * 500, 850, gain * 0.22, 'square', delay);
}

/* сверхзвуковой «щелчок» пули — очень короткий и яркий */
function superCrack(gain, delay){
  shotNoise(0.012, gain, 'highpass', 12000, 6500, delay || 0, 0.55, 0);

}

}

/* раскладка мобильного HUD/управления (пересчитывается на лету) */
function mobileLayout(){
  const m = mobileScale();
  const land = isLandscapeMobile();
  const minSide = Math.min(cw, ch);
  const stickR = Math.min(land ? 74 : 84, Math.max(land ? 44 : 48, minSide * (land ? 0.15 : 0.15)));
  const edgeX = land ? Math.min(SAFE.l, SAFE.r) : 0;
  const margin = stickR + Math.max(10, (land ? 13 : 18) * m) + edgeX;
  const bottom = ch - SAFE.b;
  const moveHome = { x: SAFE.l + margin, y: bottom - margin };
  const aimHome  = { x: cw - SAFE.r - margin, y: bottom - margin };
  const r = Math.max(19, Math.min(30, 23 * m));
  const bw = r * 2;
  const gap = Math.max(5, 8 * m);
  const total = bw * 5 + gap * 4;
  // в горизонтали кнопки у самого низа, между стиками; в портрете — над ними
  const rowY = land
    ? bottom - r - Math.max(8, 10 * m)
    : bottom - margin - stickR - Math.max(40 * m, r * 1.5 + 10);
  const startX = Math.max(SAFE.l + r + 4, Math.min(cw - SAFE.r - total + r - 4, cw / 2 - total / 2 + r));
  const labels = ['РЫВОК', 'ПАТР', 'ГРАН', 'ОРУЖ', 'ПАУЗА'];
  const acts = ['dash', 'reload', 'grenade', 'weapon', 'pause'];
  const buttons = labels.map((label, i) => ({
    x: startX + i * (bw + gap), y: rowY, r, label, act: acts[i]
  }));
  return { m, stickR, margin, moveHome, aimHome, buttons, rowY };
}

function startStick(s, id, x, y, R){
  s.id = id; s.active = true;
  s.ox = x; s.oy = y; s.x = x; s.y = y;
  s.dx = 0; s.dy = 0; s.mag = 0; s.R = R;
}

function moveStick(s, x, y){
  const dx = x - s.ox, dy = y - s.oy;
  const d = Math.hypot(dx, dy);
  const R = s.R || 60;
  const nx = d ? dx / d : 0, ny = d ? dy / d : 0;
  const mag = Math.min(1, d / R);
  s.mag = mag;
  s.dx = nx * mag; s.dy = ny * mag;
  s.x = s.ox + nx * Math.min(d, R);
  s.y = s.oy + ny * Math.min(d, R);
}

function resetStick(s){
  s.id = -1; s.active = false;
  s.dx = 0; s.dy = 0; s.mag = 0;
}

/* сброс всех касаний: поворот экрана, сворачивание игры */
function resetInputs(){
  mouse.down = false;
  resetStick(touch.move);
  resetStick(touch.aim);
  touch.pressed = null;
}

function cycleWeapon(){
  const owned = GUN_ORDER.filter(k => player.guns[k] && player.guns[k].owned);
  if (owned.length < 2) return;
  const i = owned.indexOf(player.cur);
  switchWeapon(owned[(i + 1) % owned.length]);
}

function pressAction(act){
  if (act === 'dash') dash();
  else if (act === 'reload') startReload();
  else if (act === 'grenade') throwGrenade();
  else if (act === 'weapon') cycleWeapon();
  else if (act === 'pause') state.mode = 'paused';
}

function bossForWave(wave){
  const idx = Math.max(0, Math.floor(wave / 5) - 1);
  const cycle = Math.floor(idx / BOSS_LIST.length);
  const b = BOSS_LIST[idx % BOSS_LIST.length];
  return { ...b, name: b.name + (cycle > 0 ? ' МК' + (cycle + 1) : ''), cycle };
}

/* --------------------------- helpers ---------------------------- */
function pointInWall(x, y, pad){
  pad = pad || 0;
  for (const w of walls){
    if (x > w.x - pad && x < w.x + w.w + pad && y > w.y - pad && y < w.y + w.h + pad) return true;
  }
  return false;
}

function circleRect(cx, cy, r, w){
  const nx = clamp(cx, w.x, w.x + w.w);
  const ny = clamp(cy, w.y, w.y + w.h);
  return dist2(cx, cy, nx, ny) < r * r;
}

function tryMove(e, dx, dy){
  if (dx){
    e.x += dx;
    for (const w of walls){
      if (circleRect(e.x, e.y, e.r, w)){
        if (dx > 0) e.x = w.x - e.r;
        else e.x = w.x + w.w + e.r;
      }
    }
  }
  if (dy){
    e.y += dy;
    for (const w of walls){
      if (circleRect(e.x, e.y, e.r, w)){
        if (dy > 0) e.y = w.y - e.r;
        else e.y = w.y + w.h + e.r;
      }
    }
  }
}

function findFreeSpot(cx, cy, r, minD, maxD){
  for (let i = 0; i < 60; i++){
    const a = rand(0, TAU);
    const d = rand(minD, maxD);
    const x = clamp(cx + Math.cos(a) * d, r + 60, WORLD.w - r - 60);
    const y = clamp(cy + Math.sin(a) * d, r + 60, WORLD.h - r - 60);
    if (!pointInWall(x, y, r + 12)) return { x, y };
  }
  return { x: clamp(cx, 80, WORLD.w - 80), y: clamp(cy, 80, WORLD.h - 80) };
}

function spawnZombie(type, at){
  const p = at
    ? findFreeSpot(at.x, at.y, 20, 0, 56)
    : findFreeSpot(player.x, player.y, 20, 620, 900);
  let spec = ENEMY_SPECS[type] || ENEMY_SPECS.walker;
  let boss = null;

  if (type === 'boss'){
    boss = bossForWave(state.wave);
    const cycleMul = Math.pow(3, boss.cycle);
    spec = {
      hp: boss.hp * cycleMul,
      speed: boss.speed * (1 + boss.cycle * 0.08),
      r: boss.r,
      dmg: Math.round(boss.dmg * (1 + boss.cycle * 0.18)),
      score: Math.round(boss.score * cycleMul),
      color: boss.color
    };
  }

  const waveScale = 1 + state.wave * (type === 'boss' ? 0.06 : 0.055);
  const hp = Math.round(spec.hp * waveScale);
  const z = {
    id: zid++,
    type,
    x: p.x, y: p.y,
    r: spec.r,
    hp,
    maxHp: hp,
    speed: spec.speed * (1 + state.wave * (type === 'boss' ? 0.008 : 0.012)),
    dmg: spec.dmg,
    score: Math.round(spec.score * (1 + state.wave * 0.08)),
    color: spec.color,
    armor: spec.armor || 0,
    face: rand(0, TAU),
    wob: rand(0, TAU),
    atkCd: rand(0.2, 0.8),
    hitFlash: 0,
    burnT: 0, burnTick: 0,
    kx: 0, ky: 0,
    // способности
    spitCd: rand(1.4, 2.6),
    dashCd: rand(1.5, 3),
    dashT: 0, dashA: 0,
    warn: 0,
    chargeCd: 3.5, chargeT: 0, chargeA: 0, chargePending: false,
    slamCd: 3.0, slamPending: false,
    summonCd: 3.5,
    screamCd: rand(1.6, 3.2), buffT: 0,
    trailCd: 1.0,
    blinkCd: rand(1.8, 3.4),
    fuse: 0,
    dead: false
  };

  if (boss){
    z.bossKind = boss.key;
    z.bossName = boss.name;
    z.bossStyle = boss.style;
    z.bossAccent = boss.accent;
    z.bossEyes = boss.eyes;
  }

  // подсветка, чтобы врагов было видно в темноте
  z.glow = boss ? boss.accent : (spec.glow || spec.color);
  z.rim = boss ? boss.accent : lighten(spec.glow || spec.color, 0.55);
  z.skin = lighten(spec.color, 0.1);

  zombies.push(z);
  return z;
}

function pickType(){
  const w = state.wave;
  const bag = [['walker', Math.max(4, 10 - w * 0.25)]];
  if (w >= 2) bag.push(['runner', 5 + Math.min(6, w * 0.4)]);
  if (w >= 2) bag.push(['crawler', 3.5 + Math.min(5, w * 0.3)]);
  if (w >= 3) bag.push(['spitter', 3 + Math.min(4, w * 0.25)]);
  if (w >= 3) bag.push(['brute', 1.2 + Math.min(3, w * 0.14)]);
  if (w >= 4) bag.push(['bloater', 2.6 + Math.min(4, w * 0.2)]);
  if (w >= 4) bag.push(['hound', 2.4 + Math.min(4, w * 0.18)]);
  if (w >= 6) bag.push(['stalker', 2.4 + Math.min(4, w * 0.18)]);
  if (w >= 5) bag.push(['bomber', 2 + Math.min(3, w * 0.14)]);
  if (w >= 8) bag.push(['armored', 2 + Math.min(4, w * 0.16)]);
  if (w >= 7) bag.push(['shrieker', 1.2 + Math.min(2.4, w * 0.1)]);
  if (w >= 9) bag.push(['splitter', 1.4 + Math.min(2.6, w * 0.11)]);
  if (w >= 11) bag.push(['wraith', 1.2 + Math.min(2.6, w * 0.1)]);

  let total = 0;
  for (const e of bag) total += e[1];
  let r = Math.random() * total;
  for (const e of bag){
    r -= e[1];
    if (r <= 0) return e[0];
  }
  return 'walker';
}

    addParticle({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,

      color: pick(['#9cff4a', '#6fcf2a', '#d6ff8a', '#4a8a1a']),

    });

      x, y, vx: rand(-40, 40), vy: rand(-90, -20),
      life: rand(0.8, 1.8), max: 1.8, size: rand(8, 20),
      color: '#5a6a2a', drag: 0.005, grav: 0, kind: 'smoke'
    });
  }
  for (const o of zombies){
    if (o.dead) continue;
    const ox = o.x - x, oy = o.y - y;
    const od = hypot(ox, oy);
    if (od < radius + o.r){
      const fall = 1 - clamp((od - o.r) / radius, 0, 1);
      damageZombie(o, 28 + fall * 46, ox / (od || 1), oy / (od || 1), false, 1.2 + fall, false);
    }
  }
  const pd = hypot(player.x - x, player.y - y);
  if (pd < radius && state.mode === 'playing'){
    hurtPlayer(Math.round(10 + 16 * (1 - clamp(pd / radius, 0, 1))), 'acid');
  }
  sfx('acid');
}

    addParticle({

      life: rand(0.25, 0.6), max: 0.6, size: rand(4, 12),
      color: pick(['#ffd34a', '#ff8a2a', '#ff4a1a']), drag: 0.003, grav: 0, kind: 'fire'
    });
  }
  for (let i = 0; i < 14; i++){
    addParticle({
      x: z.x, y: z.y, vx: rand(-60, 60), vy: rand(-90, -20),
      life: rand(0.7, 1.6), max: 1.6, size: rand(8, 20),
      color: '#4a4038', drag: 0.006, grav: 0, kind: 'smoke'
    });
  }
  for (const o of zombies){
    if (o.dead || o === z) continue;
    const ox = o.x - z.x, oy = o.y - z.y;
    const od = hypot(ox, oy);
    if (od < R + o.r){
      const fall = 1 - clamp((od - o.r) / R, 0, 1);
      damageZombie(o, 55 + fall * 70, ox / (od || 1), oy / (od || 1), false, 1.6, Math.random() < 0.5);
    }
  }
  const pd = hypot(player.x - z.x, player.y - z.y);
  if (pd < R && state.mode === 'playing'){
    hurtPlayer(Math.round(14 + 22 * (1 - clamp(pd / R, 0, 1))));
  }
  sfx('boom');
}

/* мины: летят, взводятся и ждут врага */
function updateMines(dt){
  for (let i = mines.length - 1; i >= 0; i--){
    const m = mines[i];
    m.t += dt;
    if (m.armT > 0){
      m.armT -= dt;
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      const k = Math.pow(0.015, dt);
      m.vx *= k; m.vy *= k;
      if (pointInWall(m.x, m.y, 8)){
        m.x -= m.vx * dt; m.y -= m.vy * dt;
        m.vx *= -0.35; m.vy *= -0.35;
      }
      m.x = clamp(m.x, 20, WORLD.w - 20);
      m.y = clamp(m.y, 20, WORLD.h - 20);
      if (Math.random() < dt * 20){
        addParticle({
          x: m.x, y: m.y, vx: rand(-10, 10), vy: rand(-24, -6),
          life: rand(0.3, 0.6), max: 0.6, size: rand(3, 6),
          color: 'rgba(140,150,130,1)', drag: 0.008, grav: -6, kind: 'smoke'
        });
      }
    } else {
      m.blink += dt;
      for (const z of zombies){
        if (!z.dead && dist2(m.x, m.y, z.x, z.y) < (z.r + 18) * (z.r + 18)){
          mineBoom(m);
          mines.splice(i, 1);
          break;
        }
      }
      if (mines[i] !== m) continue;
      if (Math.random() < dt * 3){
        addParticle({
          x: m.x, y: m.y, vx: rand(-8, 8), vy: rand(-20, -4),
          life: 0.35, max: 0.35, size: 2,
          color: '#9aff9a', drag: 0.01, grav: -4, kind: 'spark'
        });
      }
    }
    if (m.t > 30) mines.splice(i, 1);
  }
}

/* деляга: после смерти распадается на ползунов */
function splitOnDeath(z){
  if (zombies.length > (IS_MOBILE ? 48 : 80)) return;
  const n = 3;
  for (let i = 0; i < n; i++){
    const a = (i / n) * TAU + rand(-0.3, 0.3);

    });

    addParticle({
      x: c.x, y: c.y, vx: 0, vy: 0, life: 0.35, max: 0.35,
      size: 20, color: '#9ac86a', drag: 0, grav: 0, kind: 'ring'
    });

  sfx('squelch');
}

/* --------------------------- pickups ---------------------------- */
function spawnPickup(type, x, y, weapon){
  const s = findFreeSpot(x, y, 18, 0, 40);
  pickups.push({ type, weapon: weapon || null, x: s.x, y: s.y, t: rand(0, TAU), life: 0 });
}

function dropLoot(z){
  if (z.type === 'boss'){
    // босс всегда роняет случайный ещё не открытый ствол
    const locked = GUN_ORDER.filter(k => k !== 'pistol' && !player.guns[k].owned);
    spawnPickup('health', z.x + 40, z.y);
    spawnPickup('ammo', z.x - 40, z.y);
    spawnPickup('weapon', z.x, z.y + 40, locked.length ? pick(locked) : null);
    spawnPickup('grenade', z.x, z.y - 46);
    spawnPickup('fire', z.x + 46, z.y - 46);
    spawnPickup('armor', z.x - 46, z.y + 46);
    spawnPickup('acidres', z.x + 46, z.y + 46);
    return;
  }
  const r = Math.random();
  if (r < 0.055) spawnPickup('ammo', z.x, z.y);
  else if (r < 0.095) spawnPickup('health', z.x, z.y);
  else if (r < 0.12) spawnPickup('grenade', z.x, z.y);
  else if (r < 0.165) spawnPickup('fire', z.x, z.y);
  else if (r < 0.186) spawnPickup('armor', z.x, z.y);
  else if (r < 0.204) spawnPickup('acidres', z.x, z.y);
}

function applyPickup(p){
  if (p.type === 'health'){
    player.hp = Math.min(player.maxHp, player.hp + 35);
    sfx('pickup');
    burstText('+35 HP', '#7fe08a');
  } else if (p.type === 'ammo'){
    for (const k of GUN_ORDER){
      if (k === 'pistol') continue;
      const g = player.guns[k];
      if (!g.owned) continue;
      g.reserve = Math.min(WEAPONS[k].reserveMax, g.reserve + Math.ceil(WEAPONS[k].reserveMax * 0.55));
    }
    player.grenades = Math.min(player.maxGrenades, player.grenades + 1);
    sfx('pickup');
    burstText('+ ПАТРОНЫ +ГРАНАТА', '#ffcf6a');
  } else if (p.type === 'grenade'){
    player.grenades = Math.min(player.maxGrenades, player.grenades + 2);
    sfx('pickup');
    burstText('+2 ГРАНАТЫ', '#ff9a3a');
    floatText(p.x, p.y - 12, '+2 ГРАНАТЫ', '#ff9a3a', 15);
  } else if (p.type === 'fire'){
    player.fireT = Math.min(30, player.fireT + 15);
    sfx('pickup');
    burstText('ОГНЕННЫЕ ПАТРОНЫ', '#ffb03a');
    floatText(p.x, p.y - 12, '+15 СЕК ОГНЯ', '#ffb03a', 15);
  } else if (p.type === 'armor'){
    const before = player.armor;
    player.armor = Math.min(player.maxArmor, player.armor + ARMOR_PICKUP);
    const got = Math.round(player.armor - before);
    sfx('pickup');
    if (got > 0){
      burstText('+' + got + ' БРОНИ', '#8fd8ff');
      floatText(p.x, p.y - 12, '+' + got + ' БРОНЯ', '#8fd8ff', 15);
    } else {
      burstText('БРОНЯ УЖЕ ПОЛНА', '#8fd8ff');
      floatText(p.x, p.y - 12, 'МАКС', '#8fd8ff', 15);
    }
  } else if (p.type === 'acidres'){
    player.acidResistT = Math.min(ACID_RESIST_TIME * 2, player.acidResistT + ACID_RESIST_TIME);
    sfx('pickup');
    burstText('ЗАЩИТА ОТ КИСЛОТЫ', '#9cff4a');
    floatText(p.x, p.y - 12, '−65% КИСЛОТЫ', '#9cff4a', 15);
  } else if (p.type === 'weapon'){
    let chosen = null;
    if (p.weapon && !player.guns[p.weapon].owned) chosen = p.weapon;
    if (!chosen){
      const locked = GUN_ORDER.filter(k => k !== 'pistol' && !player.guns[k].owned);
      if (locked.length) chosen = pick(locked);
    }
    if (chosen){
      const g = player.guns[chosen];
      g.owned = true;
      g.mag = WEAPONS[chosen].mag;
      g.reserve = Math.max(g.reserve, Math.ceil(WEAPONS[chosen].reserveMax * 0.5));
      player.cur = chosen;
      player.reloadT = 0;
      state.pickupMsg = 'ВЫ ПОДОБРАЛИ';
      state.pickupSub = WEAPONS[chosen].name;
      state.pickupColor = '#ffd06a';
      state.pickupT = 2.4;
      burstText(WEAPONS[chosen].name, '#ffd06a');
      sfx('weapon');
    } else {
      for (const k of GUN_ORDER){
        if (k === 'pistol') continue;
        const g = player.guns[k];
        if (!g.owned) continue;
        g.reserve = Math.min(WEAPONS[k].reserveMax, g.reserve + Math.ceil(WEAPONS[k].reserveMax * 0.5));
      }
      burstText('+ ПАТРОНЫ', '#ffcf6a');
      sfx('pickup');
    }
  }
}

function burstText(text, color){

  state.popupT = 1.2;

function stampBlood(x, y, amount, colorPrefix, scale){
  const k = scale || 1;
  for (let i = 0; i < amount; i++){
    const a = rand(0, TAU);
    const d = rand(0, 24) * k;
    const rx = rand(2, 8) * k;
    const ry = rand(1.5, 6) * k;
    dctx.save();
    dctx.translate(x + Math.cos(a) * d, y + Math.sin(a) * d);
    dctx.rotate(rand(0, TAU));
    dctx.fillStyle = colorPrefix + rand(0.12, 0.45).toFixed(2) + ')';
    dctx.beginPath();
    dctx.ellipse(0, 0, rx, ry, 0, 0, TAU);
    dctx.fill();
    dctx.restore();
  }
}

function stampCorpse(z){
  const big = z.type === 'boss';
  dctx.save();
  dctx.translate(z.x, z.y);
  dctx.rotate(rand(0, TAU));
  const s = z.r * (big ? 2.2 : 1.5);
  dctx.fillStyle = 'rgba(70,10,10,0.34)';
  dctx.beginPath(); dctx.ellipse(0, 0, s * 1.7, s * 1.35, 0, 0, TAU); dctx.fill();
  dctx.fillStyle = 'rgba(26,34,22,0.92)';
  dctx.beginPath(); dctx.ellipse(0, 0, s, s * 0.7, 0, 0, TAU); dctx.fill();
  dctx.strokeStyle = 'rgba(30,38,26,0.9)';
  dctx.lineWidth = Math.max(3, z.r * 0.32);
  dctx.lineCap = 'round';
  for (let i = 0; i < 4; i++){
    const a = rand(0, TAU);
    dctx.beginPath();
    dctx.moveTo(Math.cos(a) * s * 0.4, Math.sin(a) * s * 0.4);
    dctx.lineTo(Math.cos(a) * s * 1.35, Math.sin(a) * s * 1.2);
    dctx.stroke();
  }
  dctx.fillStyle = 'rgba(74,22,18,0.5)';
  dctx.beginPath(); dctx.arc(rand(-6, 6), rand(-6, 6), z.r * 0.5, 0, TAU); dctx.fill();
  dctx.restore();
  stampBlood(z.x, z.y, big ? 40 : 10, 'rgba(120,10,10,', big ? 2 : 1.2);
}

/* -------------------------- gore / fx --------------------------- */
function addPool(x, y, r, color, harm){

  const col = color || '150,12,12';
  pools.push({
    x: x + rand(-6, 6), y: y + rand(-6, 6),
    r: r * rand(0.7, 1.15), max: r * rand(1.6, 2.3),
    life: rand(26, 46), t: 0,
    color: col,
    harm: harm || 0,
    lobes: Array.from({ length: 5 }, () => ({
      a: rand(0, TAU), d: rand(0.15, 0.8), s: rand(0.35, 0.75)
    }))
  });
}

function spawnGib(x, y, dirx, diry, size, color, kind, speed){
  if (gibs.length > 160) gibs.shift();
  const a = Math.atan2(diry, dirx) + rand(-1.1, 1.1);
  const sp = (speed || 1) * rand(90, 430);
  gibs.push({
    x, y,
    vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
    r: size,
    rot: rand(0, TAU),
    spin: rand(-14, 14),
    life: rand(2.4, 5.5), max: 5.5,
    color,
    kind,
    grounded: false,
    bounce: 1
  });
}

function spawnDismember(z, power, dirx, diry){
  const pw = clamp(power || 1, 1, 5);
  const dx = dirx || rand(-1, 1), dy = diry || rand(-1, 1);
  const base = z.type === 'boss' ? 2.2 : z.type === 'brute' ? 1.5 : 1;
  const count = Math.round(clamp(2 + pw * 1.4, 3, 10) * base);
  const skin = z.color || '#7fae4a';
  const kinds = ['limb', 'limb', 'arm', 'head', 'chunk'];
  for (let i = 0; i < count; i++){
    const kind = i === 0 && z.type !== 'runner' ? 'head' : pick(kinds);
    const size = kind === 'head' ? z.r * 0.42 : kind === 'chunk' ? rand(2.5, 5.5) : z.r * rand(0.18, 0.3);
    spawnGib(z.x, z.y, dx, dy, size, Math.random() < 0.25 ? '#b02020' : skin, kind, 0.8 + pw * 0.55);
  }
  // фонтан крови в сторону выстрела
  const n = Math.round(18 + pw * 12) * (z.type === 'boss' ? 2 : 1);
  for (let i = 0; i < n; i++){
    const a = Math.atan2(dy, dx) + rand(-0.7, 0.7);
    const sp = rand(90, 620) * (0.8 + pw * 0.15);
    addParticle({
      x: z.x, y: z.y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.35, 1.0), max: 1, size: rand(2, 6.5),
      color: pick(['#c21818', '#e01f1f', '#9e0f0f']),
      drag: 0.0025, grav: 0, kind: 'blood'
    });
  }
  addPool(z.x, z.y, z.r * (1.1 + pw * 0.22), z.type === 'boss' ? '170,12,12' : '150,12,12');
  splatterScreen(Math.round(2 + pw * 2.4) * (z.type === 'boss' ? 2 : 1));
}

function floatText(x, y, text, color, size){
  if (texts.length > 60) texts.shift();
  texts.push({
    x: x + rand(-9, 9), y: y - 8,
    text, color: color || '#fff0b8',
    size: size || 16,
    vy: rand(-80, -40),
    life: 0.85, max: 0.85
  });
}

function splatterScreen(amount){
  for (let i = 0; i < amount; i++){
    if (screenBlood.length > 70) screenBlood.shift();
    const edge = Math.random() < 0.55;
    screenBlood.push({
      x: edge ? (Math.random() < 0.5 ? rand(0, cw * 0.28) : rand(cw * 0.72, cw)) : rand(0, cw),
      y: edge ? rand(0, ch) : (Math.random() < 0.5 ? rand(0, ch * 0.24) : rand(ch * 0.76, ch)),
      r: rand(16, 74),
      rot: rand(0, TAU),
      life: rand(0.9, 2.2), max: 2.2,
      alpha: rand(0.24, 0.62)
    });
  }
}

function addShock(x, y, r, color, width){
  shockwaves.push({ x, y, r: 8, max: r, life: 0.45, maxLife: 0.45, color: color || '#ffd27a', w: width || 3 });
}

function throwGrenade(){
  if (state.mode !== 'playing') return;
  if (player.grenadeCd > 0 || player.reloadT > 0) return;
  if (player.grenades <= 0){ burstText('ГРАНАТ НЕТ', '#ff6a6a'); sfx('empty'); player.grenadeCd = 0.35; return; }
  player.grenades--;
  player.grenadeCd = 0.45;
  const mx = player.x + Math.cos(player.aim) * (player.r + 16);
  const my = player.y + Math.sin(player.aim) * (player.r + 16);
  grenades.push({
    x: mx, y: my,
    vx: Math.cos(player.aim) * 900 + player.vx * 0.35,
    vy: Math.sin(player.aim) * 900 + player.vy * 0.35,
    fuse: 1.25, rot: 0, spin: rand(-16, 16),
    z: 18, vz: 300, r: 7
  });
  player.vx -= Math.cos(player.aim) * 30;
  player.vy -= Math.sin(player.aim) * 30;
  state.shake = Math.min(16, state.shake + 0.9);
  sfx('throw');
}

function explode(x, y){

  state.shake = Math.min(24, state.shake + 12);
  state.flash = Math.max(state.flash, 0.55);
  state.hitstop = Math.max(state.hitstop, 0.055);
  addShock(x, y, R * 1.15, '#ffd27a', 6);
  addShock(x, y, R * 0.72, '#ff8a3a', 3);
  flashes.push({ x, y, a: rand(0, TAU), life: 0.12, max: 0.12, size: 150 });
  addPool(x, y, 40, '70,18,8');

  // огненный шар
  for (let i = 0; i < 46; i++){
    const a = rand(0, TAU), sp = rand(60, 620);
    addParticle({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.22, 0.65), max: 0.65, size: rand(4, 16),
      color: pick(['#ffdd66', '#ffab33', '#ff6a1f', '#fff3b0']),
      drag: 0.004, grav: 0, kind: 'fire'
    });
  }
  for (let i = 0; i < 30; i++){
    const a = rand(0, TAU), sp = rand(20, 260);
    addParticle({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.7, 1.6), max: 1.6, size: rand(8, 22),
      color: '#4a4a48', drag: 0.006, grav: 0, kind: 'smoke'
    });
  }
  for (let i = 0; i < 26; i++){
    const a = rand(0, TAU), sp = rand(120, 760);
    addParticle({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.2, 0.5), max: 0.5, size: rand(1, 3),
      color: '#ffe9a8', drag: 0.003, grav: 0, kind: 'spark'
    });
  }

  // выжженное пятно + кровь
  dctx.save();
  dctx.translate(x, y);
  const rg = dctx.createRadialGradient(0, 0, 0, 0, 0, 118);
  rg.addColorStop(0, 'rgba(10,8,7,0.72)');
  rg.addColorStop(0.55, 'rgba(28,20,14,0.42)');
  rg.addColorStop(1, 'rgba(40,26,16,0)');
  dctx.fillStyle = rg;
  dctx.beginPath(); dctx.arc(0, 0, 118, 0, TAU); dctx.fill();
  dctx.restore();
  stampBlood(x, y, 26, 'rgba(120,10,10,', 2);

  // урон по врагам
  for (const z of zombies){
    if (z.dead) continue;
    const dx = z.x - x, dy = z.y - y;
    const d = hypot(dx, dy);
    if (d > R + z.r) continue;
    const fall = 1 - clamp((d - z.r) / R, 0, 1);
    const dmg = 42 + fall * 128;
    damageZombie(z, dmg, dx / (d || 1), dy / (d || 1), fall > 0.8, 1.8 + fall * 2.4);
  }
  // задеть игрока
  const pd = hypot(player.x - x, player.y - y);
  if (pd < R && state.mode === 'playing'){
    const fall = 1 - clamp(pd / R, 0, 1);
    hurtPlayer(Math.round(4 + fall * 16));
  }
  sfx('boom');
}

function updateGrenades(dt){
  for (let i = grenades.length - 1; i >= 0; i--){
    const g = grenades[i];
    g.fuse -= dt;
    g.rot += g.spin * dt;

    // полёт с отскоками от стен
    const nx = g.x + g.vx * dt;
    const ny = g.y + g.vy * dt;
    if (pointInWall(nx, g.y, g.r)){
      g.vx *= -0.5;
      g.vy *= 0.82;
      sfx('bounce');
    } else {
      g.x = nx;
    }
    if (pointInWall(g.x, ny, g.r)){
      g.vy *= -0.5;
      g.vx *= 0.82;
      sfx('bounce');
    } else {
      g.y = ny;
    }
    g.vx *= Math.pow(0.18, dt);
    g.vy *= Math.pow(0.18, dt);

    if (g.z > 0 || g.vz > 0){
      g.z += g.vz * dt;
      g.vz -= 1500 * dt;
      if (g.z <= 0){
        g.z = 0;
        if (Math.abs(g.vz) > 90){ g.vz = -g.vz * 0.35; sfx('bounce'); }
        else g.vz = 0;
      }
    }

    // трассер-искра
    if (Math.random() < 0.55){
      addParticle({
        x: g.x, y: g.y - g.z, vx: rand(-18, 18), vy: rand(-18, 18),
        life: rand(0.15, 0.35), max: 0.35, size: rand(1, 2.4),
        color: '#ffcf6a', drag: 0.002, grav: 0, kind: 'spark'
      });
    }

    if (g.fuse <= 0){
      grenades.splice(i, 1);
      explode(g.x, g.y);
    }
  }
}

function updateGibs(dt){
  for (let i = gibs.length - 1; i >= 0; i--){
    const g = gibs[i];
    g.life -= dt;

    if (!g.grounded){
      const k = Math.pow(0.02, dt);
      g.vx *= k; g.vy *= k;
      g.x += g.vx * dt;
      g.y += g.vy * dt;
      g.rot += g.spin * dt;
      if (pointInWall(g.x, g.y, 0) || hypot(g.vx, g.vy) < 26){
        g.grounded = true;
        stampBlood(g.x, g.y, g.kind === 'head' ? 4 : 2, 'rgba(140,12,12,', 1.1);
        if (g.kind === 'head' || Math.random() < 0.5){
          addPool(g.x, g.y, g.r * 0.9, '140,12,12');
        }
      }
    } else {
      g.rot += g.spin * dt * 0.1;
    }

    if (g.life <= 0){
      stampBlood(g.x, g.y, 2, 'rgba(130,10,10,', 1);
      gibs.splice(i, 1);
    }
  }
}

function updatePools(dt){
  for (let i = pools.length - 1; i >= 0; i--){
    const p = pools[i];
    p.life -= dt;
    p.t += dt;
    if (p.harm > 0 && state.mode === 'playing'){
      const rr = p.r * 0.8;
      if (dist2(player.x, player.y, p.x, p.y) < rr * rr) hurtPlayer(p.harm, 'acid');
    }
    if (p.life <= 0) pools.splice(i, 1);
  }
}

function updateTexts(dt){
  for (let i = texts.length - 1; i >= 0; i--){
    const t = texts[i];
    t.life -= dt;
    t.y += t.vy * dt;
    t.vy *= Math.pow(0.2, dt);
    if (t.life <= 0) texts.splice(i, 1);
  }
}

function updateScreenBlood(dt){
  for (let i = screenBlood.length - 1; i >= 0; i--){
    const b = screenBlood[i];
    b.life -= dt;
    if (b.life <= 0) screenBlood.splice(i, 1);
  }
}

function updateShockwaves(dt){
  for (let i = shockwaves.length - 1; i >= 0; i--){
    const s = shockwaves[i];
    s.life -= dt;
    s.r = lerp(s.r, s.max, 1 - Math.pow(0.0015, dt));
    if (s.life <= 0) shockwaves.splice(i, 1);
  }
}

/* ---------------------------- input ----------------------------- */
window.addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;

  if (e.code === 'Escape'){
    if (state.mode === 'playing') state.mode = 'paused';
    else if (state.mode === 'paused') state.mode = 'playing';
    else if (state.mode === 'select') state.mode = 'menu';
  }
  if (e.code === 'KeyR'){
    if (state.mode === 'dead') openSelect();
    else if (state.mode === 'playing') startReload();
  }
  if (e.code === 'KeyF'){
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
    else document.exitFullscreen?.().catch(() => {});
  }
  if (state.mode === 'select'){
    if (e.code === 'Digit1' || e.code === 'ArrowLeft' || e.code === 'KeyA') cycleSelect(-1);
    else if (e.code === 'Digit2' || e.code === 'ArrowRight' || e.code === 'KeyD') cycleSelect(1);
    else if (e.code === 'Enter' || e.code === 'Space') selectHero(HERO_ORDER[state.selectIndex]);
  } else if (state.mode === 'playing'){
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') dash();
    const digit = ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5', 'Digit6', 'Digit7', 'Digit8', 'Digit9'].indexOf(e.code);
    if (digit >= 0 && digit < GUN_ORDER.length) switchWeapon(GUN_ORDER[digit]);
  } else if (state.mode === 'menu' && (e.code === 'Enter' || e.code === 'Space')){
    openSelect();
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function canvasPos(e){
  const r = cvs.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (cw / (r.width || cw)),
    y: (e.clientY - r.top) * (ch / (r.height || ch))
  };
}

cvs.addEventListener('pointermove', e => {
  const p = canvasPos(e);
  if (e.pointerType === 'mouse'){
    mouse.x = p.x; mouse.y = p.y; mouse.moved = true;
    if (state.mode === 'select'){
      const i = heroCardAt(p.x, p.y);
      if (i >= 0) state.selectIndex = i;
    }
    return;
  }
  if (!IS_MOBILE) return;
  if (touch.move.id === e.pointerId) moveStick(touch.move, p.x, p.y);
  else if (touch.aim.id === e.pointerId) moveStick(touch.aim, p.x, p.y);
});

cvs.addEventListener('pointerdown', e => {
  initAudio();
  const p = canvasPos(e);
  if (e.pointerType === 'mouse'){
    mouse.x = p.x; mouse.y = p.y; mouse.moved = true;
  }

  if (state.mode === 'menu'){ openSelect(); return; }
  if (state.mode === 'select'){
    // тап по любой из двух карточек сразу запускает выбранного бойца
    const i = heroCardAt(p.x, p.y);
    if (i >= 0){ state.selectIndex = i; selectHero(HERO_ORDER[i]); }
    return;
  }
  if (state.mode === 'dead'){ openSelect(); return; }
  if (state.mode === 'paused'){ state.mode = 'playing'; return; }
  if (state.mode !== 'playing') return;

  if (e.pointerType === 'mouse'){
    if (e.button === 2){ throwGrenade(); return; }
    if (e.button !== 0) return;
    mouse.down = true;
    return;
  }

  if (!IS_MOBILE) return;
  if (e.pointerType === 'touch') e.preventDefault();
  touch.used = true;
  try { cvs.setPointerCapture(e.pointerId); } catch (_){}

  // кнопки действий
  const L = mobileLayout();
  for (const b of L.buttons){
    if (dist2(p.x, p.y, b.x, b.y) <= (b.r * 1.5) * (b.r * 1.5)){
      pressAction(b.act);
      touch.pressed = { id: e.pointerId, act: b.act };
      return;
    }
  }
  // левая половина — движение, правая — прицел и огонь
  if (p.x < cw / 2) startStick(touch.move, e.pointerId, p.x, p.y, L.stickR);
  else {
    startStick(touch.aim, e.pointerId, p.x, p.y, L.stickR);
    mouse.down = true;
    // мгновенный прицел в точку касания относительно игрока
    const psx = (player.x - view.x) * zoom, psy = (player.y - view.y) * zoom;
    const adx = p.x - psx, ady = p.y - psy;
    const ad = hypot(adx, ady);
    if (ad > 24){
      touch.aim.dx = adx / ad;
      touch.aim.dy = ady / ad;
      touch.aim.mag = 1;
      touch.aim.x = touch.aim.ox + touch.aim.dx * touch.aim.R;
      touch.aim.y = touch.aim.oy + touch.aim.dy * touch.aim.R;
    }
  }
});

function endPointer(e){
  mouse.down = false;
  if (e.pointerType !== 'touch' && e.pointerType !== 'pen') return;
  if (touch.move.id === e.pointerId) resetStick(touch.move);
  if (touch.aim.id === e.pointerId) resetStick(touch.aim);
  if (touch.pressed && touch.pressed.id === e.pointerId) touch.pressed = null;
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);
cvs.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('blur', () => {
  resetInputs();
  for (const k in keys) keys[k] = false;
  if (state.mode === 'playing') state.mode = 'paused';
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state.mode === 'playing') state.mode = 'paused';
});

  player.heroId = hero.id;
  player.maxHp = hero.hp;
  player.rofMul = hero.rofMul;
  player.dashCdMax = hero.dashCd;
  player.dashPower = hero.dashPower;
  localStorage.setItem('dead_sector_hero', hero.id);

  zombies.length = 0;
  bullets.length = 0;
  enemyBullets.length = 0;
  particles.length = 0;
  pickups.length = 0;
  flashes.length = 0;
  gibs.length = 0;
  pools.length = 0;
  texts.length = 0;

  player.inv = 0;
  player.hurtT = 0;
  player.dashCd = 0;
  player.dashT = 0;
  player.reloadT = 0;
  player.cooldown = 0.4;
  player.autoReloadT = 0;
  player.grenades = 3;
  player.grenadeCd = 0;
  player.fireT = 0;
  player.cur = 'pistol';
  player.guns = {};
  for (const k of GUN_ORDER){
    player.guns[k] = {
      mag: WEAPONS[k].mag,

      owned: k === 'pistol'
    };

function openSelect(){
  if (!HEROES[state.heroId]) state.heroId = 'volk';
  state.selectIndex = Math.max(0, HERO_ORDER.indexOf(state.heroId));
  state.mode = 'select';
  mouse.down = false;
}

function selectHero(id){
  if (!HEROES[id]) id = 'volk';

  state.selectIndex = HERO_ORDER.indexOf(id);

function cycleSelect(dir){

/* Две карточки бойцов видны одновременно — как на десктопе.
   В портрете это узкие высокие карточки, в горизонтали — широкие «лежачие». */
function mobileSelectLayout(){
  const m = mobileScale();
  const landscape = ch <= cw;
  const sw = safeW();
  const gap = Math.max(8, 10 * m);
  const side = Math.max(8, 10 * m);
  const cardW = (sw - side * 2 - gap) / 2;

  const titleFs = landscape
    ? Math.min(22 * m, sw / 16, ch * 0.08)
    : Math.min(32 * m, sw / 10, ch * 0.075);
  const subFs = Math.max(8.5, Math.min(12 * m,
    sw / (landscape ? 62 : 38), ch * 0.04));
  const titleY = SAFE.t + titleFs + 3 * m;
  const subY = titleY + subFs * 1.7;
  const cardTop = subY + subFs * 1.35 + (landscape ? 5 : 8) * m;

  const hintFs = Math.max(8.5, Math.min(11 * m, sw / (landscape ? 52 : 34)));
  const hintY = ch - SAFE.b - 5 * m;
  const availH = Math.max(180, hintY - hintFs * 1.8 - cardTop);

  let cardH = availH;
  let cardY = cardTop;
  if (!landscape){
    // в портрете не растягиваем две узкие карточки на всю высоту экрана
    cardH = Math.min(availH, Math.max(430, cardW * 3.3));
    cardY = cardTop + Math.max(0, (availH - cardH) * 0.4);
  }
  const x0 = SAFE.l + side;
  const cards = [0, 1].map(i => ({
    x: x0 + i * (cardW + gap), y: cardY, w: cardW, h: cardH
  }));

  return {
    landscape, m, u: landscape ? 0.62 : Math.max(0.32, Math.min(1.1, cardW / 300)),
    gap, side, cardW, cardH, cardY, cards,
    titleFs, titleY, subFs, subY, hintFs, hintY, availH,
    // старые поля оставлены для совместимости тестов и внешнего API
    tabW: cardW, tabH: cardH, tabsY: cardY, tabsX0: x0, tabGap: gap,
    x: cards[0].x, y: cards[0].y, w: cardW, h: cardH
  };
}

function selectTabRect(i){
  const L = mobileSelectLayout();
  return L.cards[clamp(i | 0, 0, L.cards.length - 1)];
}

function selectLayout(){
  if (IS_MOBILE) return mobileSelectLayout();
  const u = Math.min(ui, ch / 1080);
  const w = 430 * u, h = 600 * u, gap = 44 * u;
  const total = w * 2 + gap;
  return {
    u, w, h, gap,
    x0: cw / 2 - total / 2,
    y0: ch / 2 - h / 2 + 24 * u
  };
}

function selectScale(){
  return selectLayout().u;
}

function heroCardRect(i){
  const L = selectLayout();
  if (IS_MOBILE){
    const idx = clamp(i | 0, 0, L.cards.length - 1);
    return L.cards[idx];
  }
  return { x: L.x0 + i * (L.w + L.gap), y: L.y0, w: L.w, h: L.h };
}

function heroCardAt(x, y){
  if (IS_MOBILE){
    const L = mobileSelectLayout();
    for (let i = 0; i < L.cards.length; i++){
      const r = L.cards[i];
      if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return i;
    }
    return -1;
  }
  for (let i = 0; i < HERO_ORDER.length; i++){
    const r = heroCardRect(i);
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return i;
  }
  return -1;
}

function banner(text, sub){
  state.banner = text;
  state.bannerT = 2.6;
  if (sub !== undefined) state.bannerSub = sub;
}

/* с какой волны появляется новый тип и как он называется в HUD */
const ENEMY_UNLOCKS = {
  2: ['runner', 'crawler'],
  3: ['spitter', 'brute'],
  4: ['bloater', 'hound'],
  5: ['bomber'],
  6: ['stalker'],
  7: ['shrieker'],
  8: ['armored'],
  9: ['splitter'],
  11: ['wraith']
};
const ENEMY_NAMES = {
  walker: 'МУРАВЕЙ-СОЛДАТ', runner: 'МУРАВЕЙ-БЕГУН', crawler: 'ЛИЧИНКА',
  spitter: 'КИСЛОТНЫЙ ЖУК', bloater: 'ЖУК-БОМБАРДИР', hound: 'БОГОМОЛ',
  bomber: 'ЖУК-СМЕРТНИК', shrieker: 'СВЕРЧОК-КРИКУН', splitter: 'ЖУК-ДЕЛЯГА',
  armored: 'ЖУК-БРОНЕВИК', stalker: 'ОСА-СТАЛКЕР', wraith: 'ПРИЗРАЧНАЯ МОЛЬ',
  brute: 'ЖУК-ГРОМИЛА'
};

function beginWave(){
  state.wave++;
  state.waveState = 'fight';
  state.spawnLeft = 5 + Math.floor(state.wave * 2.6 + state.wave * state.wave * 0.14);
  state.spawnTimer = 0.25;
  state.bossPending = state.wave % 5 === 0;
  state.bossSpawned = false;

  // объявление новых врагов на этой волне
  const fresh = ENEMY_UNLOCKS[state.wave];
  if (fresh){
    state.unlockText = 'НОВЫЙ ВРАГ: ' + fresh.map(k => ENEMY_NAMES[k]).join(' + ');
    state.unlockT = 9;
  }

  banner('ВОЛНА ' + state.wave, state.bossPending ? 'ОБНАРУЖЕН: ' + bossForWave(state.wave).name : 'ВСЕХ УНИЧТОЖИТЬ');
}

function clearWave(){
  state.waveState = 'break';
  state.breakT = 4.2;
  const bonus = 60 + state.wave * 25;
  state.score += bonus;
  banner('СЕКТОР ЗАЧИЩЕН', '+' + bonus + ' ОЧКОВ');
  spawnPickup('health', player.x, player.y);
  spawnPickup('ammo', player.x, player.y);
  spawnPickup('grenade', player.x, player.y);
  if (state.wave % 2 === 0) spawnPickup('fire', player.x, player.y);
  if (state.wave % 3 === 0) spawnPickup('armor', player.x, player.y);
  if (state.wave % 4 === 0) spawnPickup('acidres', player.x, player.y);
  sfx('wave');
}

function gameOver(){
  state.mode = 'dead';
  state.flash = 0.8;
  state.shake = 18;
  if (state.score > state.best){
    state.best = state.score;
    localStorage.setItem('dead_sector_best', String(state.best));
  }
  sfx('boom');
  mouse.down = false;
}

/* -------------------------- weapons ----------------------------- */
function switchWeapon(k){
  if (!player.guns[k] || !player.guns[k].owned) return;
  if (player.cur === k) return;
  player.cur = k;
  player.reloadT = 0;
  player.autoReloadT = 0;
  sfx('reload');
}

function startReload(){
  const w = WEAPONS[player.cur];
  const g = player.guns[player.cur];
  if (!g || player.reloadT > 0 || g.mag >= w.mag) return;
  if (g.reserve <= 0) { sfx('empty'); return; }
  player.reloadT = w.reload;
  sfx('reload');
}

function finishReload(){
  const w = WEAPONS[player.cur];
  const g = player.guns[player.cur];
  const need = w.mag - g.mag;
  if (Number.isFinite(g.reserve)){
    const take = Math.min(need, g.reserve);
    g.mag += take;
    g.reserve -= take;
  } else {
    g.mag = w.mag;
  }
  player.reloadT = 0;
  sfx('reload');
}

function shoot(){
  const w = WEAPONS[player.cur];
  const g = player.guns[player.cur];
  if (!g || player.cooldown > 0 || player.reloadT > 0) return;
  if (g.mag <= 0){
    if (g.reserve > 0) startReload();
    else { player.cooldown = 0.25; sfx('empty'); }
    return;
  }

  g.mag--;
  player.cooldown = w.rof * player.rofMul;

  const spread = w.spread * (player.moving ? 1.5 : 1);
  const fiery = player.fireT > 0;
  const mzx = player.x + Math.cos(player.aim) * (player.r + 14);
  const mzy = player.y + Math.sin(player.aim) * (player.r + 14);

  if (w.mine){
    // мина вылетает вперёд, тормозит и встаёт на землю
    mines.push({
      x: mzx, y: mzy,
      vx: Math.cos(player.aim) * w.speed,
      vy: Math.sin(player.aim) * w.speed,
      armT: 0.7, t: 0, blink: 0, r: 11
    });
    if (mines.length > 14) mines.shift();
  } else {
    for (let i = 0; i < w.pellets; i++){
      const a = player.aim + rand(-spread, spread);
      const dmg = w.dmg * (Math.random() < 0.12 ? 2 : 1);
      const crit = dmg > w.dmg;
      bullets.push({
        x: mzx, y: mzy,
        vx: Math.cos(a) * w.speed * rand(0.96, 1.04),
        vy: Math.sin(a) * w.speed * rand(0.96, 1.04),
        r: w.rail ? 4 : w.flame ? 7 : w.rocket ? 5 : 3,
        dmg, life: w.life || 1.1,
        pierce: w.pierce || 0,
        hits: new Set(),
        crit,
        fire: fiery || !!w.flame,
        flame: !!w.flame,
        rocket: !!w.rocket,
        rail: !!w.rail,
        color: w.flame ? '#ff8a2a' : (fiery ? '#ff9a3a' : (crit ? '#ff7a3a' : w.color)),
        power: w.pellets > 1 ? 1.7 : (w.dmg >= 60 ? 1.8 : 1)
      });
    }
  }

  player.vx -= Math.cos(player.aim) * w.recoil;
  player.vy -= Math.sin(player.aim) * w.recoil;

  flashes.push({
    x: mzx, y: mzy, a: player.aim,
    life: w.flame ? 0.05 : 0.07, max: 0.07,
    size: w.pellets > 1 ? 68 : w.rocket ? 58 : w.flame ? 30 : w.rail ? 52 : 44
  });

  // искры из дула
  for (let i = 0; i < (w.flame ? 3 : w.pellets > 1 ? 11 : 6); i++){
    const aa = player.aim + rand(-0.55, 0.55);
    const sp = rand(120, 560);
    addParticle({
      x: mzx, y: mzy, vx: Math.cos(aa) * sp, vy: Math.sin(aa) * sp,
      life: rand(0.07, 0.19), max: 0.19, size: rand(0.9, 2.3),
      color: fiery ? pick(['#ff9a3a', '#ffd34a']) : pick(['#ffd98a', '#fff2c8']),
      drag: 0.004, grav: 0, kind: 'spark'
    });
  }
  // пороховой дым (у огнемёта — гуще)
  for (let i = 0; i < (w.flame ? 1 : 2); i++){
    addParticle({
      x: mzx, y: mzy,
      vx: Math.cos(player.aim) * rand(40, 120) + rand(-22, 22),
      vy: Math.sin(player.aim) * rand(40, 120) + rand(-22, 22),
      life: rand(0.3, 0.62), max: 0.62, size: rand(4, 8.5),
      color: i ? 'rgba(150,140,120,1)' : 'rgba(92,88,80,1)',
      drag: 0.01, grav: -8, kind: 'smoke'
    });
  }

  if (!w.flame && !w.mine){
    if (w.pellets > 1){
      for (let i = 0; i < 5; i++) casing(mzx, mzy, player.aim);
    } else {
      casing(mzx, mzy, player.aim);
    }
  }

  state.shake = Math.min(16, state.shake + w.shake * 0.55);
  sfx(w.sfx);

  if (g.mag <= 0 && g.reserve > 0){
    // небольшая задержка перед авто-перезарядкой
    player.autoReloadT = 0.22;
  }
}

/* --------------------------- player ----------------------------- */
function dash(){
  if (player.dashCd > 0 || player.dashT > 0) return;
  let dx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  let dy = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  if (!dx && !dy){ dx = Math.cos(player.aim); dy = Math.sin(player.aim); }
  const l = hypot(dx, dy) || 1;
  dx /= l; dy /= l;
  player.vx = dx * 760 * player.dashPower;
  player.vy = dy * 760 * player.dashPower;
  player.dashT = 0.15;
  player.dashCd = player.dashCdMax;
  player.inv = Math.max(player.inv, 0.28);
  state.shake = Math.min(22, state.shake + 2);
  for (let i = 0; i < 12; i++){
    addParticle({
      x: player.x + rand(-8, 8), y: player.y + rand(-8, 8),
      vx: -dx * rand(30, 160) + rand(-40, 40), vy: -dy * rand(30, 160) + rand(-40, 40),
      life: rand(0.15, 0.4), max: 1, size: rand(1, 3), color: '#7d8f8a',
      drag: 0.002, grav: 0, kind: 'smoke'
    });
  }
  sfx('reload');
}

function updatePlayer(dt){
  const p = player;
  p.now += dt;
  p.cooldown = Math.max(0, p.cooldown - dt);
  p.inv = Math.max(0, p.inv - dt);
  p.dashCd = Math.max(0, p.dashCd - dt);
  p.hurtT = Math.max(0, p.hurtT - dt);
  p.grenadeCd = Math.max(0, p.grenadeCd - dt);
  p.fireT = Math.max(0, p.fireT - dt);
  p.acidResistT = Math.max(0, p.acidResistT - dt);
  if (p.dashT > 0) p.dashT = Math.max(0, p.dashT - dt);

  if (p.reloadT > 0){
    p.reloadT -= dt;
    if (p.reloadT <= 0) finishReload();
  }
  if (p.autoReloadT > 0){
    p.autoReloadT -= dt;
    if (p.autoReloadT <= 0 && p.reloadT <= 0) startReload();
  }

  let ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  let iy = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  if (IS_MOBILE && touch.move.mag > 0.12){
    ix += touch.move.dx;
    iy += touch.move.dy;
  }
  let tx = ix, ty = iy;
  let len = hypot(tx, ty);
  if (len > 1){ tx /= len; ty /= len; len = 1; }
  p.moving = len > 0.12;

  if (p.dashT <= 0){
    const k = 1 - Math.pow(0.00004, dt);
    p.vx = lerp(p.vx, tx * p.speed, k);
    p.vy = lerp(p.vy, ty * p.speed, k);
  } else {
    p.vx *= Math.pow(0.4, dt);
    p.vy *= Math.pow(0.4, dt);
  }

  tryMove(p, p.vx * dt, p.vy * dt);
  p.x = clamp(p.x, p.r + 4, WORLD.w - p.r - 4);
  p.y = clamp(p.y, p.r + 4, WORLD.h - p.r - 4);

  if (IS_MOBILE && touch.aim.active && touch.aim.mag > 0.16){
    p.aim = Math.atan2(touch.aim.dy, touch.aim.dx);
    aimAssist();
  } else if (!IS_MOBILE){
    const wmx = mouse.x / zoom + view.x;
    const wmy = mouse.y / zoom + view.y;
    mouse.wx = wmx; mouse.wy = wmy;
    p.aim = Math.atan2(wmy - p.y, wmx - p.x);
  }
  // на телефоне без правого стика сохраняем последний прицел:
  // иначе фонарь и ствол «прыгают» в сторону камеры после отпускания

  if (mouse.down || (IS_MOBILE && touch.aim.active && touch.aim.mag > 0.16)) shoot();
}

/* небольшое «магнитное» доведение прицела на телефоне,
   чтобы попадать по мелким целям без мыши */
function wrapAngle(a){
  a = (a + Math.PI) % TAU;
  if (a < 0) a += TAU;
  return a - Math.PI;
}

function aimAssist(){
  let bestA = null, bestScore = 1;
  for (const z of zombies){
    if (z.dead) continue;
    const dx = z.x - player.x, dy = z.y - player.y;
    const d = hypot(dx, dy);
    if (d < 10 || d > 640) continue;
    const a = Math.atan2(dy, dx);
    const da = Math.abs(wrapAngle(a - player.aim));
    const tol = 0.24 + Math.min(0.22, (z.r || 10) / d);
    if (da < tol){
      const score = da / tol;
      if (score < bestScore){ bestScore = score; bestA = a; }
    }
  }
  if (bestA !== null) player.aim = bestA;
}

function hurtPlayer(dmg, kind){
  if (player.inv > 0 || state.mode !== 'playing') return;
  let left = dmg;

  // резист от кислоты: режем урон до брони, чтобы она дольше держалась
  if (kind === 'acid' && player.acidResistT > 0) left *= ACID_RESIST_MUL;

  // броня принимает урон на себя, пока не кончится
  let absorbed = 0;
  if (player.armor > 0 && left > 0){
    absorbed = Math.min(player.armor, left);
    player.armor = Math.max(0, player.armor - absorbed);
    left -= absorbed;
  }

  if (absorbed > 0){
    for (let i = 0; i < 7; i++){
      const a = rand(0, TAU), sp = rand(30, 150);
      addParticle({
        x: player.x, y: player.y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: rand(0.15, 0.4), max: 0.4, size: rand(1.2, 2.8),
        color: '#8fd8ff', drag: 0.004, grav: 0, kind: 'spark'
      });
    }
    addParticle({
      x: player.x, y: player.y, vx: 0, vy: 0, life: 0.22, max: 0.22,
      size: player.r * 2.2, color: '#8fd8ff', drag: 0, grav: 0, kind: 'ring'
    });
    sfx('hit');
    if (player.armor <= 0){
      floatText(player.x, player.y - 26, 'БРОНЯ ПРОБИТА', '#8fd8ff', 13);
    }
  }

  // удар полностью погашен бронёй
  if (left <= 0.5){
    player.inv = 0.28;
    state.shake = Math.min(14, state.shake + 3);
    return;
  }

  if (kind === 'acid' && player.acidResistT > 0){
    addParticle({
      x: player.x, y: player.y, vx: 0, vy: 0, life: 0.3, max: 0.3,
      size: player.r * 2.6, color: '#9cff4a', drag: 0, grav: 0, kind: 'ring'
    });
  }

  player.hp -= left;
  player.inv = 0.5;
  player.hurtT = 0.7;
  state.shake = Math.min(26, state.shake + 6);
  state.flash = Math.max(state.flash, 0.4);
  bloodAt(player.x, player.y, 8, '#8a1212');
  sfx('hurt');
  if (player.hp <= 0){
    player.hp = 0;
    gameOver();
  }
}

/* --------------------------- zombies ---------------------------- */
function damageZombie(z, dmg, vx, vy, crit, gibPower, fire){
  if (z.dead) return;
  const armor = z.armor || 0;
  const dealt = dmg * (1 - armor);
  z.hp -= dealt;
  z.hitFlash = 1;
  if (fire){
    z.burnT = Math.max(z.burnT || 0, 2.8);
    for (let i = 0; i < 7; i++){
      addParticle({
        x: z.x + rand(-z.r * 0.6, z.r * 0.6), y: z.y + rand(-z.r * 0.6, z.r * 0.6),
        vx: rand(-70, 70), vy: rand(-120, -30),
        life: rand(0.22, 0.5), max: 0.5, size: rand(2.5, 6),
        color: pick(['#ffcc44', '#ff8a2a', '#ff5a1a']),
        drag: 0.003, grav: 0, kind: 'fire'
      });
    }
  }
  const l = hypot(vx, vy) || 1;
  const kb = (crit ? 240 : 130) * (1 - armor * 0.75);
  z.kx += (vx / l) * kb;
  z.ky += (vy / l) * kb;
  bloodAt(z.x, z.y, crit ? 20 : 10, crit ? '#e01f1f' : '#c21818', vx, vy);
  // кровавый туман вокруг раны
  const nv = hypot(vx, vy) || 1;
  for (let i = 0; i < (crit ? 9 : 4); i++){
    addParticle({
      x: z.x + rand(-z.r * 0.55, z.r * 0.55),
      y: z.y + rand(-z.r * 0.55, z.r * 0.55),
      vx: (vx / nv) * rand(20, 95) + rand(-45, 45),
      vy: (vy / nv) * rand(20, 95) + rand(-45, 45),
      life: rand(0.3, 0.7), max: 0.7, size: rand(3, 7.5),
      color: 'rgba(150,16,16,1)', drag: 0.008, grav: 0, kind: 'smoke'
    });
  }
  addParticle({
    x: z.x, y: z.y, vx: 0, vy: 0, life: 0.18, max: 0.18,
    size: z.r * (crit ? 2.3 : 1.9), color: armor > 0 ? '#d8e0b0' : '#fff0c0', drag: 0, grav: 0, kind: 'ring'
  });
  floatText(z.x, z.y - z.r, Math.round(dealt) + (crit ? '!' : ''), crit ? '#ffb04a' : '#fff0c8', crit ? 20 : 15);
  if (crit) state.hitstop = Math.max(state.hitstop, 0.022);
  state.hitMarkT = crit ? 0.2 : 0.14;
  state.hitMarkCrit = !!crit;
  sfx('hit');
  if (z.hp <= 0) killZombie(z, gibPower || 1, vx, vy);
}

function killZombie(z, power, dirx, diry){
  if (z.dead) return;
  z.dead = true;
  state.kills++;
  state.score += z.score;
  const boss = z.type === 'boss';
  const pw = clamp(power || 1, 1, 5);
  if (z.type === 'bloater') toxicBurst(z.x, z.y, 130, 24);
  if (z.type === 'bomber' && !z.exploded) bomberBoom(z);
  if (z.type === 'splitter') splitOnDeath(z);
  state.shake = Math.min(34, state.shake + (boss ? 22 : 2 + pw * 1.4));
  stampCorpse(z);
  bloodAt(z.x, z.y, boss ? 90 : Math.round(16 + pw * 8), '#c21818');
  for (let i = 0; i < (boss ? 30 : 8); i++){
    addParticle({
      x: z.x, y: z.y,
      vx: rand(-1, 1) * rand(60, 380), vy: rand(-1, 1) * rand(60, 380),
      life: rand(0.4, 1.1), max: 1, size: rand(2, boss ? 10 : 5),
      color: pick(['#4f7a2e', '#6b8a3a', '#8a2a2a']), drag: 0.001, grav: 0, kind: 'chunk'
    });
  }
  // всплеск: цветное кольцо, белая волна и костяные осколки
  addParticle({
    x: z.x, y: z.y, vx: 0, vy: 0, life: 0.34, max: 0.34,
    size: z.r * (boss ? 5.2 : 3.4), color: hexA(z.glow || '#ff6a3a', 0.75),
    drag: 0, grav: 0, kind: 'ring'
  });
  addParticle({
    x: z.x, y: z.y, vx: 0, vy: 0, life: 0.5, max: 0.5,
    size: z.r * (boss ? 7.5 : 4.6), color: 'rgba(255,240,200,0.5)',
    drag: 0, grav: 0, kind: 'ring'
  });
  for (let i = 0; i < (boss ? 14 : 5); i++){
    const a2 = rand(0, TAU), sp2 = rand(120, boss ? 520 : 360);
    addParticle({
      x: z.x, y: z.y, vx: Math.cos(a2) * sp2, vy: Math.sin(a2) * sp2,
      life: rand(0.45, 1.1), max: 1.1, size: rand(1.6, 4),
      color: '#efe6c8', drag: 0.001, grav: 0, kind: 'bone'
    });
  }
  spawnDismember(z, boss ? 4 : pw, dirx, diry);
  floatText(z.x, z.y - z.r - 6, '+' + z.score, boss ? '#ffb45a' : '#ffd06a', boss ? 26 : 18);
  if (boss){
    state.slowmo = Math.max(state.slowmo, 0.6);
    state.hitstop = Math.max(state.hitstop, 0.09);
    addShock(z.x, z.y, 320, z.bossAccent || '#ff8a3a', 5);
    splatterScreen(16);
    banner((z.bossName || 'БОСС') + ' УНИЧТОЖЕН', '+' + z.score + ' ОЧКОВ');
  }
  dropLoot(z);
  sfx(boss ? 'boom' : 'squelch');
  if (boss){
    state.bossSpawned = false;
    state.bossPending = false;
  }
}

function updateZombies(dt){
  const p = player;
  for (let i = zombies.length - 1; i >= 0; i--){
    const z = zombies[i];
    if (z.dead){ zombies.splice(i, 1); continue; }

    z.atkCd = Math.max(0, z.atkCd - dt);
    z.hitFlash = Math.max(0, z.hitFlash - dt * 5);
    z.wob += dt * (z.type === 'runner' ? 16 : z.type === 'brute' ? 7 : 10);

    // с тяжелораненых капает кровь
    if (z.hp < z.maxHp * 0.35 && Math.random() < dt * (z.type === 'boss' ? 11 : 3.2)){
      addParticle({
        x: z.x + rand(-z.r * 0.6, z.r * 0.6),
        y: z.y + rand(-z.r * 0.2, z.r * 0.55),
        vx: rand(-18, 18), vy: rand(8, 42),
        life: rand(0.3, 0.7), max: 0.7, size: rand(1, 2.6),
        color: '#a81414', drag: 0.006, grav: 45, kind: 'blood'
      });
    }
    const kd = Math.pow(0.0008, dt);
    z.kx *= kd; z.ky *= kd;

    const dx = p.x - z.x, dy = p.y - z.y;
    const d = hypot(dx, dy) || 1;
    z.face = lerpAngle(z.face, Math.atan2(dy, dx), 1 - Math.pow(0.0005, dt));

    // ---- таймеры и телеграфы ----
    z.warn = Math.max(0, (z.warn || 0) - dt);
    z.chargeT = Math.max(0, (z.chargeT || 0) - dt);
    z.dashT = Math.max(0, (z.dashT || 0) - dt);
    z.summonCd = (z.summonCd || 0) - dt;
    z.slamCd = (z.slamCd || 0) - dt;
    z.buffT = Math.max(0, (z.buffT || 0) - dt);
    z.screamCd -= dt;
    z.blinkCd -= dt;

    // рывок мясника начинается после предупреждения
    if (z.chargePending && z.warn <= 0){
      z.chargePending = false;
      z.chargeT = 0.55;
      z.chargeA = Math.atan2(dy, dx);
      state.shake = Math.min(22, state.shake + 5);
      addShock(z.x, z.y, 150, '#ff5a3a', 3);
      sfx('throw');
    }
    // слэм колосса
    if (z.slamPending && z.warn <= 0){
      z.slamPending = false;
      addShock(z.x, z.y, 260, '#ffb545', 6);
      addShock(z.x, z.y, 150, '#fff0b0', 3);
      state.shake = Math.min(30, state.shake + 14);
      addPool(z.x, z.y, 55, '80,70,30');
      for (let k = 0; k < 34; k++){
        const a = rand(0, TAU), sp2 = rand(90, 520);
        addParticle({
          x: z.x, y: z.y, vx: Math.cos(a) * sp2, vy: Math.sin(a) * sp2,
          life: rand(0.25, 0.7), max: 0.7, size: rand(3, 10),
          color: pick(['#8a7a4a', '#6a5a3a', '#ffb545']),
          drag: 0.003, grav: 0, kind: 'chunk'
        });
      }
      if (hypot(p.x - z.x, p.y - z.y) < 250) hurtPlayer(24);
      sfx('boom');
    }

    // ---- уникальные способности ----
    if (z.type === 'spitter'){
      z.spitCd -= dt;
      if (z.spitCd <= 0 && d < 720 && d > 70 && p.hp > 0){
        z.spitCd = rand(2.1, 3.0);
        const a = Math.atan2(dy, dx) + rand(-0.07, 0.07);
        shootAcid(z.x + Math.cos(a) * z.r, z.y + Math.sin(a) * z.r, a, 430, 7, 11);
        sfx('acid');
      }
    } else if (z.type === 'stalker'){
      z.dashCd -= dt;
      if (z.dashCd <= 0 && d < 560 && d > 50 && p.hp > 0){
        z.dashCd = rand(2.4, 3.8);
        z.dashT = 0.36;
        z.dashA = Math.atan2(dy, dx);
        addParticle({
          x: z.x, y: z.y, vx: 0, vy: 0, life: 0.26, max: 0.26,
          size: z.r * 2.2, color: '#9ce0a0', drag: 0, grav: 0, kind: 'ring'
        });
      }
    } else if (z.type === 'hound'){
      z.dashCd -= dt;
      if (z.dashCd <= 0 && d < 430 && d > 60 && p.hp > 0){
        z.dashCd = rand(1.5, 2.5);
        z.dashT = 0.26;
        z.dashA = Math.atan2(dy, dx) + rand(-0.05, 0.05);
        addParticle({
          x: z.x, y: z.y, vx: 0, vy: 0, life: 0.2, max: 0.2,
          size: z.r * 1.9, color: '#d8a060', drag: 0, grav: 0, kind: 'ring'
        });
      }
    } else if (z.type === 'bomber'){
      // подбегает и подрывается рядом с игроком
      if (d < 150 && p.hp > 0){
        z.fuse += dt;
        if (Math.random() < dt * 30){
          addParticle({
            x: z.x + rand(-z.r * 0.5, z.r * 0.5), y: z.y + rand(-z.r * 0.5, z.r * 0.5),
            vx: rand(-20, 20), vy: rand(-50, -14),
            life: rand(0.2, 0.4), max: 0.4, size: rand(2, 4),
            color: '#ffcc44', drag: 0.004, grav: 0, kind: 'fire'
          });
        }
        if (z.fuse > 0.6){ z.fuse = 0; bomberBoom(z); killZombie(z, 2, 0, 0); continue; }
      } else {
        z.fuse = Math.max(0, z.fuse - dt * 2);
      }
    } else if (z.type === 'shrieker'){
      // крик: баффает всех рядом
      if (z.screamCd <= 0 && p.hp > 0 && d < 950){
        z.screamCd = rand(4.5, 6.5);
        addShock(z.x, z.y, 430, '#c8a0ff', 4);
        addShock(z.x, z.y, 250, '#f0d0ff', 2);
        state.shake = Math.min(20, state.shake + 4);
        for (const o of zombies){
          if (o.dead || o === z) continue;
          if (dist2(o.x, o.y, z.x, z.y) < 430 * 430) o.buffT = 6;
        }
        for (let k = 0; k < 18; k++){
          const a = rand(0, TAU), sp2 = rand(90, 380);
          addParticle({
            x: z.x, y: z.y, vx: Math.cos(a) * sp2, vy: Math.sin(a) * sp2,
            life: rand(0.25, 0.55), max: 0.55, size: rand(2, 5),
            color: pick(['#c8a0ff', '#9a7ad0', '#f0d0ff']), drag: 0.004, grav: 0, kind: 'spark'
          });
        }
        sfx('scream');
      }
    } else if (z.type === 'wraith'){
      // рывок-телепорт сквозь темноту
      if (z.blinkCd <= 0 && d > 150 && d < 900 && p.hp > 0){
        z.blinkCd = rand(2.4, 4.0);
        const a = Math.atan2(dy, dx);
        const step = Math.min(230, d - 90);
        for (let k = 0; k < 12; k++){
          addParticle({
            x: z.x + rand(-z.r, z.r), y: z.y + rand(-z.r, z.r),
            vx: rand(-40, 40), vy: rand(-40, 40),
            life: rand(0.3, 0.7), max: 0.7, size: rand(4, 10),
            color: pick(['#6a7590', '#4a5470', '#9aa8c8']), drag: 0.004, grav: 0, kind: 'smoke'
          });
        }
        addShock(z.x, z.y, 80, '#8a9acc', 2);
        z.x = clamp(z.x + Math.cos(a) * step, z.r + 20, WORLD.w - z.r - 20);
        z.y = clamp(z.y + Math.sin(a) * step, z.r + 20, WORLD.h - z.r - 20);
        addParticle({
          x: z.x, y: z.y, vx: 0, vy: 0, life: 0.3, max: 0.3,
          size: z.r * 1.8, color: '#9aa8c8', drag: 0, grav: 0, kind: 'ring'
        });
      }
    } else if (z.type === 'boss' && p.hp > 0){
      const style = z.bossStyle;
      const enraged = z.hp < z.maxHp * 0.5;
      const baseA = Math.atan2(dy, dx);

      if (style === 'alpha'){
        z.spitCd -= dt;
        if (z.spitCd <= 0 && d < 1000){
          z.spitCd = enraged ? 1.4 : rand(2.2, 3.0);
          const n = enraged ? 3 : 1;
          for (let k = 0; k < n; k++){
            const a = baseA + (k - (n - 1) / 2) * 0.16;
            shootAcid(z.x + Math.cos(a) * z.r, z.y + Math.sin(a) * z.r, a, 380, 9, 15);
          }
          sfx('acid');
        }
        // король муравей зовёт свиту
        if (z.summonCd <= 0 && zombies.length < 44){
          z.summonCd = enraged ? 4.5 : 7.0;
          const n = enraged ? 3 : 2;
          for (let k = 0; k < n; k++){
            const a = (k / n) * TAU + rand(-0.4, 0.4);
            spawnZombie(pick(['runner', 'walker']), {
              x: z.x + Math.cos(a) * (z.r + 50),
              y: z.y + Math.sin(a) * (z.r + 50)
            });
            addParticle({
              x: z.x + Math.cos(a) * (z.r + 44), y: z.y + Math.sin(a) * (z.r + 44),
              vx: 0, vy: 0, life: 0.38, max: 0.38,
              size: 30, color: '#ffb545', drag: 0, grav: 0, kind: 'ring'
            });
          }
          addShock(z.x, z.y, 170, '#ffb545', 3);
          sfx('wave');
        }
      } else if (style === 'acid'){
        z.spitCd -= dt;
        if (z.spitCd <= 0 && d < 1050){
          z.spitCd = enraged ? 2.1 : 3.0;
          const n = enraged ? 7 : 5;
          for (let k = 0; k < n; k++){
            const a = baseA + (k - (n - 1) / 2) * 0.14;
            shootAcid(z.x + Math.cos(a) * z.r, z.y + Math.sin(a) * z.r, a, 420, 9, 13, { leavePool: true });
          }
          sfx('acid');
        }
        // кислотный след под брюхом
        z.trailCd -= dt;
        if (z.trailCd <= 0){
          z.trailCd = enraged ? 0.45 : 0.8;
          addPool(z.x - Math.cos(z.face) * z.r * 0.4, z.y - Math.sin(z.face) * z.r * 0.4,
            enraged ? 34 : 26, '74,140,22', 3);
          for (let k = 0; k < 5; k++){
            addParticle({
              x: z.x + rand(-z.r * 0.5, z.r * 0.5), y: z.y + rand(-z.r * 0.5, z.r * 0.5),
              vx: rand(-20, 20), vy: rand(-30, -6),
              life: rand(0.3, 0.7), max: 0.7, size: rand(2, 5),
              color: pick(['#9cff4a', '#d6ff8a']), drag: 0.005, grav: 0, kind: 'spark'
            });
          }
        }
      } else if (style === 'mother'){
        z.spitCd -= dt;
        if (z.spitCd <= 0 && d < 900){
          z.spitCd = 3.2;
          const a = baseA + rand(-0.12, 0.12);
          shootAcid(z.x + Math.cos(a) * z.r, z.y + Math.sin(a) * z.r, a, 320, 11, 16);
          sfx('acid');
        }
        if (z.summonCd <= 0 && zombies.length < 44){
          z.summonCd = enraged ? 4.2 : 6.0;
          const n = enraged ? 4 : 3;
          for (let k = 0; k < n; k++){
            const a = (k / n) * TAU + rand(-0.3, 0.3);
            spawnZombie(pick(['walker', 'runner', 'spitter']), {
              x: z.x + Math.cos(a) * (z.r + 56),
              y: z.y + Math.sin(a) * (z.r + 56)
            });
            addParticle({
              x: z.x + Math.cos(a) * (z.r + 50), y: z.y + Math.sin(a) * (z.r + 50),
              vx: 0, vy: 0, life: 0.4, max: 0.4,
              size: 34, color: '#e05aff', drag: 0, grav: 0, kind: 'ring'
            });
          }
          addShock(z.x, z.y, 190, '#e05aff', 4);
          sfx('wave');
        }
      } else if (style === 'butcher'){
        z.chargeCd -= dt;
        if (z.chargeCd <= 0 && !z.chargePending && z.chargeT <= 0 && d < 820){
          z.chargeCd = enraged ? 2.4 : 3.6;
          z.warn = 0.62;
          z.chargePending = true;
          sfx('throw');
        }
      } else if (style === 'colossus'){
        if (z.slamCd <= 0 && d < 280 && !z.slamPending && z.warn <= 0){
          z.slamCd = enraged ? 2.2 : 3.2;
          z.warn = 0.5;
          z.slamPending = true;
          sfx('throw');
        }
        if (z.summonCd <= 0 && zombies.length < 44){
          z.summonCd = enraged ? 7 : 9;
          for (let k = 0; k < 2; k++){
            const a = rand(0, TAU);
            spawnZombie(pick(['armored', 'walker', 'brute']), {
              x: z.x + Math.cos(a) * (z.r + 60),
              y: z.y + Math.sin(a) * (z.r + 60)
            });
          }
          addShock(z.x, z.y, 210, '#ffb545', 4);
          sfx('wave');
        }
      }
    }

    // ---- движение с учётом поведения ----
    let mx = dx / d, my = dy / d;
    let sp = z.speed;

    if (z.type === 'spitter'){
      if (d < 230){ mx = -dx / d; my = -dy / d; sp *= 1.05; }
      else if (d < 330){ const tmp = mx; mx = -my; my = tmp; sp *= 0.65; }
      else if (d > 500) sp *= 1.15;
      else sp *= 0.5;
    } else if (z.type === 'stalker' && z.dashT > 0){
      mx = Math.cos(z.dashA); my = Math.sin(z.dashA); sp = 450;
    } else if (z.type === 'hound' && z.dashT > 0){
      mx = Math.cos(z.dashA); my = Math.sin(z.dashA); sp = 460;
    } else if (z.type === 'crawler'){
      // ползун идёт зигзагом — тяжело попасть
      const perp = Math.sin(state.time * 9 + z.wob) * 0.62;
      mx += (-dy / d) * perp;
      my += (dx / d) * perp;
    } else if (z.type === 'bomber'){
      if (d < 260) sp *= 1.55;
    } else if (z.type === 'wraith'){
      const drift = Math.sin(state.time * 2.4 + z.wob) * 0.4;
      mx += (-dy / d) * drift;
      my += (dx / d) * drift;
      sp *= 1 + Math.sin(state.time * 3 + z.wob) * 0.12;
    } else if (z.type === 'boss'){
      if (z.bossStyle === 'butcher'){
        if (z.warn > 0){ mx = 0; my = 0; sp = 0; }
        else if (z.chargeT > 0){ mx = Math.cos(z.chargeA); my = Math.sin(z.chargeA); sp = 860; }
      } else if (z.bossStyle === 'colossus' && z.warn > 0){
        mx = 0; my = 0; sp = 0;
      } else if ((z.bossStyle === 'mother' && d < 240) ||
                 (z.bossStyle === 'acid' && d < 320) ||
                 (z.bossStyle === 'alpha' && d < 140)){
        mx = -dx / d; my = -dy / d;
      }
    }

    // расталкивание сородичей
    for (const o of zombies){
      if (o === z || o.dead) continue;
      const ox = z.x - o.x, oy = z.y - o.y;
      const od = hypot(ox, oy);
      const md = z.r + o.r;
      if (od > 0.001 && od < md){
        const f = (1 - od / md) * 1.7;
        mx += (ox / od) * f;
